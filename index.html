<script id="quick-entry">
/* =========================================================
   صفحة «تسجيل سريع» (كاونتر) — أيقونة في الشريط الجانبي للأدمن
   بتختار العميل (بالاسم / رقم مكنة فوري أو امان…)، النوع (أو التحصيل)، المبلغ، «سجّل».
   كل تسجيلة بتتضاف على اللي قبلها في نفس الخانة (١٠٠٠ + ١٠٠٠ = ٢٠٠٠) وعميل واحد = صف واحد في اليومية.
   بيتكتب على السيرفر فورًا ويستنى تأكيده، وبيعدّي على نفس سجل التعديلات وقفل اليوم بتوع باقي التطبيق.
   ========================================================= */
(function(){
'use strict';
const LS_LOG = 'tq_qe_log_v1', LS_FIELD = 'tq_qe_field';
const QE = {cid:null, field:null, filter:'all', q:'', recent:[], log:{}, busy:false};
try{ QE.log = JSON.parse(localStorage.getItem(LS_LOG)||'{}') || {}; }catch(e){ QE.log = {}; }
try{ QE.field = localStorage.getItem(LS_FIELD) || null; }catch(e){}
function saveLog(){
  try{
    const keys = Object.keys(QE.log).sort().slice(-4), o = {};
    keys.forEach(k=>{ o[k] = QE.log[k].slice(0,300); });
    QE.log = o; localStorage.setItem(LS_LOG, JSON.stringify(o));
  }catch(e){}
}
const E = s => escapeHtml(s);
const norm = s => String(s||'').toLowerCase()
  .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/\s+/g,' ').trim();
const mno = m => String(m.no).replace(/\s+/g,'').toLowerCase();
const clients = () => sortedClients().filter(([id,c])=>c.active!==false);
const row = id => (state.dayData||{})[id] || {};
const drawnOf = id => r2(sumDrawn(row(id)));
const collOf = id => r2(row(id).collection);
const doneOf = id => !!(drawnOf(id) || collOf(id));
const nameOf = id => (state.clients[id]||{}).name || '؟';
/* الخانات اللي بتتسجل: أنواع المكن + الكاش + التحصيل */
const qcols = () => [...finCols(), ['collection','التحصيل']];
const fieldLabel = k => (qcols().find(x=>x[0]===k)||[0,k])[1];
const shortLabel = k => k==='collection' ? 'تحصيل' : fieldLabel(k);
const logToday = () => QE.log[state.day] || [];
const okEntries = id => logToday().filter(e=>e.id===id && (e.st==='ok'||e.st==='unk') && !e.undone);
const dayWord = () => state.day===todayStr() ? 'النهارده' : 'في يوم '+state.day;
const clock = ts => new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

function statusInfo(id){
  const r = row(id), parts = [];
  finCols().forEach(([k,l])=>{ const v = Number(r[k])||0; if(v) parts.push(`${E(l)} <b class="tnum">${fmt(v)}</b>`); });
  const coll = collOf(id);
  if(coll) parts.push(`تحصيل <b class="tnum">${fmt(coll)}</b>`);
  return {total:drawnOf(id), coll, parts, ops:okEntries(id).length};
}
function machPills(c, hit){
  const ms = machinesOf(c); if(!ms.length) return '';
  const show = (hit && hit.length) ? hit : ms.slice(0,3);
  return `<span class="mc">${show.map(m=>`<span class="pill neutral ${hit&&hit.includes(m)?'hit':''}">${E(machineLabel(m.type))} · <span class="tnum">${E(String(m.no))}</span></span>`).join('')}${!(hit&&hit.length) && ms.length>3 ? `<span class="more">+${ms.length-3}</span>` : ''}</span>`;
}

/* ---------- الإشعار (بالاسم) ---------- */
function note(kind, html){
  const n = $('#qeNote'); if(!n) return;
  n.className = 'qe-note ' + (kind||''); n.innerHTML = html; n.hidden = !html;
}
function noteForPick(id){
  const s = statusInfo(id), nm = E(nameOf(id));
  if(!doneOf(id)) return ['warn', `<span class="big">${nm}</span>لسه <b>ماتسجلش</b> له حاجة ${dayWord()}.`];
  return ['', `<span class="big">${nm}</span>اتسجل له ${dayWord()}: ${s.parts.join(' · ')}${s.ops ? `<br>(${s.ops} تسجيلة من هنا)` : ''}`];
}

/* ---------- هيكل الصفحة (بيتبني مرة، وبعدها بنحدّث الأجزاء بس عشان خانة البحث متفقدش مكانها) ---------- */
function skeleton(){
  return `<div id="qpRoot" class="qp">
    <div class="topbar">
      <div><h1 class="display">تسجيل سريع</h1><div class="sub" id="qpSub"></div></div>
      <div class="daynav">
        <button id="qpPrev" type="button" title="اليوم السابق">‹</button>
        <input type="date" id="qpDay">
        <button id="qpNext" type="button" title="اليوم التالي">›</button>
        <button class="btn sm" id="qpToday" type="button" style="margin-inline-start:4px">اليوم</button>
      </div>
    </div>
    <div class="qe-note" id="qeNote" hidden></div>
    <div id="qeRecentWrap" hidden style="margin-bottom:14px"><div class="qe-lbl" style="margin-bottom:6px">رجوع سريع لآخر اللي سجّلت لهم</div><div class="qe-chips" id="qeRecent"></div></div>
    <div class="qp-grid">
      <section class="card qp-sec qp-pick">
        <h2>العميل</h2>
        <input class="qe-search" id="qeSearch" placeholder="ابحث باسم العميل أو رقم المكنة (فوري / امان…)" autocomplete="off" enterkeyhint="go">
        <div class="qe-chips" id="qeFilters"></div>
        <div class="qe-lbl" id="qeListLbl"></div>
        <div class="qe-list" id="qeList"></div>
      </section>
      <section class="card qp-sec qp-entry">
        <div id="qpEmpty" class="qp-empty"><span class="ico">⚡</span>اختار عميل من القايمة<br>وبعدين النوع والمبلغ وتدوس «سجّل».</div>
        <div id="qeEntry" hidden>
          <div class="qe-cur">
            <div class="qe-cur-top"><span class="nm" id="qeNm"></span><button class="btn sm" id="qeChange" type="button">عميل تاني</button></div>
            <div id="qeMach"></div>
            <div class="qe-cur-st" id="qeSt"></div>
          </div>
          <div class="qe-lbl" style="margin:14px 0 6px">النوع</div>
          <div class="qe-chips" id="qeTypes"></div>
          <div class="qe-lbl" style="margin:14px 0 6px">المبلغ اللي هيتضاف</div>
          <div class="qe-row"><input class="qe-amt" id="qeAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><button class="qe-go" id="qeGo" type="button" disabled>＋ سجّل</button></div>
          <div class="qe-chips" style="margin-top:8px" id="qeQuick"></div>
          <div class="qe-prev" id="qePrev" style="margin-top:8px"></div>
        </div>
      </section>
      <section class="card qp-sec qp-logbox">
        <h2>اللي اتسجل من هنا</h2>
        <div class="qe-log" id="qeLog"></div>
        <div class="qe-sum" id="qeSum"></div>
      </section>
    </div>
  </div>`;
}
function bindPage(){
  $('#qpPrev').onclick  = ()=>{ state.day = shiftDate(state.day,-1); bindDay(state.day); render(); };
  $('#qpNext').onclick  = ()=>{ state.day = shiftDate(state.day,1);  bindDay(state.day); render(); };
  $('#qpToday').onclick = ()=>{ state.day = todayStr(); bindDay(state.day); render(); };
  $('#qpDay').onchange  = e=>{ if(!e.target.value) return; state.day = e.target.value; bindDay(state.day); render(); };
  $('#qeChange').onclick = ()=>{ QE.cid = null; note('',''); refresh(); const s = $('#qeSearch'); if(s){ s.select(); s.focus(); } };
  $('#qeSearch').addEventListener('input', e=>{ QE.q = e.target.value; renderList(); });
  $('#qeSearch').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const first = $('#qeList .qe-item'); if(first){ e.preventDefault(); pick(first.dataset.id, first.dataset.mt); } }
  });
  $('#qeFilters').addEventListener('click', e=>{ const b = e.target.closest('[data-f]'); if(!b) return; QE.filter = b.dataset.f; renderFilters(); renderList(); });
  $('#qeList').addEventListener('click', e=>{ const b = e.target.closest('[data-id]'); if(b) pick(b.dataset.id, b.dataset.mt); });
  $('#qeRecent').addEventListener('click', e=>{ const b = e.target.closest('[data-id]'); if(b) pick(b.dataset.id); });
  $('#qeTypes').addEventListener('click', e=>{
    const b = e.target.closest('[data-k]'); if(!b) return;
    QE.field = b.dataset.k; try{ localStorage.setItem(LS_FIELD, QE.field); }catch(_){}
    renderTypes(); updatePrev(); $('#qeAmt').focus();
  });
  $('#qeQuick').addEventListener('click', e=>{ const b = e.target.closest('[data-v]'); if(!b) return; const a = $('#qeAmt'); a.value = b.dataset.v; updatePrev(); a.focus(); });
  $('#qeAmt').addEventListener('input', updatePrev);
  $('#qeAmt').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  $('#qeGo').onclick = add;
  $('#qeLog').addEventListener('click', e=>{ const b = e.target.closest('[data-undo]'); if(b) undo(Number(b.dataset.undo)); });
}

/* ---------- رسم الأجزاء ---------- */
function renderFilters(){
  const cl = clients(); let yes = 0; cl.forEach(([id])=>{ if(doneOf(id)) yes++; });
  const F = [['all','الكل ('+cl.length+')'],['yes','اتسجلوا ('+yes+')'],['no','لسه ('+(cl.length-yes)+')']];
  $('#qeFilters').innerHTML = F.map(([k,l])=>`<button type="button" class="qe-chip ${QE.filter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
}
function renderList(){
  const q = norm(QE.q), qd = q.replace(/\s+/g,'');
  let arr = clients().map(([id,c])=>{
    const ms = machinesOf(c);
    const mhit = qd ? ms.filter(m=>mno(m).includes(qd)) : [];
    return {id, c, name:c.name, d:drawnOf(id), col:collOf(id), mhit,
      exact: !!qd && ms.some(m=>mno(m)===qd),
      byName: !!q && norm(c.name).includes(q)};
  });
  if(QE.filter==='yes') arr = arr.filter(x=>x.d||x.col); else if(QE.filter==='no') arr = arr.filter(x=>!x.d&&!x.col);
  if(q){
    arr = arr.filter(x=>x.byName || x.mhit.length || x.exact);
    const sc = x=>(x.exact?4:0)+(norm(x.name).startsWith(q)?2:0)+(x.byName?1:0);
    arr.sort((a,b)=>sc(b)-sc(a));
  }
  const total = arr.length; arr = arr.slice(0,60);
  $('#qeListLbl').textContent = total>60 ? 'أول 60 من '+total+' — اكتب الاسم أو رقم المكنة عشان تلاقي العميل' : (total+' عميل');
  $('#qeList').innerHTML = arr.length ? arr.map(x=>{
    const mt = x.mhit.length ? x.mhit[0].type : '';
    const badge = x.d ? '✓ '+fmt(x.d) : (x.col ? '✓ تحصيل '+fmt(x.col) : 'لسه');
    return `<button type="button" class="qe-item" data-id="${E(x.id)}" data-mt="${E(mt)}"><span class="r1"><span class="nm">${E(x.name)}</span><span class="qe-badge ${x.d||x.col?'yes':'no'}">${badge}</span></span>${machPills(x.c, x.mhit)}</button>`;
  }).join('') : '<div class="qe-empty">مفيش عميل بالاسم أو رقم المكنة ده — ضيفه من تبويب «العملاء».</div>';
}
function renderRecent(){
  const ids = QE.recent.filter(id=>id!==QE.cid && state.clients[id]);
  $('#qeRecentWrap').hidden = !ids.length;
  $('#qeRecent').innerHTML = ids.map(id=>{ const d = drawnOf(id)||collOf(id);
    return `<button type="button" class="qe-chip" data-id="${E(id)}">${E(nameOf(id))} <span class="tnum" style="opacity:.75">${d?fmt(d):'—'}</span></button>`; }).join('');
}
function renderTypes(){
  const r = row(QE.cid), cols = qcols();
  $('#qeTypes').innerHTML = cols.map(([k,l])=>{ const v = Number(r[k])||0;
    return (k==='collection' ? '<span class="qe-sep"></span>' : '') +
      `<button type="button" class="qe-chip ${k==='collection'?'coll':''} ${QE.field===k?'on':''}" data-k="${E(k)}">${E(l)}${v?` · <span class="tnum">${fmt(v)}</span>`:''}</button>`; }).join('');
}
function renderEntry(){
  const id = QE.cid, on = !!(id && state.clients[id]);
  $('#qeEntry').hidden = !on; $('#qpEmpty').hidden = on;
  $('#qpRoot').classList.toggle('has-cid', on);
  if(!on) return;
  if(!QE.field || !qcols().some(x=>x[0]===QE.field)) QE.field = qcols()[0][0];
  const c = state.clients[id], s = statusInfo(id), r = row(id);
  $('#qeNm').textContent = c.name;
  $('#qeMach').innerHTML = machPills(c, machinesOf(c));
  const debt = r2(computeNewDebt(r));
  const extra = (Number(r.debtYesterday)||0) || debt ? `<br>آجل أمس <b class="tnum">${fmt(r.debtYesterday||0)}</b> · المديونية الجديدة <b class="tnum">${fmt(debt)}</b>` : '';
  $('#qeSt').innerHTML = (doneOf(id)
    ? `اتسجل ${dayWord()}: ${s.parts.join(' · ')}${s.ops?` · ${s.ops} تسجيلة من هنا`:''}`
    : `<b style="color:var(--warn)">لسه ماتسجلش له حاجة</b> ${dayWord()}`) + extra;
  renderTypes();
  $('#qeQuick').innerHTML = [500,1000,2000,5000].map(v=>`<button type="button" class="qe-chip tnum" data-v="${v}">${fmt(v)}</button>`).join('');
  updatePrev();
}
function updatePrev(){
  const id = QE.cid, f = QE.field; if(!id || !f || !$('#qeAmt')) return;
  const v = Number($('#qeAmt').value)||0, cur = Number(row(id)[f])||0;
  $('#qeGo').disabled = !(v>0);
  $('#qePrev').innerHTML = v>0
    ? `${E(fieldLabel(f))} عند <b>${E(nameOf(id))}</b>: <span class="tnum">${fmt(cur)} + ${fmt(v)} = <b>${fmt(r2(cur+v))}</b></span>`
    : (cur ? `${E(fieldLabel(f))} دلوقتي: <b class="tnum">${fmt(cur)}</b>` : '');
}
const ST = {wait:'⏳', ok:'✓', unk:'⚠', err:'✗'};
function renderLog(){
  const L = logToday();
  $('#qeLog').innerHTML = L.length ? L.slice(0,80).map(e=>
    `<div class="qe-li ${e.undone?'undone':''} ${e.st==='err'?'err':''}">
      <span class="t tnum">${clock(e.ts)}</span><span class="sp"><span class="nm">${E(nameOf(e.id))}</span> · ${E(shortLabel(e.f))} <b class="tnum">+${fmt(e.amt)}</b>
      ${e.st==='ok'||e.st==='unk' ? `<span style="color:var(--fg-dim)">← <span class="tnum">${fmt(e.next)}</span></span>`:''}</span>
      <span title="${e.st==='unk'?'السيرفر لسه مأكدش':''}">${e.undone?'↩':(ST[e.st]||'')}</span>
      ${e.st==='ok'&&!e.undone ? `<button type="button" data-undo="${e.ts}" title="تراجع عن التسجيلة دي" aria-label="تراجع">↩</button>`:''}
    </div>`).join('') : '<div class="qe-empty">لسه مسجلتش حاجة من هنا '+dayWord()+'.</div>';
}
function renderSum(){
  const cl = clients(); let rec = 0, tot = 0, coll = 0;
  cl.forEach(([id])=>{ const d = drawnOf(id), c = collOf(id); if(d||c) rec++; tot += d; coll += c; });
  $('#qeSum').innerHTML = `<span>اتسجل <b>${rec}</b> عميل</span><span>·</span><span>لسه <b>${cl.length-rec}</b></span><span>·</span><span>المسحوبات <b class="tnum">${fmt(r2(tot))}</b></span><span>·</span><span>التحصيل <b class="tnum">${fmt(r2(coll))}</b></span>`;
}
function refresh(){
  if(!$('#qpRoot')) return;
  const today = state.day===todayStr();
  $('#qpSub').innerHTML = `يوم ${E(state.day)}${today?'':' <span class="qp-old">⚠ مش النهارده</span>'}`;
  const di = $('#qpDay'); if(di && document.activeElement!==di) di.value = state.day;
  renderFilters(); renderRecent(); renderEntry(); renderLog(); renderSum();
  if(!QE.cid) renderList();
}
function pick(id, mt){
  QE.cid = id; QE.q = ''; const s = $('#qeSearch'); if(s) s.value = '';
  if(mt && qcols().some(x=>x[0]===mt)){ QE.field = mt; try{ localStorage.setItem(LS_FIELD, mt); }catch(_){} }
  const [k, html] = noteForPick(id); note(k, html);
  const i = QE.recent.indexOf(id); if(i>=0) QE.recent.splice(i,1);
  refresh();
  const a = $('#qeAmt'); if(a){ a.value = ''; updatePrev(); a.focus(); }
}

/* ---------- الفحوصات المشتركة قبل أي كتابة ---------- */
function guard(f, id){
  const date = state.day;
  if(!state.user || state.user.role==='rep') return 'مفيش صلاحية تسجيل';
  if(!state.db || !state.connected) return 'مش متصل بقاعدة البيانات — مفيش حاجة اتسجلت';
  if(isLocked(date)) return 'يوم '+date+' مقفول — افتحه الأول وبعدين سجّل';
  if(state.editField && state.editField!==f) return 'التعديلات مفعّلة على «'+editFieldLabel(state.editField)+'» بس — اقفلها الأول';
  if(hasPend(date, id, f)) return 'فيه رقم لسه متحفظش على الخانة دي في الجدول — احفظه (زرار «حفظ») الأول وبعدين سجّل';
  return '';
}
const withTimeout = p => Promise.race([p.then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'), 10000))]);

/* ---------- التسجيل ---------- */
async function add(){
  if(QE.busy) return;
  const id = QE.cid, f = QE.field, inp = $('#qeAmt'); if(!id || !f || !inp) return;
  const amt = r2(Number(inp.value));
  if(!(amt>0)) return note('err','اكتب مبلغ أكبر من صفر.');
  const bad = guard(f, id); if(bad) return note('err', E(bad));
  QE.busy = true;
  try{
    if(amt>=100000 && !await askConfirm('هتسجّل '+fmt(amt)+' '+shortLabel(f)+' على '+nameOf(id)+' — المبلغ كبير. متأكد؟')){ QE.busy = false; return; }
    const date = state.day, nm = nameOf(id), lbl = fieldLabel(f), sl = shortLabel(f);
    const bad2 = guard(f, id); if(bad2){ QE.busy = false; return note('err', E(bad2)); }
    const base = Number(row(id)[f])||0, next = r2(base+amt);
    const e = {ts:Date.now(), date, id, f, amt, base, next, st:'wait'};
    (QE.log[date] = QE.log[date]||[]).unshift(e); saveLog();
    let p; try{ p = state.db.ref().update({[`days/${date}/${id}/${f}`]: next}); }catch(err){ p = Promise.reject(err); }
    inp.value = ''; updatePrev();
    QE.recent.unshift(id); QE.recent = QE.recent.filter((x,i,a)=>a.indexOf(x)===i).slice(0,7);
    QE.busy = false;               // التسجيلة الجاية متستناش تأكيد السيرفر على اللي قبلها
    note('', `⏳ بسجّل <b>${fmt(amt)}</b> ${E(sl)} على <span class="big">${E(nm)}</span>`);
    refresh(); inp.focus();
    p.then(()=>{ if(e.st==='unk'){ e.st = 'ok'; saveLog(); refresh(); } }).catch(()=>{});
    const ack = await withTimeout(p).catch(err=>err);
    if(ack==='ok'){
      e.st = 'ok'; saveLog();
      const n = okEntries(id).length;
      const debt = f==='collection' ? ` · المديونية الجديدة <b class="tnum">${fmt(r2(computeNewDebt(row(id))))}</b>` : ` · إجمالي مسحوباته <b class="tnum">${fmt(drawnOf(id))}</b>`;
      if(QE.cid===id) note('ok', `✓ <b>اتسجل</b> ${fmt(amt)} ${E(sl)} على <span class="big">${E(nm)}</span>${E(lbl)} عنده دلوقتي <b class="tnum">${fmt(next)}</b>${debt}${n>1?` · التسجيلة رقم ${n}`:''}`);
      else note('ok', `✓ اتسجل ${fmt(amt)} ${E(sl)} على <b>${E(nm)}</b> (${E(lbl)}: ${fmt(next)})`);
      try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
    }else if(ack==='timeout'){
      e.st = 'unk'; saveLog();
      note('warn', `⚠ السيرفر مردّش على تسجيلة <b>${E(nm)}</b> (${fmt(amt)} ${E(sl)}). ممكن تكون <b>لسه ماتسجلتش</b> — راجع النت. لو النت رجع هتتسجل لوحدها وهتتحوّل لـ ✓ هنا.`);
    }else{
      e.st = 'err'; saveLog();
      const denied = /permission/i.test((ack.code||'')+' '+ack.message);
      note('err', `✗ <b>ماتسجلتش</b> تسجيلة ${E(nm)} (${fmt(amt)} ${E(sl)}): ${E(ack.message||'خطأ')}${denied?' — معندكش صلاحية':''}`);
    }
    refresh();
  }catch(err){ QE.busy = false; note('err','✗ حصل خطأ: '+E(err.message||err)); }
}

/* ---------- التراجع ---------- */
async function undo(ts){
  const e = logToday().find(x=>x.ts===ts); if(!e || e.undone || e.st!=='ok') return;
  const bad = guard(e.f, e.id); if(bad) return note('err', E(bad));
  const cur = Number(row(e.id)[e.f])||0, next = r2(cur-e.amt), nm = nameOf(e.id), lbl = fieldLabel(e.f), sl = shortLabel(e.f);
  if(next<0) return note('err','مينفعش أرجّع — الرقم الحالي ('+fmt(cur)+') أقل من المبلغ ده، يعني اتعدّل بعد التسجيل. عدّله من الجدول.');
  const extra = cur!==e.next ? '\n\nانتبه: الرقم الحالي ('+fmt(cur)+') غير اللي اتسجل ساعتها ('+fmt(e.next)+') — يعني حد عدّل بعدها.' : '';
  if(!await askConfirm('ترجّع '+fmt(e.amt)+' '+sl+' من '+nm+'؟ الخانة هتبقى '+fmt(next)+'.'+extra)) return;
  const bad2 = guard(e.f, e.id); if(bad2) return note('err', E(bad2));
  try{
    const ack = await withTimeout(state.db.ref().update({[`days/${e.date}/${e.id}/${e.f}`]: next}));
    if(ack!=='ok') return note('warn','⚠ السيرفر مردّش على التراجع — راجع الجدول قبل ما تكرره.');
    e.undone = true; saveLog();
    note('ok', `↩ اتشال ${fmt(e.amt)} ${E(sl)} من <span class="big">${E(nm)}</span>${E(lbl)} عنده دلوقتي <b class="tnum">${fmt(next)}</b>`);
  }catch(err){ note('err','✗ التراجع فشل: '+E(err.message||err)); }
  refresh();
}

/* ---------- ربط التطبيق: أيقونة في الشريط (للأدمن) + رسم الصفحة ---------- */
ICONS.bolt = '<path d="M13 2L5 14h6l-1 8 8-12h-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';
const _allowed = window.allowedTabs;
window.allowedTabs = function(){
  const r = _allowed.apply(this, arguments), u = state.user;
  if(u && u.role==='admin' && !r.some(t=>t.id==='quick')){
    const item = {id:'quick', label:'تسجيل سريع', title:'تسجيل سريع (كاونتر)', icon:'bolt'};
    const i = r.findIndex(t=>t.id==='capital');
    if(i>=0) r.splice(i, 0, item); else r.push(item);
  }
  return r;
};
function renderQuick(main){
  const pdf = main.querySelector('#tabPdfBtn'); if(pdf) pdf.remove();   // زرار الـPDF مالوش لازمة هنا
  if(!main.querySelector('#qpRoot')){
    main.innerHTML = skeleton(); bindPage(); renderList();
    if(!matchMedia('(pointer:coarse)').matches){ const s = $('#qeSearch'); if(s) s.focus({preventScroll:true}); }
  }
  main.classList.add('wide');
  refresh();
}
const _render = window.render;
window.render = function(){
  const r = _render.apply(this, arguments);
  try{
    if(state.user && state.user.role==='admin' && state.tab==='quick') renderQuick($('#main'));
  }catch(err){ console.error('quick-entry', err); }
  return r;
};
})();
</script>

<script id="home-dashboard">
/* =========================================================
   الصفحة الرئيسية (للأدمن): أرقام الإجماليات في شاشة واحدة
   اليومية: إجمالي التحصيل / المديونية الجديدة / آجل أمس   (نفس أرقام اليومية — العملاء النشطين)
   راس المال والتجميع: بتتجاب من «تقفيلة اليوم» للتاريخ المختار:
     راس المال = رأس المال الجديد · إجمالي التجميع = مجموع الأرصدة (أمان + ممكن + مصاري + المحافظ + آجل السوق + المعلقة)
     العمولة · الفلوس اللي علينا = صافي الموردين بعد التحصيل · صافي التجميع بعد الخصم = إجمالي الأرصدة بعد خصم الموردين
   كله لنفس اليوم المختار، وبيتحدّث لحظيًا مع Firebase. دوسة على أي كارت تفتح تبويبه.
   ========================================================= */
(function(){
'use strict';
const E = s => escapeHtml(s);
ICONS.home = '<path d="M3 11l9-8 9 8M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';

const GROUPS = [
  {title:'اليومية', cards:[
    {k:'coll',  label:'إجمالي التحصيل',    go:'ledger',  sub:'من اليومية'},
    {k:'debtN', label:'المديونية الجديدة', go:'ledger',  sub:'آجل أمس + المسحوبات − التحصيل', sign:'debt'},
    {k:'debtY', label:'آجل أمس',           go:'ledger',  sub:'من اليومية'}]},
  {title:'راس المال والتجميع', cards:[
    {k:'cap',   label:'راس المال',          go:'closing', sub:'رأس المال الجديد من تقفيلة اليوم'},
    {k:'tc',    label:'إجمالي التجميع',     go:'closing', sub:'مجموع الأرصدة قبل خصم الموردين'},
    {k:'com',   label:'العمولة',            go:'closing', sub:'من تقفيلة اليوم', sign:'plain'},
    {k:'owe',   label:'الفلوس اللي علينا',  go:'closing', sub:'صافي الموردين بعد التحصيل'},
    {k:'net',   label:'صافي التجميع بعد الخصم', go:'closing', sub:'إجمالي التجميع − الفلوس اللي علينا', hero:true}]}
];

function calc(){
  const d = state.dayData || {};
  let coll = 0, debtY = 0, debtN = 0;
  sortedClients().forEach(([id,c])=>{
    if(c.active===false) return;
    const r = d[id] || {};
    coll += Number(r.collection)||0; debtY += Number(r.debtYesterday)||0; debtN += computeNewDebt(r);
  });
  /* من تقفيلة اليوم للتاريخ ده (نفس داتا راس المال meta/capital) — لو مفيش داتا: أصفار */
  const cs = (typeof window.closingSummary==='function') ? window.closingSummary(state.day) : {has:false};
  return {has:!!cs.has, coll:capQ(coll), debtY:capQ(debtY), debtN:capQ(debtN),
          cap:cs.cap||0, tc:cs.tc||0, com:cs.com||0, owe:cs.owe||0, net:cs.net||0};
}

function skeleton(){
  return `<div id="hmRoot">
    <div class="topbar">
      <div><h1 class="display">الرئيسية</h1><div class="sub" id="hmSub"></div></div>
      <div class="daynav">
        <button id="hmPrev" type="button" title="اليوم السابق">‹</button>
        <input type="date" id="hmDay">
        <button id="hmNext" type="button" title="اليوم التالي">›</button>
        <button class="btn sm" id="hmToday" type="button" style="margin-inline-start:4px">اليوم</button>
      </div>
    </div>
    ${GROUPS.map((g,gi)=>`<section class="hm-sec"><h2>${E(g.title)}</h2>${gi===1?'<div class="hm-hint" id="hmClHint" hidden></div>':''}<div class="hm-grid">
      ${g.cards.map(c=>`<button type="button" class="hm-card ${c.hero?'hero':''}" data-go="${c.go}" id="hm_${c.k}">
        <span class="l">${E(c.label)}</span><span class="v tnum">0<small>ج.م</small></span><span class="s">${E(c.sub)}</span></button>`).join('')}
    </div></section>`).join('')}
  </div>`;
}
function bind(){
  const go = fn => ()=>{ fn(); bindDay(state.day); render(); };
  $('#hmPrev').onclick  = go(()=>{ state.day = shiftDate(state.day,-1); });
  $('#hmNext').onclick  = go(()=>{ state.day = shiftDate(state.day,1); });
  $('#hmToday').onclick = go(()=>{ state.day = todayStr(); });
  $('#hmDay').onchange  = e=>{ if(!e.target.value) return; state.day = e.target.value; bindDay(state.day); render(); };
  $('#hmRoot').addEventListener('click', e=>{
    const b = e.target.closest('[data-go]'); if(!b) return;
    if(b.dataset.go==='closing' && window.openClosingFor) window.openClosingFor(state.day);   // تقفيلة اليوم تفتح على نفس اليوم
    state.tab = b.dataset.go; render();
  });
}
function refresh(){
  const n = calc();
  $('#hmSub').textContent = 'يوم ' + state.day + (state.day===todayStr() ? ' — النهارده' : '');
  const di = $('#hmDay'); if(di && document.activeElement!==di) di.value = state.day;
  const hint = $('#hmClHint');
  if(hint){ hint.hidden = n.has; hint.textContent = 'مفيش تقفيلة محفوظة ليوم '+state.day+' — دوس على أي كارت هنا عشان تسجلها.'; }
  GROUPS.forEach(g=>g.cards.forEach(c=>{
    const el = $('#hm_'+c.k+' .v'), v = n[c.k]; if(!el) return;
    const cls = c.sign==='debt' ? (v>0?'neg':(v<0?'pos':'')) : (c.k==='com'||c.k==='net' ? (v<0?'neg':(v>0?'pos':'')) : '');
    el.className = 'v tnum ' + cls;
    el.innerHTML = fmt(v) + '<small>ج.م</small>';
  }));
}
function renderHome(main){
  const pdf = main.querySelector('#tabPdfBtn'); if(pdf) pdf.remove();
  if(!main.querySelector('#hmRoot')){ main.innerHTML = skeleton(); bind(); }
  main.classList.remove('wide');
  refresh();
}

/* ---------- ربط التطبيق: أيقونة الرئيسية أول الشريط + تبقى الشاشة الأولى للأدمن ---------- */
const _allowed = window.allowedTabs;
window.allowedTabs = function(){
  const r = _allowed.apply(this, arguments), u = state.user;
  if(u && u.role==='admin' && !r.some(t=>t.id==='home')) r.unshift({id:'home', label:'الرئيسية', title:'الرئيسية — الإجماليات', icon:'home'});
  return r;
};
const _render = window.render;
window.render = function(){
  try{
    resolveUser();
    const u = state.user;
    if(!u) state._homeFor = null;
    else if(u.role==='admin' && state._homeFor!==u.uid){ state._homeFor = u.uid; state.tab = 'home'; }
  }catch(e){}
  const r = _render.apply(this, arguments);
  try{ if(state.user && state.user.role==='admin' && state.tab==='home') renderHome($('#main')); }catch(err){ console.error('home', err); }
  return r;
};
})();
</script>

<script id="daily-closing">
/* =========================================================
   تقفيلة اليوم (Daily Closing) — شكل جديد بيقرا ويكتب في **نفس مكان راس المال القديم**: meta/capital/<التاريخ>
   (نفس المفاتيح: capital · commission · <الماستر>/collect · owe/<المورد> · closing) — فمفيش حاجة اتنقلت ولا اتمسحت.
   مفاتيح جديدة جنبهم بس: prevCapital · expenses · pending · prevManual · snap · createdAt/updatedAt/by.
   رأس المال الجديد = السابق + العمولة − المصروفات   ← بيتخزن في capital (يعني capital = رأس المال الجديد)
   إجمالي الأرصدة   = فوري + أمان + ممكن + مصاري + النقدي + المحافظ + آجل السوق + العمليات المعلقة − فلوس الموردين
   الفرق            = رأس المال الجديد − إجمالي الأرصدة   (صفر = متزنة · أكبر من صفر = عجز · أقل من صفر = زيادة) ← بيتخزن في closing {status, amount}
   آجل السوق: رقم ثابت بيتسحب لوحده من اليومية = «المديونية الجديدة» ليوم التقفيلة (بيتخزن في market/collect).
   فلوس الموردين: بتتجاب لوحدها من تبويب الموردين بالأسامي + خانة تحصيل لكل مورد، والتحصيل بيتضاف على «مسدد» (atomic) — نفس منطق راس المال القديم.
   ========================================================= */
(function(){
'use strict';
const E = s => escapeHtml(s);
const PATH = 'meta/capital';   // نفس مكان راس المال القديم
ICONS.closing = '<rect x="3.5" y="5" width="17" height="15.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4M9 14.5l2.2 2.2L15.5 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';

const FIELDS = [
  {k:'prevCapital', l:'رأس المال السابق', g:'cap', neg:true},
  {k:'commission',  l:'العمولة',          g:'cap', sg:'+'},
  {k:'expenses',    l:'المصروفات',        g:'cap', sg:'−'},
  {k:'fawry',       l:'فوري',             g:'bal', sg:'+', master:true},
  {k:'aman',        l:'أمان',             g:'bal', sg:'+', master:true},
  {k:'mumkin',      l:'ممكن',             g:'bal', sg:'+', master:true},
  {k:'masary',      l:'مصاري',            g:'bal', sg:'+', master:true},
  {k:'cash',        l:'النقدي',           g:'bal', sg:'+', master:true},
  {k:'wallets',     l:'المحافظ',          g:'bal', sg:'+', master:true},
  {k:'market',      l:'آجل السوق',        g:'bal', sg:'+', master:true, auto:true},
  {k:'pending',     l:'العمليات المعلقة', g:'bal', sg:'+'}
];
const MASTERS = FIELDS.filter(f=>f.master).map(f=>f.k);
const STATUS = {balanced:'متزنة', short:'عجز', over:'زيادة'};
const q2 = x => Math.round((Number(x)||0)*100)/100;
const blank = () => { const o = {suppliers:0}; FIELDS.forEach(f=>{ o[f.k] = 0; }); return o; };
const F = {date:null, vals:blank(), owe:{}, liveBal:false, _sig:null, debtRaw:null, debtReady:false, debtErr:'', _debtDate:null, _debtOff:null, prevManual:false, loadedDate:null, dirty:false, saving:false, limit:31, msg:null};

/* ---------- الحسابات (بالقروش عشان مفيش أخطاء كسور عشرية، وكل بند بيتحسب مرة واحدة) ---------- */
function calc(v){
  const c = k => Math.round((Number(v[k])||0)*100);
  const newCap = c('prevCapital') + c('commission') - c('expenses');
  const total  = c('fawry') + c('aman') + c('mumkin') + c('masary') + c('cash') + c('wallets') + c('market') + c('pending') - c('suppliers');
  const diff = newCap - total;
  return {newCapital:newCap/100, totalBalances:total/100, diff:diff/100, status: diff===0 ? 'balanced' : (diff>0 ? 'short' : 'over')};
}

/* ---------- أرقام: منع أي حاجة غير رقمية + فواصل الآلاف أثناء الكتابة ---------- */
const A2L = s => String(s)
  .replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/٫/g,'.').replace(/[٬,،\s]/g,'');
function parseRaw(raw, allowNeg){
  let s = A2L(raw);
  const neg = !!allowNeg && /^[-−–]/.test(s);
  s = s.replace(/[^0-9.]/g,'');
  const dot = s.indexOf('.');
  let ip = dot<0 ? s : s.slice(0,dot);
  const fp = dot<0 ? null : s.slice(dot+1).replace(/\./g,'').slice(0,2);
  ip = ip.replace(/^0+(?=\d)/,'');
  return {neg, ip, fp};
}
const fmtParsed = p => (p.neg?'-':'') + p.ip.replace(/\B(?=(\d{3})+(?!\d))/g,',') + (p.fp!==null ? '.'+p.fp : '');
const valOf = p => { const n = Number((p.neg?'-':'')+(p.ip||'0')+(p.fp?'.'+p.fp:'')); return isFinite(n) ? n : 0; };
const toText = v => (!Number(v)) ? '' : fmtParsed(parseRaw(String(v), true));
function onNumInput(el){
  const neg = el.dataset.neg==='1';
  const pos = el.selectionStart==null ? el.value.length : el.selectionStart;
  const sig = (A2L(el.value.slice(0,pos)).match(/[0-9.]/g)||[]).length;
  const p = parseRaw(el.value, neg), t = fmtParsed(p);
  el.value = t;
  let c = 0, i = 0;
  if(sig>0){ for(; i<t.length; i++){ if(/[0-9.]/.test(t[i])) c++; if(c===sig){ i++; break; } } }
  else i = t.startsWith('-') ? 1 : 0;
  try{ el.setSelectionRange(i,i); }catch(_){}
  return valOf(p);
}

/* ---------- السجل: بيقرا من state.capital (= meta/capital اللي التطبيق أصلًا بيسمعه) ---------- */
const num = x => q2(x);
const isDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d);
function hasData(r){
  if(!r || typeof r!=='object') return false;
  return !!(num(r.capital) || num(r.commission) || num(r.expenses) || num(r.pending) || num(r.prevCapital) || MASTERS.some(k=>num((r[k]||{}).collect)) || (r.owe && Object.keys(r.owe).length) || r.closing);
}
let _cSrc = null, _cOut = {};
const closings = () => {            // كل الأيام اللي فيها داتا (قديمة وجديدة)
  const src = state.capital || {};
  if(src!==_cSrc){ _cSrc = src; _cOut = {}; Object.keys(src).forEach(d=>{ if(isDate(d) && hasData(src[d])) _cOut[d] = src[d]; }); }
  return _cOut;
};
const hist = () => Object.keys(closings()).sort().reverse();
/* فلوس الموردين (الصافي) لتقفيلة: الجديدة (snap) من اللقطة المحفوظة، والقديمة من أرصدة الموردين الحالية زي ما كان بيحصل في راس المال */
function recSuppliersNet(r){
  if(r.snap){ let t = 0; Object.values(r.owe||{}).forEach(x=>{ t += q2(x && x.bal) - q2(x && x.col); }); return q2(t); }
  let t = 0; Object.values(state.suppliers||{}).forEach(sp=>{ if(sp && sp.name) t += capSupBal(sp); }); return q2(t);
}
/* قيم التقفيلة في شكل موحّد. القديمة (من غير prevCapital) بنستنتج السابق = capital − العمولة + المصروفات، فرأس المال الجديد بيطلع نفس capital المسجلة بالظبط */
function recVals(r){
  const v = blank();
  v.commission = num(r.commission); v.expenses = num(r.expenses); v.pending = num(r.pending);
  MASTERS.forEach(k=>{ v[k] = num((r[k]||{}).collect); });
  v.prevCapital = r.prevCapital!==undefined && r.prevCapital!==null ? num(r.prevCapital) : q2(num(r.capital) - v.commission + v.expenses);
  v.suppliers = recSuppliersNet(r);
  return v;
}
function suggestion(date){   // رأس المال بتاع آخر يوم قبل التاريخ ده (capital = رأس المال الجديد)
  const ds = hist().filter(d=>d<date && closings()[d].capital!==undefined && closings()[d].capital!==null).sort(), d = ds[ds.length-1];
  return d ? {date:d, value:num(closings()[d].capital)} : null;
}
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d||'') && !isNaN(new Date(d+'T00:00:00Z').getTime());
const when = ts => ts ? new Date(ts).toLocaleString('ar-EG',{dateStyle:'medium', timeStyle:'short'}) : '';
/* قايمة الموردين لتقفيلة محفوظة (للتفاصيل والـPDF) */
function recOweList(r){
  const sups = state.suppliers||{}, owe = r.owe||{}, out = [];
  if(r.snap){ Object.values(owe).forEach(x=>{ if(x) out.push({name:x.name||'—', bal:q2(x.bal), col:q2(x.col)}); }); }
  else{
    const ids = new Set(Object.keys(sups).filter(id=>sups[id] && sups[id].name)); Object.keys(owe).forEach(id=>ids.add(id));
    ids.forEach(id=>{ const sp = sups[id], col = q2((owe[id]||{}).col); out.push({name:(sp&&sp.name)||(owe[id]&&owe[id].name)||'—', bal: sp ? q2(capSupBal(sp)+col) : col, col}); });
  }
  return out.filter(x=>x.bal||x.col).map(x=>({...x, net:q2(x.bal-x.col)})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}

/* ---------- آجل السوق = المديونية الجديدة من اليومية (لايف، ليوم التقفيلة) ---------- */
function calcDebt(){
  const d = F.debtRaw || {}; let t = 0;
  Object.entries(state.clients || {}).forEach(([id,c])=>{ if(!c || c.active===false) return; t += Number(computeNewDebt(d[id] || {}))||0; });
  return q2(t);
}
function ensureDebt(){
  if(!state.db || !F.date || F._debtDate===F.date) return;
  if(F._debtOff){ F._debtOff(); F._debtOff = null; }
  const date = F.date; F._debtDate = date; F.debtRaw = null; F.debtReady = false; F.debtErr = '';
  const ref = state.db.ref('days/'+date);
  const cb = snap => { if(F._debtDate!==date) return; F.debtRaw = snap.val() || {}; F.debtReady = true; F.debtErr = ''; if($('#clRoot')) renderLive(); };
  ref.on('value', cb, err=>{ if(F._debtDate!==date) return; F.debtErr = (err && err.message) || 'خطأ'; F.debtReady = false; if($('#clRoot')) renderLive(); });
  F._debtOff = ()=>ref.off('value', cb);
}

/* ---------- الموردين: بالأسامي من تبويب الموردين (نفس حساب راس المال القديم) ---------- */
/* «الفلوس بتاعته» = الرصيد قبل تحصيل التقفيلة دي. الرصيد الحالي في تبويب الموردين بيشمل تحصيل التقفيلة المحفوظ (لأنه اتضاف على مسدد)، فبنزوده. */
function oweRows(){
  const sups = state.suppliers || {}, rec = F.loadedDate ? closings()[F.loadedDate] : null, saved = (rec && rec.owe) || {};
  const snapMode = !!(rec && rec.snap) && !F.liveBal;
  const ids = new Set(Object.keys(sups).filter(id=>sups[id] && sups[id].name));
  Object.keys(saved).forEach(id=>ids.add(id));
  const rows = [];
  ids.forEach(id=>{
    const sp = sups[id], sn = saved[id];
    const name = (sp && sp.name) || (sn && sn.name) || '—';
    const bal = (snapMode && sn && sn.bal!==undefined) ? q2(sn.bal) : (sp ? q2(capSupBal(sp) + q2(sn && sn.col)) : q2(sn && (sn.bal!==undefined ? sn.bal : sn.col)));
    const col = q2(F.owe[id]);
    if(bal || col) rows.push({id, name, bal, col, net:q2(bal-col), gone:!sp});
  });
  return rows.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}

/* ---------- هيكل الصفحة (بيتبني مرة، وبعدها بنحدّث الأجزاء بس عشان الخانات متفقدش مكانها) ---------- */
function fieldHtml(f){
  const sg = f.sg ? `<span class="sg ${f.sg==='+'?'plus':'minus'}" title="${f.sg==='+'?'بيتجمع':'بيتخصم'}">${f.sg}</span>` : '';
  const lock = f.auto ? '<span title="بيتسحب لوحده من اليومية">🔒</span>' : '';
  return `<div class="field cl-f"><label for="cl_${f.k}">${E(f.l)}${sg}${lock}</label>
    <input id="cl_${f.k}" ${f.auto?'readonly tabindex="-1"':`data-k="${f.k}"`} data-neg="${f.neg?1:0}" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="0">
    ${f.k==='prevCapital' ? '<div class="cl-hint" id="clPrevHint"></div>' : ''}${f.k==='market' ? '<div class="cl-hint" id="clMarketHint"></div>' : ''}</div>`;
}
function skeleton(){
  return `<div id="clRoot" class="cl-root">
    <div class="topbar">
      <div><h1 class="display">تقفيلة اليوم</h1><div class="sub">سجّل تقفيلة الحسابات، ورأس المال بيتحسب لوحده والعجز أو الزيادة بتظهر فورًا</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn primary" id="clPdf" type="button">تنزيل PDF</button></div>
    </div>
    <div class="cl-banner" id="clBanner" hidden></div>
    <div class="cl-grid">
      <section class="card cl-form">
        <div class="field" style="max-width:240px"><label for="clDate">تاريخ التقفيلة</label><input type="date" id="clDate"></div>
        <div class="cl-sec"><h3>رأس المال <small>الجديد = السابق + العمولة − المصروفات</small></h3>
          <div class="cl-fields">${FIELDS.filter(f=>f.g==='cap').map(fieldHtml).join('')}</div></div>
        <div class="cl-sec"><h3>الأرصدة <small>التجميع لكل ماستر</small></h3>
          <div class="cl-fields">${FIELDS.filter(f=>f.g==='bal').map(fieldHtml).join('')}</div></div>
        <div class="cl-sec"><h3>الفلوس اللي علينا — الموردين <small>أرصدتهم من تبويب الموردين · التحصيل بتعمله من هناك</small></h3>
          <div class="tablewrap"><table class="cl-table cl-owe"><thead><tr><th>المورد</th><th>الفلوس بتاعته</th><th>التحصيل</th><th>الصافي</th></tr></thead>
            <tbody id="clOweBody"></tbody>
            <tfoot><tr><td>الإجمالي</td><td class="tnum" id="clOB">0</td><td class="tnum" id="clOC">0</td><td class="tnum" id="clON">0</td></tr></tfoot></table></div>
          <div class="cl-hint" id="clOweHint"></div></div>
      </section>
      <aside class="card cl-res">
        <div class="cl-status" id="clStatus"></div>
        <div class="cl-line"><div class="t"><span>رأس المال الجديد</span><b class="tnum" id="clNewCap">0</b></div><div class="eq">رأس المال السابق + العمولة − المصروفات</div></div>

        <div class="cl-line"><div class="t"><span>الفرق</span><b class="tnum" id="clDiff">0</b></div><div class="eq">رأس المال الجديد − إجمالي الأرصدة</div></div>

}
function bind(){
  $('#clPdf').onclick = ()=>pdfForm();
  $('#clSave').onclick = save; $('#clMiniSave').onclick = save;
  $('#clDate').onchange = e=>onDate(e.target.value);
  $('#clRoot').addEventListener('input', e=>{
    const el = e.target; if(!el.dataset) return;
    if(el.dataset.k){
      const v = onNumInput(el); F.vals[el.dataset.k] = v; F.dirty = true; F.msg = null;
      if(el.dataset.k==='prevCapital'){ const s = suggestion(F.date); F.prevManual = s ? s.value!==v : v!==0; }
      renderLive();
    }else if(el.dataset.oid){
      F.owe[el.dataset.oid] = onNumInput(el); F.dirty = true; F.msg = null; renderLive();
    }
  });
  $('#clRoot').addEventListener('keydown', e=>{
    if(e.key!=='Enter' || !e.target.matches || !e.target.matches('input[data-k],input[data-oid]')) return;
    e.preventDefault();
    const all = [...$('#clRoot').querySelectorAll('input[data-k],input[data-oid]')], n = all[all.indexOf(e.target) + (e.shiftKey ? -1 : 1)];
    if(n) n.focus(); else e.target.blur();
  });
  $('#clRoot').addEventListener('click', e=>{
    if(e.target.id==='clUseSug'){ const s = suggestion(F.date); if(!s) return; F.vals.prevCapital = s.value; F.prevManual = false; F.dirty = true; setInputs(true); renderLive(); return; }
    if(e.target.id==='clLive'){ F.liveBal = !F.liveBal; F._sig = null; renderLive(); return; }
    const m = e.target.closest('#clMore'); if(m){ F.limit += 31; renderHistory(); return; }
    const b = e.target.closest('[data-act]'); if(!b) return;
    const d = b.dataset.d;
    if(b.dataset.act==='view') details(d); else if(b.dataset.act==='edit') openForEdit(d); else if(b.dataset.act==='del') del(d); else if(b.dataset.act==='pdf') pdfSaved(d);
  });
}

/* ---------- رسم الأجزاء ---------- */
function setInputs(force){
  FIELDS.forEach(f=>{ const el = $('#cl_'+f.k); if(el && (force || document.activeElement!==el)) el.value = toText(F.vals[f.k]); });
  const d = $('#clDate'); if(d && (force || document.activeElement!==d)) d.value = F.date || '';
  if(force) F._sig = null;
}
function renderOwe(rows){
  const body = $('#clOweBody'); if(!body) return;
  const sig = (F.loadedDate||'')+'|'+(F.liveBal?1:0)+'|'+rows.map(r=>r.id+':'+r.bal).join(',');

    F._sig = sig;

    : 'الأرصدة بتتجاب لايف من تبويب الموردين. التحصيل من الموردين بتسجّله في تبويب الموردين (تعديل المورد).';

function renderHistory(){

  </tbody></table></div>${ds.length>shown.length ? `<div class="cl-more"><button class="btn" id="clMore" type="button">عرض تقفيلات أقدم (${ds.length-shown.length})</button></div>` : ''}`;

function refresh(){
  if(!$('#clRoot')) return;
  if(F.loadedDate && !closings()[F.loadedDate]){ F.loadedDate = null; F.dirty = false; F.owe = {}; F._sig = null; }
  if(!F.dirty && !F.loadedDate && closings()[F.date]){ loadInto(F.date); return; }
  if(!F.loadedDate && !F.prevManual && !F.dirty){ const s = suggestion(F.date), v = s ? s.value : 0; if(F.vals.prevCapital!==v) F.vals.prevCapital = v; }
  setInputs(false); renderLive(); renderHistory();
}

/* ---------- فتح / جديد / تغيير التاريخ ---------- */
function loadInto(d){
  const c = closings()[d]; if(!c) return;
  F.date = d; F.vals = recVals(c);
  F.owe = {}; Object.entries(c.owe||{}).forEach(([id,x])=>{ F.owe[id] = q2(x && x.col); });
  F.liveBal = false;
  const s = suggestion(d);
  F.prevManual = c.prevManual!==undefined ? !!c.prevManual : (s ? s.value!==F.vals.prevCapital : F.vals.prevCapital!==0);
  F.loadedDate = d; F.dirty = false; F.msg = null;
  setInputs(true); renderLive(); renderHistory();
}
function resetBlank(date){
  F.date = date; F.vals = blank(); F.owe = {}; F.liveBal = false; F.prevManual = false; F.loadedDate = null; F.dirty = false; F.msg = null; F._sig = null;
}
async function discardOk(what){ return !F.dirty || await askConfirm('فيه أرقام مكتوبة لسه متحفظتش. لو كملت هتضيع — '+what+'؟'); }
const addDay = (d,n) => new Date(Date.parse(d+'T00:00:00Z') + n*86400000).toISOString().slice(0,10);
function nextFreeDate(){   // النهارده لو لسه مفيهوش تقفيلة، وإلا أول يوم بعده فاضي
  let d = todayStr(), i = 0; while(closings()[d] && i++<400) d = addDay(d,1); return d;
}
async function newForm(){
  if(!await discardOk('تفتح تقفيلة جديدة')) return;
  resetBlank(nextFreeDate());
  const s = suggestion(F.date); if(s) F.vals.prevCapital = s.value;
  setInputs(true); renderLive(); renderHistory();
}
async function openForEdit(d){
  if(F.loadedDate!==d && !await discardOk('تفتح تقفيلة يوم '+d)) return;
  loadInto(d); window.scrollTo({top:0, behavior:'smooth'});
}
async function onDate(nd){
  if(!validDate(nd)){ setInputs(true); return; }
  if(nd===F.date) return;
  if(closings()[nd]){
    if(!await discardOk('تفتح تقفيلة يوم '+nd)){ setInputs(true); return; }
    loadInto(nd); return;
  }
  if(F.loadedDate){   // كنت بتعدّل تقفيلة محفوظة وروحت لتاريخ مفيهوش تقفيلة: ابدأ جديدة
    if(!await discardOk('تبدأ تقفيلة جديدة ليوم '+nd)){ setInputs(true); return; }
    resetBlank(nd);
  }
  F.date = nd;
  if(!F.prevManual){ const s = suggestion(nd); F.vals.prevCapital = s ? s.value : 0; }
  setInputs(true); renderLive();
}
/* بتتندهي من الصفحة الرئيسية: ملخص تقفيلة يوم (من نفس الداتا) */
window.closingSummary = function(date){
  const r = closings()[date]; if(!r) return {has:false};
  const v = recVals(r), res = calc(v), tc = q2(MASTERS.reduce((t,k)=>t+v[k],0) + v.pending);
  return {has:true, cap:res.newCapital, tc, com:v.commission, owe:v.suppliers, net:res.totalBalances};
};
/* بتتندهي من الصفحة الرئيسية: افتح التقفيلة بتاعة يوم معيّن */
window.openClosingFor = function(d){
  if(F.dirty || !validDate(d)) return;
  if(F.date!==d) resetBlank(d);
};

/* ---------- الحفظ ---------- */
const withTimeout = p => Promise.race([p.then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'), 10000))]);
function msg(kind, html){ F.msg = {kind, html}; renderLive(); }
function guard(){
  const u = state.user;
  if(!u || u.role!=='admin') return 'تقفيلة اليوم للأدمن بس';
  if(!state.db || !state.connected) return 'مش متصل بقاعدة البيانات — مفيش حاجة اتحفظت';
  return '';
}
function errText(err){
  const denied = /permission/i.test((err.code||'')+' '+(err.message||''));
  return E(err.message||'خطأ') + (denied ? '<br>صلاحيات Firebase مش بتسمح بالكتابة على <b dir="ltr">'+PATH+'</b> (أو على «مسدد» عند الموردين) — راجع القواعد للأدمن.' : '');
}
async function save(){
  if(F.saving) return;
  const bad = guard(); if(bad) return msg('err', E(bad));
  const date = F.date;
  if(!validDate(date)) return msg('err','اختار تاريخ صحيح للتقفيلة.');
  ensureDebt();
  if(!F.debtReady) return msg('err', F.debtErr ? 'مش قادر أقرا المديونية الجديدة من اليومية: '+E(F.debtErr) : 'لسه بحمّل «آجل السوق» (المديونية الجديدة) من اليومية — استنى ثانية وجرّب تاني.');
  F.vals.market = calcDebt();
  if(FIELDS.every(f=>f.auto || !F.vals[f.k]) && !Object.values(F.owe).some(v=>q2(v))) return msg('err','مفيش أرقام متدخلة — اكتب بيانات التقفيلة الأول.');
  const old = closings()[date];
  if(old && !await askConfirm('فيه داتا محفوظة ليوم '+date+' (راس المال/التجميع). تعدّلها بالأرقام الجديدة؟')) return;
  const bad2 = guard(); if(bad2) return msg('err', E(bad2));
  const u = state.user, rows = oweRows(), SV = firebase.database.ServerValue.TIMESTAMP, sups = state.suppliers || {};
  F.vals.suppliers = q2(rows.reduce((t,r)=>t+r.net,0));
  const r = calc(F.vals), base = PATH+'/'+date, nz = x => (q2(x) || null), now = Date.now();
  // لقطة الموردين: الاسم + الفلوس بتاعته (قبل التحصيل) + التحصيل  (col/name/t زي راس المال القديم بالظبط، و bal إضافة)
  const oldOwe = (old && old.owe) || {}, oweObj = {};
  rows.forEach(x=>{ oweObj[x.id] = {name:x.name, bal:x.bal, col:x.col}; });
  Object.keys(oldOwe).forEach(id=>{ if(!oweObj[id] && !sups[id]) oweObj[id] = oldOwe[id]; });   // مورد اتمسح: نسيب لقطته زي ما هي
  const up = {}; let addedPaid = 0, nSup = 0;
  // الفرق في التحصيل بيتضاف على «مسدد» (وبيتشال لو قلّلت أو مسحت التحصيل)
  new Set([...Object.keys(oweObj), ...Object.keys(oldOwe)]).forEach(id=>{
    const sp = sups[id]; if(!sp) return;
    const nc = q2((oweObj[id]||{}).col), oc = q2((oldOwe[id]||{}).col), delta = q2(nc-oc);
    if(!delta) return;
    up['suppliers/'+id+'/paid'] = q2((Number(sp.paid)||0)+delta); addedPaid = q2(addedPaid+delta); nSup++;
  });
  Object.keys(oldOwe).forEach(id=>{ if(!oweObj[id] && sups[id]) up[base+'/owe/'+id] = null; });
  Object.entries(oweObj).forEach(([id,x])=>{ up[base+'/owe/'+id] = {name:x.name||'', bal:q2(x.bal), col:q2(x.col), t:now}; });
  // نفس مفاتيح راس المال القديم
  up[base+'/capital'] = nz(r.newCapital);
  up[base+'/commission'] = nz(F.vals.commission);
  MASTERS.forEach(k=>{ up[base+'/'+k+'/collect'] = nz(F.vals[k]); });
  up[base+'/closing'] = {status: r.status==='balanced' ? 'ok' : r.status, amount: Math.abs(r.diff), t:now};
  // مفاتيح جديدة جنبهم
  up[base+'/prevCapital'] = nz(F.vals.prevCapital);
  up[base+'/expenses'] = nz(F.vals.expenses);
  up[base+'/pending'] = nz(F.vals.pending);
  up[base+'/prevManual'] = F.prevManual ? true : null;
  up[base+'/snap'] = true;
  if(!old || !old.createdAt) up[base+'/createdAt'] = SV;
  up[base+'/updatedAt'] = SV; up[base+'/by'] = u.uid; up[base+'/byName'] = u.name||'';
  F.saving = true; renderLive();
  try{
    const ack = await withTimeout(state.db.ref().update(up));   // كتابة واحدة atomic: التقفيلة + «مسدد» عند الموردين
    if(ack!=='ok'){ F.saving = false; return msg('err','⚠ السيرفر مردّش خلال 10 ثواني — التقفيلة <b>ممكن ماتكونش اتحفظت</b>. راجع النت وجرّب تاني.'); }
    F.saving = false; F.loadedDate = date; F.dirty = false; F._sig = null; F.liveBal = false;
    msg('ok', '✓ اتحفظت تقفيلة يوم <b>'+E(date)+'</b> — '+E(STATUS[r.status])+(r.diff? ' '+fmt(Math.abs(r.diff)) : '')+' · رأس المال الجديد <b class="tnum">'+fmt(r.newCapital)+'</b>'
      + (addedPaid ? '<br>اتضاف على «مسدد» '+(addedPaid>0?'':'(تعديل بالسالب) ')+'<b class="tnum">'+fmt(addedPaid)+'</b> عند '+nSup+' مورد.' : ''));
    renderHistory();
  }catch(err){ F.saving = false; msg('err','✗ التقفيلة ماتحفظتش: '+errText(err)); }
}


/* ---------- تنزيل PDF (نفس أسلوب باقي التطبيق: نافذة طباعة نظيفة → «حفظ كـ PDF») ---------- */
function pdfHtml(D){
  const v = D.vals, r = D.r, n = x => x ? fmt(x) : '<span class="z">—</span>';
  const stCls = r.status==='balanced' ? 'pos' : (r.status==='short' ? 'neg' : 'warn');
  const dCls = r.diff===0 ? 'pos' : (r.diff>0 ? 'neg' : 'warn');
  const ob = q2(D.owe.reduce((t,x)=>t+x.bal,0)), oc = q2(D.owe.reduce((t,x)=>t+x.col,0)), on = q2(D.owe.reduce((t,x)=>t+x.net,0));
  const kv = (l, x, sg) => `<tr><td class="nm">${E(l)}${sg?' <span class="sg">('+sg+')</span>':''}</td><td>${n(x)}</td></tr>`;
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقفيلة-اليوم-${E(D.date)}</title>
<style>
@page{size:A4 portrait; margin:14mm}
*{box-sizing:border-box}
body{margin:0; font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif; direction:rtl; color:#111; font-size:14px}
h1{font-size:22px; margin:0 0 4px}
h2{font-size:17px; margin:20px 0 8px}
.meta{color:#555; margin-bottom:14px; font-size:13px}
.tag{display:inline-block; border:1px solid #b3321f; color:#b3321f; border-radius:6px; padding:1px 8px; font-size:12px; margin-inline-start:8px}
table{width:100%; border-collapse:collapse}
th,td{border:1px solid #bbb; padding:8px 10px; text-align:center; font-variant-numeric:tabular-nums}
th{background:#eceff1; font-weight:700}
td.nm{text-align:right; font-weight:700}
.sg{color:#777; font-weight:400}
tfoot td{background:#f3f3f3; font-weight:800}
.neg{color:#b3321f; font-weight:700} .pos{color:#1f7a45; font-weight:700} .warn{color:#a85d00; font-weight:700}
.z{color:#bbb}
.sum{margin-top:18px; border:2px solid #444; border-radius:8px; font-size:16px; font-weight:800}
.sum div{display:flex; justify-content:space-between; padding:10px 16px}
.sum div+div{border-top:1px solid #bbb}
.foot{margin-top:16px; color:#777; font-size:12px}
${window.PDF_SOFT_CSS_Z}
</style></head><body>
<h1>تقفيلة اليوم${D.unsaved?'<span class="tag">لم تُحفظ بعد</span>':''}</h1><div class="meta">يوم ${E(D.date)}${D.meta?' · '+E(D.meta):''}</div>
<h2>رأس المال</h2>
<table><tbody>${kv('رأس المال السابق', v.prevCapital)}${kv('العمولة', v.commission, '+')}${kv('المصروفات', v.expenses, '−')}</tbody>
<tfoot><tr><td class="nm">رأس المال الجديد</td><td>${fmt(r.newCapital)}</td></tr></tfoot></table>
<h2>الأرصدة</h2>
<table><tbody>${kv('فوري', v.fawry, '+')}${kv('أمان', v.aman, '+')}${kv('ممكن', v.mumkin, '+')}${kv('مصاري', v.masary, '+')}${kv('النقدي', v.cash, '+')}${kv('المحافظ', v.wallets, '+')}${kv('آجل السوق (المديونية الجديدة)', v.market, '+')}${kv('العمليات المعلقة', v.pending, '+')}${kv('فلوس الموردين (الصافي)', v.suppliers, '−')}</tbody>
<tfoot><tr><td class="nm">إجمالي الأرصدة</td><td>${fmt(r.totalBalances)}</td></tr></tfoot></table>
<div class="sum"><div><span>رأس المال الجديد</span><span>${fmt(r.newCapital)}</span></div>
<div><span>إجمالي الأرصدة</span><span>${fmt(r.totalBalances)}</span></div>
<div><span>الفرق (رأس المال الجديد − إجمالي الأرصدة)</span><span class="${dCls}">${fmt(r.diff)}</span></div>
<div><span>حالة التقفيلة</span><span class="${stCls}">${STATUS[r.status]}${r.diff?' '+fmt(Math.abs(r.diff)):''}</span></div></div>
<h2>الفلوس اللي علينا — الموردين</h2>
<table><thead><tr><th>المورد</th><th>الفلوس بتاعته</th>${D.owe.some(x=>x.col)?'<th>التحصيل</th>':''}<th>الصافي</th></tr></thead>
<tbody>${D.owe.map(x=>`<tr><td class="nm">${E(x.name)}</td><td>${n(x.bal)}</td>${D.owe.some(y=>y.col)?`<td>${n(x.col)}</td>`:''}<td>${fmt(x.net)}</td></tr>`).join('') || '<tr><td colspan="4">—</td></tr>'}</tbody>
<tfoot><tr><td class="nm">الإجمالي</td><td>${fmt(ob)}</td>${D.owe.some(x=>x.col)?`<td>${fmt(oc)}</td>`:''}<td>${fmt(on)}</td></tr></tfoot></table>
</body></html>`;
}
function openPrint(html){
  // نفتح النافذة فورًا جوه ضغطة الزرار عشان المتصفح ميمنعهاش
  const win = window.open('', '_blank');
  if(win){
    win.document.open(); win.document.write(html); win.document.close();
    setTimeout(()=>{ try{ win.focus(); win.print(); }catch(_){} }, 500);
  }else{
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(fr);
    fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
    setTimeout(()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(_){} }, 500);
    setTimeout(()=>fr.remove(), 120000);
  }
  toast('اختار «حفظ كـ PDF» من نافذة الطباعة');
}
const oweList = rows => rows.filter(x=>x.bal||x.col).map(x=>({name:x.name||'—', bal:q2(x.bal), col:q2(x.col), net:q2(q2(x.bal)-q2(x.col))}));
function pdfForm(){      // اللي على الشاشة دلوقتي (حتى لو لسه ماتحفظش)
  ensureDebt();
  if(!F.debtReady) return toast('لسه بحمّل «آجل السوق» من اليومية — استنى ثانية وجرّب تاني');
  if(FIELDS.every(f=>f.auto || !F.vals[f.k]) && !Object.values(F.owe).some(v=>q2(v))) return toast('مفيش أرقام تتطبع — اكتب بيانات التقفيلة الأول');
  const rows = oweRows(), vals = Object.assign({}, F.vals, {market:calcDebt(), suppliers:q2(rows.reduce((t,x)=>t+x.net,0))});
  const c = F.loadedDate && closings()[F.loadedDate];
  openPrint(pdfHtml({date:F.date, vals, owe:oweList(rows), r:calc(vals), unsaved: !F.loadedDate || F.dirty,
    meta: c && !F.dirty && c.updatedAt ? 'آخر تعديل '+when(c.updatedAt)+(c.byName?' بواسطة '+c.byName:'') : ''}));
}
function pdfSaved(d){    // تقفيلة محفوظة من السجل
  const c = closings()[d]; if(!c) return;
  const vals = recVals(c);
  openPrint(pdfHtml({date:d, vals, owe:recOweList(c), r:calc(vals), unsaved:false, meta: c.updatedAt ? 'آخر تعديل '+when(c.updatedAt)+(c.byName?' بواسطة '+c.byName:'') : ''}));
}

/* ---------- التفاصيل والحذف ---------- */
function details(d){
  const c = closings()[d]; if(!c) return;
  const v = recVals(c), r = calc(v), cls = r.diff===0 ? 'good' : (r.diff>0 ? 'danger' : 'warn');
  const ow = recOweList(c);
  const oldSt = c.closing && c.closing.status ? (c.closing.status==='ok' ? 'balanced' : c.closing.status) : '';
  const stNote = oldSt && oldSt!==r.status ? `<div class="cl-hint" style="margin-top:8px">الحالة المسجلة يدويًا قبل كده: <b>${E(oldSt==='balanced'?'تمام':(oldSt==='short'?'عجز':'أوفر'))}${c.closing.amount?' '+fmt(c.closing.amount):''}</b></div>` : '';
  openModal(`<div class="hd"><h3>تقفيلة يوم ${E(d)}</h3><button class="btn ghost sm" id="mClose" type="button">✕</button></div>
    <div class="bd">
      ${FIELDS.map(f=>`<div class="cl-kv"><span>${E(f.l)}${f.sg?' ('+f.sg+')':''}</span><b class="tnum">${fmt(v[f.k]||0)}</b></div>`).join('')}
      <div class="cl-kv"><span>فلوس الموردين (−) · الصافي</span><b class="tnum">${fmt(v.suppliers||0)}</b></div>
      ${ow.length ? `<div class="tablewrap" style="margin:10px 0"><table class="cl-table cl-owe ${ow.some(x=>x.col)?'has-col':''}"><thead><tr><th>المورد</th><th>الفلوس بتاعته</th><th>التحصيل</th><th>الصافي</th></tr></thead><tbody>
        ${ow.map(x=>`<tr><td class="nm">${E(x.name||'—')}</td><td class="tnum">${fmt(x.bal||0)}</td><td class="tnum">${fmt(x.col||0)}</td><td class="tnum">${fmt(x.net)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="cl-kv sum"><span>رأس المال الجديد</span><b class="tnum">${fmt(r.newCapital)}</b></div>
      <div class="cl-kv sum"><span>إجمالي الأرصدة</span><b class="tnum">${fmt(r.totalBalances)}</b></div>
      <div class="cl-kv sum"><span>الفرق</span><b class="tnum">${fmt(r.diff)} <span class="pill ${cls}">${STATUS[r.status]}</span></b></div>
      ${stNote}
      ${c.updatedAt||c.createdAt ? `<div class="cl-hint" style="margin-top:10px">${c.createdAt?'اتسجلت '+E(when(c.createdAt)):''}${c.updatedAt&&c.updatedAt!==c.createdAt?' · آخر تعديل '+E(when(c.updatedAt)):''}${c.byName?' · بواسطة '+E(c.byName):''}</div>`:''}
    </div>
    <div class="ft"><button class="btn danger" id="cldDel" type="button">حذف</button><button class="btn" id="cldPdf" type="button">تنزيل PDF</button><button class="btn primary" id="cldEdit" type="button">تعديل</button></div>`, ()=>{
    $('#cldPdf').onclick = ()=>pdfSaved(d);
    $('#mClose').onclick = closeModal;
    $('#cldEdit').onclick = ()=>{ closeModal(); openForEdit(d); };
    $('#cldDel').onclick = ()=>{ closeModal(); del(d); };
  });
}
async function del(d){
  const bad = guard(); if(bad) return msg('err', E(bad));
  const c = closings()[d]; if(!c) return;
  const sups = state.suppliers || {}, oldOwe = c.owe || {}, up = {}; let tot = 0;
  Object.entries(oldOwe).forEach(([id,x])=>{ const col = q2(x && x.col), sp = sups[id]; if(!col || !sp) return; tot = q2(tot+col); up['suppliers/'+id+'/paid'] = q2((Number(sp.paid)||0)-col); });
  if(!await askConfirm('هتحذف كل داتا يوم '+d+' (راس المال والتجميع والعمولة وحالة الحساب والموردين) نهائيًا'+(tot ? '، وهيتشال تحصيل الموردين بتاعها ('+fmt(tot)+') من «مسدد» عند الموردين' : '')+'. متأكد؟')) return;
  up[PATH+'/'+d] = null;
  try{
    const ack = await withTimeout(state.db.ref().update(up));
    if(ack!=='ok') return msg('err','⚠ السيرفر مردّش — راجع السجل قبل ما تكرر الحذف.');
    if(F.loadedDate===d){ F.loadedDate = null; F.dirty = false; F.owe = {}; F._sig = null; }
    msg('ok','✓ اتحذف يوم <b>'+E(d)+'</b>.'+(tot?' واتشال '+fmt(tot)+' من «مسدد».':'')); renderHistory();
  }catch(err){ msg('err','✗ الحذف فشل: '+errText(err)); }
}

/* ---------- ربط التطبيق: تبويب «تقفيلة اليوم» مكان «راس المال» + قراءة السجل من Firebase + رسم الصفحة ---------- */
state.listeners.push(()=>{ if(F._debtOff){ F._debtOff(); F._debtOff = null; } F._debtDate = null; });
const _allowed = window.allowedTabs;
window.allowedTabs = function(){
  const r = _allowed.apply(this, arguments), u = state.user;
  if(u && u.role==='admin' && !r.some(t=>t.id==='closing')){
    const item = {id:'closing', label:'تقفيلة اليوم', title:'تقفيلة اليوم (Daily Closing)', icon:'closing'};
    const i = r.findIndex(t=>t.id==='capital');
    if(i>=0) r.splice(i, 1, item); else r.push(item);       // مكان راس المال
  }
  return r;
};
function renderClosing(main){
  const pdf = main.querySelector('#tabPdfBtn'); if(pdf) pdf.remove();
  if(!main.querySelector('#clRoot')){
    main.innerHTML = skeleton(); bind();
    if(!F.date){ F.date = todayStr(); const s = suggestion(F.date); if(s) F.vals.prevCapital = s.value; }
    setInputs(true);
  }
  main.classList.remove('wide');
  refresh();
}
const _render = window.render;
window.render = function(){
  const r = _render.apply(this, arguments);
  try{ if(state.user && state.user.role==='admin' && state.tab==='closing') renderClosing($('#main')); }catch(err){ console.error('closing', err); }
  return r;
};
})();
</script>
