<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الأسماء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: #0d0d0d;
    color: #f5f5f5;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  header h1 {
    font-size: 2.2rem;
    font-weight: 900;
    color: #ff2d2d;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .count-badge {
    display: inline-block;
    background: #ff2d2d;
    color: #fff;
    font-weight: 700;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    margin-top: 6px;
  }
  .status-bar {
    text-align: center;
    font-size: 0.9rem;
    color: #999;
    margin-bottom: 16px;
    min-height: 20px;
  }
  .search-box {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid #2a2a2a;
    background: #161616;
    color: #f5f5f5;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s;
  }
  .search-box:focus { border-color: #ff2d2d; }

  .add-box {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .add-box input {
    flex: 1;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid #2a2a2a;
    background: #161616;
    color: #f5f5f5;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  .add-box input:focus { border-color: #2ecc71; }
  .add-box button {
    flex-shrink: 0;
    padding: 0 22px;
    border-radius: 12px;
    border: none;
    background: #2ecc71;
    color: #0d0d0d;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background .2s;
  }
  .add-box button:hover { background: #29b765; }
  .add-box button:disabled { background: #444; color: #888; cursor: not-allowed; }

  .list {
    background: #161616;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid #232323;
    transition: background .15s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #1f1f1f; }
  .num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ff2d2d;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .name {
    font-size: 1.02rem;
    font-weight: 600;
    flex: 1;
    min-width: 120px;
  }
  .code-input {
    width: 130px;
    flex-shrink: 0;
    padding: 9px 10px;
    border-radius: 8px;
    border: 2px solid #2a2a2a;
    background: #0d0d0d;
    color: #f5f5f5;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .code-input:focus { border-color: #ff2d2d; }
  .code-input.saved { border-color: #2ecc71; }
  .code-input.invalid { border-color: #ff2d2d; background: #2a1414; }
  .code-status {
    width: 18px;
    flex-shrink: 0;
    text-align: center;
    font-size: 0.9rem;
  }
  .del-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: #666;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .del-btn:hover { background: #3a1a1a; color: #ff5555; }
  .no-results {
    text-align: center;
    padding: 30px;
    color: #777;
    display: none;
  }
  footer {
    text-align: center;
    color: #555;
    font-size: 0.85rem;
    margin-top: 30px;
  }
  @media (max-width: 480px) {
    .code-input { width: 95px; font-size: 0.9rem; }
    .name { font-size: 0.9rem; }
    .add-box { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>قائمة الأسماء</h1>
    <div class="count-badge" id="countBadge">57 اسم</div>
  </header>

  <div class="status-bar" id="statusBar">جاري تحميل البيانات...</div>

  <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن اسم...">

  <div class="add-box">
    <input type="text" id="newNameInput" placeholder="اسم الطالب الجديد...">
    <button id="addBtn">+ إضافة طالب</button>
  </div>

  <div class="list" id="list"></div>
  <div class="no-results" id="noResults">لا يوجد نتائج مطابقة</div>

  <footer>تم الإنشاء تلقائيًا — البيانات بتتحفظ تلقائيًا على Firebase</footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBBHUWqxFsaIn442PSuieSlbhrpB7awwAw",
  authDomain: "exam-result-system-ca200.firebaseapp.com",
  projectId: "exam-result-system-ca200",
  storageBucket: "exam-result-system-ca200.firebasestorage.app",
  messagingSenderId: "149705342999",
  appId: "1:149705342999:web:f62b7172af711a94531c52"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const CODES_COLLECTION = "studentCodes";
const EXTRA_COLLECTION = "extraStudents";

const baseNames = [
"آدم محمد",
"أحمد حسين أحمد طه",
"نور الدين أحمد",
"ساره محمد",
"عمر محمد مأمون",
"أحمد رضا",
"جنى محمد",
"ملك عاصم",
"أحمد صلاح",
"علي عمر",
"سيد عبد الفتاح",
"حبيبه ممدوح محمد",
"كريم احمد",
"عمر إبراهيم صبري",
"رنا عماد",
"أدهم هاني",
"أدهم محمود عمر الفاروق",
"ساره طارق",
"يمني هشام",
"جنى حاتم متولي عطيه",
"رحمة علي علي",
"محمد اسمه مسلم",
"عمر طارق صلره",
"باسم أسامة",
"هنا محمد عبد الرؤوف",
"أحمد سامي عبدالله",
"مهند سمير",
"رفيف محمد رجب",
"ملك محمد ممدوح",
"أنس رامي",
"تاج الدين ياسر",
"عمار العرادي",
"زاهر عصام",
"رزان حسام",
"شهد السعداوي",
"عبدالرحمن إيهاب",
"مايكل ميلاد",
"دنيا محمد",
"حسين أحمد",
"عبدالرحمن عبدالمعبود",
"محمد رائد",
"زياد محمود محمد",
"سلمى محمود معتمد",
"أحمد ميره",
"شروق هاني",
"شيرين ايهاب",
"سماء مصطفى",
"يوسف وجيه علي",
"محمد نبيل",
"محمد خالد",
"عمر عصام",
"ريان السيد",
"فاطمة أحمد محمد",
"يوسف حاتم شوقي حبيب",
"مريم أشرف",
"ملك حمادة حسين محمد"
];

// students = [{id, name, isBase}]
let students = baseNames.map((name, i) => ({
  id: "s" + (i + 1) + "_" + name.replace(/\s+/g, "_"),
  name,
  isBase: true
}));

const listEl = document.getElementById('list');
const noResultsEl = document.getElementById('noResults');
const countBadge = document.getElementById('countBadge');
const statusBar = document.getElementById('statusBar');
const newNameInput = document.getElementById('newNameInput');
const addBtn = document.getElementById('addBtn');

let saveTimers = {};

function updateCount() {
  countBadge.textContent = students.length + " اسم";
}

function buildRow(student, displayIndex) {
  const { id: docId, name, isBase } = student;
  const item = document.createElement('div');
  item.className = 'item';

  item.innerHTML = `
    <div class="num">${displayIndex + 1}</div>
    <div class="name">${name}</div>
    <input type="text" class="code-input" id="code_${docId}" maxlength="8" inputmode="numeric" placeholder="8 أرقام">
    <div class="code-status" id="status_${docId}"></div>
    ${isBase ? '' : `<button class="del-btn" title="حذف الطالب" data-id="${docId}">✕</button>`}
  `;

  const input = item.querySelector('input');
  const statusIcon = item.querySelector('.code-status');

  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g, '').slice(0, 8);
    input.classList.remove('saved', 'invalid');
    statusIcon.textContent = '';
    clearTimeout(saveTimers[docId]);
    saveTimers[docId] = setTimeout(() => saveCode(docId, input, statusIcon), 600);
  });

  input.addEventListener('blur', () => {
    clearTimeout(saveTimers[docId]);
    saveCode(docId, input, statusIcon);
  });

  if (!isBase) {
    item.querySelector('.del-btn').addEventListener('click', () => deleteStudent(docId));
  }

  return item;
}

function saveCode(docId, input, statusIcon) {
  const value = input.value.trim();

  if (value === "") {
    db.collection(CODES_COLLECTION).doc(docId).set({ code: "" }, { merge: true }).catch(() => {});
    statusIcon.textContent = '';
    input.classList.remove('saved', 'invalid');
    return;
  }

  if (value.length !== 8) {
    input.classList.add('invalid');
    statusIcon.textContent = '⚠️';
    return;
  }

  db.collection(CODES_COLLECTION).doc(docId).set({
    code: value,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true })
  .then(() => {
    input.classList.remove('invalid');
    input.classList.add('saved');
    statusIcon.textContent = '✅';
  })
  .catch((err) => {
    input.classList.add('invalid');
    statusIcon.textContent = '❌';
    console.error(err);
  });
}

async function loadCodes() {
  try {
    const snapshot = await db.collection(CODES_COLLECTION).get();
    const data = {};
    snapshot.forEach(doc => { data[doc.id] = doc.data(); });

    students.forEach(student => {
      const input = document.getElementById('code_' + student.id);
      if (input && data[student.id] && data[student.id].code) {
        input.value = data[student.id].code;
        input.classList.add('saved');
      }
    });
  } catch (err) {
    console.error(err);
  }
}

async function loadExtraStudents() {
  try {
    const snapshot = await db.collection(EXTRA_COLLECTION).orderBy('addedAt', 'asc').get();
    const extras = [];
    snapshot.forEach(doc => {
      extras.push({ id: doc.id, name: doc.data().name, isBase: false });
    });
    students = [...baseNames.map((name, i) => ({
      id: "s" + (i + 1) + "_" + name.replace(/\s+/g, "_"),
      name,
      isBase: true
    })), ...extras];
    updateCount();
    render(document.getElementById('searchInput').value);
    await loadCodes();
    statusBar.textContent = "✅ البيانات متزامنة مع Firebase";
    setTimeout(() => { statusBar.textContent = ""; }, 2000);
  } catch (err) {
    statusBar.textContent = "⚠️ حصل خطأ في تحميل البيانات من Firebase";
    console.error(err);
  }
}

async function addStudent() {
  const name = newNameInput.value.trim();
  if (!name) return;

  addBtn.disabled = true;
  try {
    const docRef = await db.collection(EXTRA_COLLECTION).add({
      name,
      addedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    students.push({ id: docRef.id, name, isBase: false });
    updateCount();
    newNameInput.value = '';
    render(document.getElementById('searchInput').value);
  } catch (err) {
    statusBar.textContent = "⚠️ حصل خطأ أثناء إضافة الطالب";
    console.error(err);
  } finally {
    addBtn.disabled = false;
  }
}

async function deleteStudent(docId) {
  if (!confirm('متأكد إنك عايز تحذف الطالب ده؟')) return;
  try {
    await db.collection(EXTRA_COLLECTION).doc(docId).delete();
    await db.collection(CODES_COLLECTION).doc(docId).delete().catch(() => {});
    students = students.filter(s => s.id !== docId);
    updateCount();
    render(document.getElementById('searchInput').value);
  } catch (err) {
    statusBar.textContent = "⚠️ حصل خطأ أثناء حذف الطالب";
    console.error(err);
  }
}

function render(filter = "") {
  listEl.innerHTML = "";
  const f = filter.trim();
  let visibleCount = 0;
  let displayIndex = 0;
  students.forEach((student) => {
    if (f && !student.name.includes(f)) return;
    listEl.appendChild(buildRow(student, displayIndex));
    displayIndex++;
    visibleCount++;
  });
  noResultsEl.style.display = visibleCount === 0 ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  render(e.target.value);
  loadCodes();
});

addBtn.addEventListener('click', addStudent);
newNameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addStudent();
});

updateCount();
render();
loadExtraStudents();
</script>
</body>
</html>
