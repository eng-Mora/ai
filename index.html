const FD_REP_RE = /مندوب/;
const FD_LOG = 'meta/fullDayUploads';
const fdState = {};
const fdEmptyCols = () => { const c = {name:null, rep:null}; FD_FIELDS.forEach(f=>{ c[f.key]=null; }); return c; };

function fdDetectRow(r){
  const nameIdx = r.findIndex(x=>typeof x==='string' && FD_NAME_RE.test(norm(x)) && !FD_REP_RE.test(norm(x)));
  if(nameIdx<0) return null;
  const c = fdEmptyCols(), used = new Set([nameIdx]);
  c.name = nameIdx;
  FD_FIELDS.forEach(f=>{
    const j = r.findIndex((x,k)=>!used.has(k) && typeof x==='string' && f.re.test(norm(x)));
    if(j>=0){ c[f.key]=j; used.add(j); }
  });
  const rj = r.findIndex((x,k)=>!used.has(k) && typeof x==='string' && FD_REP_RE.test(norm(x)));
  if(rj>=0) c.rep = rj;
  return c;
}
function fdDetect(rows){
  let header = 1, cols = null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const c = fdDetectRow(rows[i]||[]);
    if(!c) continue;
    header = i+1; cols = c;
    if(FD_FIELDS.some(f=>c[f.key]!=null)) break;
  }
  return {header, cols: cols || fdEmptyCols()};
}

function openFullDayUpload(){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  Object.assign(fdState, {wb:null, sheet:null, rows:[], header:1, cols:fdEmptyCols(), date:state.day, mode:'set', createNew:true, wipe:false,
    fileName:'', items:[], skip:new Set(), busy:false, hist:[], dayCache:null, dayCacheDate:null});
  openModal(`
    <div class="hd"><h3>رفع يومية كاملة من شيت</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd">
      <div style="font-size:12.5px; color:var(--fg-dim); line-height:1.7">
        ارفع شيت اليومية بكل العملاء (الاسم · فوري · امان · مصاري · ممكن · بساطة · كاش · التحصيل · آجل أمس · المندوب). الأعمدة بتتربط تلقائي من العناوين وتقدر تعدّلها، وبتشوف معاينة قبل الحفظ. الخانات اللي مش مربوطة بتفضل زي ما هي.
      </div>
      <div class="row2">
        <div class="field"><label>ملف الإكسيل</label><input type="file" id="fdFile" accept=".xlsx,.xls,.csv"></div>
        <div class="field"><label>تاريخ اليومية</label><input type="date" id="fdDate" value="${fdState.date}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>طريقة الحفظ</label>
          <select id="fdMode"><option value="set">استبدال القيم (الأرقام في الشيت هي اللي تتسجل)</option><option value="add">إضافة على الموجود</option></select></div>
        <div class="field" style="justify-content:flex-end; gap:8px">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="fdCreate" checked> العملاء اللي مش موجودين يتضافوا كعملاء جدد</label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="fdWipe"> صفّر باقي عملاء اليوم اللي مش في الشيت</label>
        </div>
      </div>
      <div id="fdConfig"></div>
      <div id="fdPreview"></div>
      <div id="fdHistory"></div>
    </div>
    <div class="ft"><button class="btn" id="mCancel">إغلاق</button><button class="btn primary" id="fdApply" disabled>رفع اليومية</button></div>
  `, root=>{
    $('.modal', root).style.maxWidth = '1000px';
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#fdApply').onclick = fdApply;
    $('#fdMode').onchange = e=>{ fdState.mode = e.target.value; fdRenderPreview(); };
    $('#fdCreate').onchange = e=>{ fdState.createNew = e.target.checked; fdRenderPreview(); };
    $('#fdWipe').onchange = e=>{ fdState.wipe = e.target.checked; fdRenderPreview(); };
    $('#fdDate').onchange = e=>{
      if(!e.target.value) return;
      fdState.date = e.target.value; fdState.dayCache = null; fdState.dayCacheDate = null;
      fdRenderPreview(); fdEnsureDay();
    };
    $('#fdFile').onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const fail = msg=>{
        fdState.wb = null;
        $('#fdConfig').innerHTML = `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">${escapeHtml(msg)}</div>`;
        $('#fdPreview').innerHTML = ''; toast(msg);
      };
      if(typeof XLSX==='undefined') return fail('مكتبة الإكسيل متحمّلتش — اعمل Refresh وجرّب تاني');
      const rd = new FileReader();
      rd.onerror = ()=>fail('المتصفح معرفش يقرا الملف — جرّب تختاره تاني');
      rd.onload = ev=>{
        try{
          try{ fdState.wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'}); }
          catch(err){ return fail('الملف مش مفهوم: '+err.message); }
          fdState.fileName = f.name;
          const score = n => XLSX.utils.sheet_to_json(fdState.wb.Sheets[n],{header:1,defval:null,raw:true})
            .filter(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number')).length;
          fdUseSheet(fdState.wb.SheetNames.slice().sort((a,b)=>score(b)-score(a))[0]);
          fdRenderConfig(); fdRenderPreview(); fdEnsureDay();
        }catch(err){ fail('خطأ أثناء قراءة الشيت: '+err.message); }
      };
      rd.readAsArrayBuffer(f);
    };
    fdLoadHistory().then(fdRenderHistory);
  });
}

function fdUseSheet(name, forced){
  const u = fdState; u.sheet = name;
  u.rows = XLSX.utils.sheet_to_json(u.wb.Sheets[name],{header:1,defval:null,raw:true});
  if(forced){ u.header = forced; u.cols = fdDetectRow(u.rows[forced-1]||[]) || fdEmptyCols(); }
  else { const d = fdDetect(u.rows); u.header = d.header; u.cols = d.cols; }
  u.skip = new Set();
}
function fdColOptions(sel){
  const u = fdState, header = u.rows[u.header-1] || [];
  const width = Math.max(header.length, 0, ...u.rows.slice(0,30).map(r=>(r||[]).length));
  let o = '<option value="">— تجاهل —</option>';
  for(let i=0;i<width;i++){
    const h = header[i];
    o += `<option value="${i}" ${sel===i?'selected':''}>${escapeHtml(h==null?'عمود '+colToLetter(i):String(h))} (${colToLetter(i)})</option>`;
  }
  return o;
}
function fdRenderConfig(){
  const u = fdState, sheets = u.wb.SheetNames;
  $('#fdConfig').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${sheets.length>1 ? `<div class="field"><label>الورقة (Sheet)</label><select id="fdSheet">${sheets.map(n=>`<option ${n===u.sheet?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>رقم صف العناوين</label><input id="fdHdr" type="number" min="1" value="${u.header}"></div>
    </div>
    <div style="font-size:12.5px; color:var(--fg-dim); margin:12px 0 6px; font-weight:700">ربط الأعمدة (اتظبط تلقائي — راجعه قبل ما ترفع)</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="field"><label>اسم العميل *</label><select data-fdmap="name">${fdColOptions(u.cols.name)}</select></div>
      <div class="field"><label>المندوب (اختياري)</label><select data-fdmap="rep">${fdColOptions(u.cols.rep)}</select></div>
      ${FD_FIELDS.map(f=>`<div class="field"><label>${f.label}</label><select data-fdmap="${f.key}">${fdColOptions(u.cols[f.key])}</select></div>`).join('')}
    </div>`;
  const sh = $('#fdSheet');
  if(sh) sh.onchange = e=>{ fdUseSheet(e.target.value); fdRenderConfig(); fdRenderPreview(); };
  $('#fdHdr').onchange = e=>{
    const h = Math.max(1, parseInt(e.target.value,10)||1);
    fdUseSheet(u.sheet, h); fdRenderConfig(); fdRenderPreview();
  };
  $$('[data-fdmap]').forEach(s=>s.onchange = e=>{
    u.cols[e.target.dataset.fdmap] = e.target.value==='' ? null : Number(e.target.value);
    fdRenderPreview();
  });
}

function fdDayNow(){
  const u = fdState;
  if(u.date===state.day) return state.dayData || {};
  return u.dayCacheDate===u.date ? u.dayCache : null;
}
function fdEnsureDay(){
  const u = fdState;
  if(u.date===state.day || u.dayCacheDate===u.date) return Promise.resolve();
  const d = u.date;
  return state.db.ref('days/'+d).once('value').then(s=>{
    if(u.date===d){ u.dayCache = s.val()||{}; u.dayCacheDate = d; fdRenderPreview(); }
  }).catch(()=>{});
}

function fdCompute(){
  const u = fdState, c = u.cols;
  const idx = upBuildIndex(), acc = new Map();
  if(c.name!=null){
    u.rows.slice(u.header).forEach(r=>{
      if(!r) return;
      const raw = r[c.name]; if(raw==null) return;
      const name = String(raw).trim();
      if(!name || name==='0' || UP_SKIP_NAMES.includes(norm(name))) return;
      const m = upMatch(name, idx);
      const key = m.id || ('n:'+norm(name));
      let it = acc.get(key);
      if(!it){ it = {key, id:m.id||null, dup:!!m.dup, name, rows:0, vals:{}, repName:''}; acc.set(key, it); }
      it.rows++;
      if(c.rep!=null && !it.repName && r[c.rep]!=null) it.repName = String(r[c.rep]).trim();
      FD_FIELDS.forEach(f=>{
        const ci = c[f.key]; if(ci==null) return;
        it.vals[f.key] = upRound((it.vals[f.key]||0) + upToNum(r[ci]));
      });
    });
  }
  u.items = [...acc.values()].map(it=>{
    it.canApply = !it.dup && (!!it.id || u.createNew);
    it.include = it.canApply && !u.skip.has(it.key);
    return it;
  });
}

/* خطة التصفير: عملاء مش في الشيت ليهم أرقام في اليوم */
function fdWipePlan(day){
  const prot = new Set(fdState.items.filter(it=>it.id).map(it=>it.id));
  const totals = {}; let n = 0;
  Object.keys(state.clients).forEach(id=>{
    if(!state.clients[id] || prot.has(id)) return;
    const r = (day||{})[id] || {}; let any = false;
    FD_FIELDS.forEach(f=>{
      const v = upRound(Number(r[f.key])||0);
      if(v){ totals[f.key] = upRound((totals[f.key]||0)+v); any = true; }
    });
    if(any) n++;
  });
  return {n, totals};
}

function fdRenderPreview(){
  const u = fdState, box = $('#fdPreview'); if(!box) return;
  const btn = $('#fdApply');
  if(!u.wb){ box.innerHTML = ''; return; }
  fdCompute();
  const c = u.cols;
  if(c.name==null){ box.innerHTML = `<div class="preview-box warn">مش لاقي عمود الاسم — اختاره من «ربط الأعمدة» فوق.</div>`; btn.disabled = true; return; }
  const cols = FD_FIELDS.filter(f=>c[f.key]!=null);
  if(!cols.length){ box.innerHTML = `<div class="preview-box warn">اربط عمود مبلغ واحد على الأقل (فوري / امان / تحصيل / آجل أمس ...).</div>`; btn.disabled = true; return; }

  const day = fdDayNow();
  const statusOf = it=>{
    if(it.dup) return `<span class="pill warn">اسم مكرر في الداتا بيز</span>`;
    if(it.id) return `<span class="pill good">مطابق</span>`;
    return u.createNew ? `<span class="pill neutral">عميل جديد</span>` : `<span class="pill danger">مش موجود</span>`;
  };
  const rowsHtml = u.items.map(it=>{
    const cur = it.id && day ? (day[it.id]||{}) : null;
    const cl = it.id ? state.clients[it.id] : null;
    const dbName = cl ? cl.name : '';
    const repShown = cl ? upRepName(cl.rep) : it.repName;
    return `<tr style="${it.include?'':'opacity:.55'}">
      <td><input type="checkbox" data-fdk="${escapeHtml(it.key)}" ${it.include?'checked':''} ${it.canApply?'':'disabled'}></td>
      <td class="name-cell">${escapeHtml(it.name)}${dbName && dbName!==it.name ? `<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">في الداتا بيز: ${escapeHtml(dbName)}</div>`:''}${it.rows>1?`<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">${it.rows} صفوف اتجمعوا</div>`:''}</td>
      <td style="font-size:12.5px">${repShown?escapeHtml(repShown):'<span style="color:var(--fg-dim)">—</span>'}</td>
      ${cols.map(f=>{
        const v = it.vals[f.key]||0, old = cur ? (Number(cur[f.key])||0) : null;
        const shown = u.mode==='add' ? (v ? `<div style="color:${v>0?'var(--good)':'var(--danger)'};font-weight:700">${v>0?'+':''}${fmt(v)}</div>` : '<span style="color:var(--fg-dim)">—</span>') : `<div style="font-weight:700">${fmt(v)}</div>`;
        const was = (old!==null && (u.mode==='add' ? v!==0 : old!==v)) ? `<div style="font-size:11px;color:var(--fg-dim)">كان ${fmt(old)}</div>` : '';
        return `<td class="tnum">${shown}${was}</td>`;
      }).join('')}
      <td>${statusOf(it)}</td>
    </tr>`;
  }).join('');

  box.innerHTML = `
    <div id="fdSum" class="preview-box" style="margin-top:14px"></div>
    <div class="tablewrap" style="margin-top:12px; max-height:360px; overflow:auto">
      <table style="min-width:700px">
        <thead><tr><th></th><th>الاسم في الشيت</th><th>المندوب</th>${cols.map(f=>`<th>${f.label}</th>`).join('')}<th>الحالة</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  $$('[data-fdk]').forEach(cb=>cb.onchange = e=>{
    const k = e.target.dataset.fdk;
    if(e.target.checked) u.skip.delete(k); else u.skip.add(k);
    fdCompute(); fdRenderSummary();
    e.target.closest('tr').style.opacity = e.target.checked ? '' : '.55';
  });
  fdRenderSummary();
}

function fdRenderSummary(){
  const u = fdState, box = $('#fdSum'); if(!box) return;
  const inc = u.items.filter(it=>it.include);
  const totals = {};
  inc.forEach(it=>Object.entries(it.vals).forEach(([k,d])=>{ totals[k] = upRound((totals[k]||0)+d); }));
  const newN = inc.filter(it=>!it.id).length;
  const missing = u.items.filter(it=>!it.id && !it.dup && !u.createNew).length;
  const dups = u.items.filter(it=>it.dup).length;
  const day = fdDayNow();
  const sumTxt = FD_FIELDS.filter(f=>u.cols[f.key]!=null).map(f=>`${f.label}: <b>${fmt(totals[f.key]||0)}</b>`).join(' · ');
  let overwrites = 0;
  if(day && u.mode==='set') inc.forEach(it=>{
    if(!it.id) return;
    FD_FIELDS.forEach(f=>{
      if(u.cols[f.key]==null) return;
      const old = upRound(Number((day[it.id]||{})[f.key])||0);
      if(old && old!==upRound(it.vals[f.key]||0)) overwrites++;
    });
  });
  let wipeTxt = '', wipeN = 0;
  if(u.wipe){
    if(day){
      const p = fdWipePlan(day); wipeN = p.n;
      wipeTxt = `<br>التصفير: <b>${p.n}</b> عميل مش في الشيت هيتصفّروا`
        + (p.n ? ' ('+FD_FIELDS.filter(f=>p.totals[f.key]).map(f=>`${f.label}: ${fmt(p.totals[f.key])}`).join(' · ')+')' : '') + '.';
    } else wipeTxt = '<br>التصفير: جاري قراءة اليوم…';
  }
  box.classList.toggle('warn', !!(missing||dups||overwrites||u.wipe||u.mode==='add'));
  box.innerHTML = `هيتسجّل <b>${inc.length}</b> عميل على يوم <b>${u.date}</b>${newN?` (منهم <b>${newN}</b> عميل جديد)`:''}`
    + (sumTxt ? `<br>${sumTxt}` : '') + wipeTxt
    + (overwrites ? `<br>تنبيه: ${overwrites} خانة فيها أرقام مسجلة هتتغيّر (فيه تراجع بعد الرفع).` : '')
    + (u.mode==='add' ? `<br>تنبيه: وضع الإضافة — الأرقام هتتزوّد على المسجل، وتأكد إن الشيت ما اترفعش قبل كده.` : '')
    + (missing ? `<br>تنبيه: ${missing} اسم مش موجود في الداتا بيز وهيتخطّوا (فعّل إضافة العملاء الجدد لو عايزهم).` : '')
    + (dups ? `<br>تنبيه: ${dups} اسم مكرر في الداتا بيز ومش هيتسجّل — عدّل الأسماء الأول.` : '');
  const btn = $('#fdApply');
  btn.disabled = u.busy || (inc.length===0 && !(u.wipe && wipeN));
  btn.textContent = inc.length ? `رفع اليومية (${inc.length} عميل)` : 'رفع اليومية';
}

function fdSig(inc){
  const u = fdState;
  const s = u.date+'|'+u.mode+'|'+inc.map(it=>(it.id||it.name)+':'+Object.entries(it.vals).sort().map(([k,d])=>k+d).join(',')).sort().join(';');
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return String(h);
}

async function fdApply(){
  const u = fdState; if(u.busy) return;
  fdCompute();
  const inc = u.items.filter(it=>it.include);
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  if(!inc.length && !u.wipe) return toast('مفيش حاجة تترفع');
  const sig = fdSig(inc);
  const same = u.mode==='add' ? (u.hist||[]).find(h=>!h.undone && h.sig===sig) : null;
  if(same && !await askConfirm(`الشيت ده بنفس الأرقام اترفع قبل كده على يوم ${same.date}. لو كملت الأرقام هتتضاعف. تكمل؟`)) return;
  const newN = inc.filter(it=>!it.id).length;
  if(!await askConfirm(`هترفع ${inc.length} عميل على يوم ${u.date}${newN?` (منهم ${newN} عميل جديد)`:''} — ${u.mode==='set'?'استبدال القيم':'إضافة على الموجود'}${u.wipe?'\nوهتصفّر باقي عملاء اليوم اللي مش في الشيت':''}.\n(فيه تراجع بعد كده)\nتكمل؟`)) return;

  u.busy = true;
  const btn = $('#fdApply'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    const fresh = (await state.db.ref('days/'+u.date).once('value')).val() || {};
    const updates = {}, items = {}, created = [], createdReps = [], totals = {};
    let order = maxOrder();
    const repByName = {};
    Object.entries(state.reps).forEach(([id,r])=>{ if(r) repByName[norm(r.name)] = id; });
    const addCell = (id, k, to)=>{
      const prev = upRound(Number((fresh[id]||{})[k])||0); to = upRound(to);
      if(prev===to) return;
      updates[`days/${u.date}/${id}/${k}`] = to;
      (items[id] = items[id] || {})[k] = {prev, to};
    };
    inc.forEach(it=>{
      let id = it.id;
      if(!id){
        id = uid(); order++;
        let rid = null;
        if(it.repName){
          const rk = norm(it.repName); rid = repByName[rk];
          if(!rid){ rid = uid(); repByName[rk] = rid; updates['reps/'+rid] = {name:it.repName, color:randColor()}; createdReps.push(rid); }
        }
        updates['clients/'+id] = {name:it.name, rep:rid, active:true, order};
        created.push(id);
      }
      FD_FIELDS.forEach(f=>{
        if(u.cols[f.key]==null) return;
        const v = it.vals[f.key]||0;
        totals[f.key] = upRound((totals[f.key]||0)+v);
        const cur = Number((fresh[id]||{})[f.key])||0;
        addCell(id, f.key, u.mode==='add' ? cur+v : v);
      });
    });
    let wiped = 0;
    if(u.wipe){
      const prot = new Set(u.items.filter(it=>it.id).map(it=>it.id));
      Object.keys(state.clients).forEach(id=>{
        if(!state.clients[id] || prot.has(id)) return;
        const before = Object.keys(items).length;
        FD_FIELDS.forEach(f=>addCell(id, f.key, 0));
        if(Object.keys(items).length>before) wiped++;
      });
    }
    if(!Object.keys(updates).length){ u.busy = false; toast('مفيش أي تغيير — الأرقام زي ما هي'); fdRenderSummary(); return; }
    const logId = uid();
    const log = {createdAt:Date.now(), date:u.date, fileName:u.fileName||'', mode:u.mode, wipe:!!u.wipe, wiped, sig,
      count:inc.length, createdCount:created.length, totals, items, created, createdReps};
    updates[FD_LOG+'/'+logId] = log;

    const ack = await Promise.race([
      state.db.ref().update(updates).then(()=>'ok'),
      new Promise(res=>setTimeout(()=>res('timeout'), 10000)),
    ]);
    if(ack==='timeout'){
      $('#fdPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">السيرفر مردّش خلال 10 ثواني — الأرجح النت واقف، فاليومية ممكن ميكونش اتحفظت. افحص الاتصال وجرّب تاني.</div>`);
      toast('مفيش تأكيد من السيرفر — اليومية ممكن ميكونش اتحفظت');
      u.busy = false; fdRenderSummary(); return;
    }
    if(state.day!==u.date){ state.day = u.date; bindDay(u.date); }
    u.hist = [{id:logId, ...log}, ...(u.hist||[])].slice(0,15);
    const sumTxt = FD_FIELDS.filter(f=>u.cols[f.key]!=null).map(f=>`${f.label}: ${fmt(totals[f.key]||0)}`).join(' · ');
    $('#fdPreview').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">تم رفع ${inc.length} عميل على يوم ${u.date}${created.length?` (${created.length} جديد)`:''}${wiped?` وتصفير ${wiped} عميل`:''} — ${sumTxt} — اتحفظ على السيرفر ✓</div>`;
    $('#fdConfig').innerHTML = ''; $('#fdFile').value = ''; u.wb = null; u.items = [];
    btn.textContent = 'رفع اليومية'; btn.disabled = true;
    fdRenderHistory();
    toast('تم رفع اليومية');
  }catch(err){
    const denied = /permission/i.test((err.code||'')+' '+err.message);
    toast('فشل الحفظ: '+err.message);
    $('#fdPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">فشل الحفظ: ${escapeHtml(err.message)}${denied?' — معندكش صلاحية الحفظ':''}</div>`);
    fdRenderSummary();
  }
  u.busy = false;
}

function fdLoadHistory(){
  return state.db.ref(FD_LOG).orderByKey().limitToLast(15).once('value').then(s=>{
    const v = s.val() || {};
    fdState.hist = Object.entries(v).map(([id,h])=>({id, ...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return fdState.hist;
  }).catch(()=>{ fdState.hist = []; return []; });
}
function fdRenderHistory(){
  const box = $('#fdHistory'); if(!box) return;
  const hist = (fdState.hist||[]).slice(0,6);
  if(!hist.length){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin:16px 0 6px; font-weight:700">آخر رفعات اليومية الكاملة</div>
    <div class="tablewrap"><table style="min-width:560px">
      <thead><tr><th>اليوم</th><th>الملف</th><th>العملاء</th><th>التفاصيل</th><th></th></tr></thead>
      <tbody>${hist.map(h=>`<tr style="${h.undone?'opacity:.5':''}">
        <td class="tnum">${escapeHtml(h.date||'')}<div style="font-size:11px;color:var(--fg-dim)">${h.createdAt? new Date(h.createdAt).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):''}</div></td>
        <td style="font-size:12.5px">${escapeHtml(h.fileName||'')}</td>
        <td class="tnum">${h.count||0}${h.createdCount?` <span style="font-size:11px;color:var(--fg-dim)">(${h.createdCount} جديد)</span>`:''}</td>
        <td style="font-size:12px;text-align:start">${h.mode==='add'?'إضافة':'استبدال'}${h.wipe?` · تصفير ${h.wiped||0}`:''}<br>${FD_FIELDS.filter(f=>(h.totals||{})[f.key]).map(f=>`${f.label}: ${fmt(h.totals[f.key])}`).join(' · ')}</td>
        <td>${h.undone ? '<span class="pill neutral">اتلغت</span>' : `<button class="btn sm danger" data-fdundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  $$('[data-fdundo]').forEach(b=>b.onclick = ()=>fdUndo(b.dataset.fdundo));
}

/* التراجع: بيرجّع الخانات اللي لسه على قيمتها بعد الرفع بس، ويحذف العملاء/المناديب اللي اتعملوا مع الرفعة لو مفيش عليهم تعديل */
async function fdUndo(logId){
  try{
    const log = (await state.db.ref(FD_LOG+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    const nNew = (log.created||[]).length;
    if(!await askConfirm(`تتراجع عن رفعة «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟ الأرقام القديمة هترجع${nNew?` وهيتحذف ${nNew} عميل اتعمل مع الرفعة`:''} (الخانات اللي اتعدّلت بعد الرفع مش هتتلمس).`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const clients = (await state.db.ref('clients').once('value')).val() || {};
    const updates = {}, skippedBy = {}; let restored = 0, skipped = 0;
    Object.entries(log.items||{}).forEach(([cid,flds])=>Object.entries(flds).forEach(([k,d])=>{
      const cur = upRound(Number((day[cid]||{})[k])||0);
      if(cur===upRound(d.to)){ updates[`days/${log.date}/${cid}/${k}`] = d.prev; restored++; }
      else { skipped++; skippedBy[cid] = true; }
    }));
    const delClients = new Set();
    (log.created||[]).forEach(cid=>{
      if(!clients[cid] || skippedBy[cid]) return;
      delClients.add(cid);
      Object.keys(updates).forEach(p=>{ if(p.startsWith(`days/${log.date}/${cid}/`)) delete updates[p]; });
      updates['clients/'+cid] = null;
      updates[`days/${log.date}/${cid}`] = null;
    });
    (log.createdReps||[]).forEach(rid=>{
      const used = Object.entries(clients).some(([cid,c])=>c && c.rep===rid && !delClients.has(cid));
      if(!used) updates['reps/'+rid] = null;
    });
    updates[FD_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (fdState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    fdRenderHistory();
    toast(`تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتعدّلت بعد الرفع)`:''}`);
  }catch(err){ toast('خطأ: '+err.message); }
}


/* ================= رفع مديونية (اسم + مبلغ) =================
   كل اسم بيتطابق مع العميل، والمبلغ بيتسجل في خانة «آجل أمس» (المديونية السابقة) في اليوم المختار.
   الافتراضي «استبدال» لأن المديونية رصيد مش حركة؛ وفيه خيار الإضافة. المبالغ المكررة لنفس العميل بتتجمّع. فيه سجل وتراجع. */
const DBT_LOG = 'meta/debtUploads';
const dbtState = {};
const DBT_NAME_RE = /اسم|عميل|تاجر|محل/;
const DBT_VAL_RE = /مديون|اجل|رصيد|مبلغ|قيمه|متبقي|باقي|عليه|حساب|اجمالي|amount|total|value/i;

function openDebtUpload(){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  Object.assign(dbtState, {wb:null, sheet:null, rows:[], header:1, nameCol:null, valCol:null, date:state.day, mode:'set', createNew:false,
    fileName:'', items:[], skip:new Set(), busy:false, hist:[], dayCache:null, dayCacheDate:null});
  openModal(`
    <div class="hd"><h3>رفع مديونية</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd">
      <div style="font-size:12.5px; color:var(--fg-dim); line-height:1.7">الشيت فيه اسم العميل والمبلغ. المبلغ بيتسجل في خانة <b>آجل أمس</b> لليوم المختار، وبعدها المديونية الجديدة بتتحسب لوحدها (آجل أمس + المسحوبات − التحصيل).</div>
      <div class="row2">
        <div class="field"><label>تاريخ اليومية</label><input type="date" id="dbDate" value="${dbtState.date}"></div>
        <div class="field"><label>طريقة الحفظ</label><select id="dbMode"><option value="set">استبدال آجل أمس بالمبلغ</option><option value="add">إضافة على آجل أمس الموجود</option></select></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="dbCreate"> العملاء اللي مش موجودين يتضافوا كعملاء جدد</label>
      <div class="field"><label>ملف إكسيل (.xlsx)</label><input type="file" id="dbFile" accept=".xlsx,.xls,.csv"></div>
      <div id="dbBody"></div>
      <div id="dbHistory"></div>
    </div>
    <div class="ft"><button class="btn" id="mCancel">إغلاق</button><button class="btn primary" id="dbApply" disabled>رفع المديونية</button></div>
  `, ()=>{
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#dbApply').onclick = dbtApply;
    $('#dbMode').onchange = e=>{ dbtState.mode = e.target.value; dbtPreview(); };
    $('#dbCreate').onchange = e=>{ dbtState.createNew = e.target.checked; dbtPreview(); };
    $('#dbDate').onchange = e=>{
      if(!e.target.value) return;
      dbtState.date = e.target.value; dbtState.dayCache = null; dbtState.dayCacheDate = null;
      dbtPreview(); dbtEnsureDay();
    };
    $('#dbFile').onchange = e=>{
      const f = e.target.files[0]; if(!f) return; dbtState.fileName = f.name;
      if(typeof XLSX==='undefined') return toast('مكتبة الإكسيل متحمّلتش — اعمل Refresh وجرّب تاني');
      const rd = new FileReader();
      rd.onerror = ()=>toast('المتصفح معرفش يقرا الملف');
      rd.onload = ev=>{
        try{ dbtState.wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'}); }
        catch(err){ return toast('تعذر قراءة الملف'); }
        const score = n => XLSX.utils.sheet_to_json(dbtState.wb.Sheets[n],{header:1,defval:null,raw:true})
          .filter(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number')).length;
        dbtUseSheet(dbtState.wb.SheetNames.slice().sort((a,b)=>score(b)-score(a))[0]);
        dbtEnsureDay();
      };
      rd.readAsArrayBuffer(f);
    };
    dbtLoadHistory().then(dbtRenderHistory);
  });
}

function dbtUseSheet(name, forcedHeader){
  const m = dbtState; m.sheet = name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  m.nameCol = m.valCol = null;
  const scan = i=>{
    const r = m.rows[i]||[];
    const n = r.findIndex(c=>typeof c==='string' && DBT_NAME_RE.test(norm(c)) && !/مندوب/.test(norm(c)));
    if(n<0) return false;
    m.header = i+1; m.nameCol = n;
    const v = r.findIndex((c,j)=>j!==n && typeof c==='string' && DBT_VAL_RE.test(norm(c)));
    m.valCol = v>=0 ? v : null;
    return true;
  };
  let found = false;
  if(forcedHeader!==undefined){ m.header = forcedHeader; found = forcedHeader>0 && scan(forcedHeader-1); }
  else for(let i=0;i<Math.min(m.rows.length,15) && !found;i++) found = scan(i);
  if(!found && (forcedHeader===undefined || forcedHeader===0)){ // من غير عناوين: أول عمود نصي وأول عمود رقمي
    const r = m.rows.find(r=>r && r.some(c=>typeof c==='string') && r.some(c=>typeof c==='number')) || [];
    const n = r.findIndex(c=>typeof c==='string'); if(n>=0) m.nameCol = n;
    const v = r.findIndex(c=>typeof c==='number'); if(v>=0) m.valCol = v;
    m.header = 0;
  }
  if(m.nameCol!=null && m.valCol==null){
    const r = m.rows[m.header]||[]; const j = r.findIndex((c,k)=>k!==m.nameCol && typeof c==='number'); if(j>=0) m.valCol = j;
  }
  m.skip = new Set();
  dbtRenderOptions();
}
function dbtRenderOptions(){
  const m = dbtState, hdr = m.rows[Math.max(0,m.header-1)]||[];
  const width = Math.max(hdr.length, 0, ...m.rows.slice(0,30).map(r=>(r||[]).length));
  const opts = cur=>'<option value="">— اختر —</option>'+Array.from({length:width},(_,i)=>{
    const h = m.header>0 ? hdr[i] : null;
    return `<option value="${i}" ${cur===i?'selected':''}>${escapeHtml(h==null?'عمود '+colToLetter(i):String(h))} (${colToLetter(i)})</option>`; }).join('');
  $('#dbBody').innerHTML = `
    <div class="row2">
      ${m.wb.SheetNames.length>1 ? `<div class="field"><label>الورقة</label><select id="dbSheet">${m.wb.SheetNames.map(n=>`<option ${n===m.sheet?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>رقم صف العناوين (0 = مفيش)</label><input id="dbHeader" type="number" min="0" value="${m.header}"></div>
      <div class="field"><label>عمود اسم العميل *</label><select id="dbName">${opts(m.nameCol)}</select></div>
      <div class="field"><label>عمود المبلغ *</label><select id="dbVal">${opts(m.valCol)}</select></div>
    </div>
    <div id="dbPreview" style="margin-top:12px"></div>`;
  const num = v=>v===''?null:Number(v);
  const sh = $('#dbSheet'); if(sh) sh.onchange = e=>dbtUseSheet(e.target.value);
  $('#dbHeader').onchange = e=>{ const h = Math.max(0, parseInt(e.target.value,10)||0); dbtUseSheet(m.sheet, h); };
  $('#dbName').onchange = e=>{ m.nameCol = num(e.target.value); dbtPreview(); };
  $('#dbVal').onchange = e=>{ m.valCol = num(e.target.value); dbtPreview(); };
  dbtPreview();
}

function dbtDayNow(){
  const m = dbtState;
  if(m.date===state.day) return state.dayData || {};
  return m.dayCacheDate===m.date ? m.dayCache : null;
}
function dbtEnsureDay(){
  const m = dbtState;
  if(m.date===state.day || m.dayCacheDate===m.date) return Promise.resolve();
  const d = m.date;
  return state.db.ref('days/'+d).once('value').then(s=>{
    if(m.date===d){ m.dayCache = s.val()||{}; m.dayCacheDate = d; dbtPreview(); }
  }).catch(()=>{});
}

function dbtCompute(){
  const m = dbtState, idx = upBuildIndex(), acc = new Map();
  let blank = 0;
  if(m.nameCol!=null && m.valCol!=null){
    m.rows.slice(Math.max(0, m.header)).forEach(r=>{
      if(!r) return;
      const raw = r[m.nameCol], cell = r[m.valCol];
      const name = raw==null ? '' : String(raw).trim();
      const noVal = cell==null || String(cell).trim()==='';
      if(!name){ if(!noVal) blank++; return; }
      if(name==='0' || UP_SKIP_NAMES.includes(norm(name)) || noVal) return;
      const val = upRound(upToNum(cell));
      const h = upMatch(name, idx);
      const key = h.id || ('n:'+norm(name));
      let it = acc.get(key);
      if(!it){ it = {key, id:h.id||null, dup:!!h.dup, name, rows:0, val:0}; acc.set(key, it); }
      it.rows++; it.val = upRound(it.val+val);
    });
  }
  m.blank = blank;
  m.items = [...acc.values()].map(it=>{
    it.canApply = !it.dup && (!!it.id || m.createNew);
    it.include = it.canApply && !m.skip.has(it.key);
    return it;
  });
}

function dbtPreview(){
  const m = dbtState, box = $('#dbPreview'), btn = $('#dbApply'); if(!box) return;
  btn.disabled = true;
  if(m.nameCol==null || m.valCol==null){ box.innerHTML = '<div class="preview-box warn">اختار عمود الاسم وعمود المبلغ.</div>'; return; }
  dbtCompute();
  const day = dbtDayNow();
  const rowsHtml = m.items.map(it=>{
    const cur = it.id && day ? (Number((day[it.id]||{}).debtYesterday)||0) : null;
    const st = it.dup ? '<span class="pill warn">اسم مكرر في الداتا بيز</span>'
      : it.id ? '<span class="pill good">مطابق</span>'
      : (m.createNew ? '<span class="pill neutral">عميل جديد</span>' : '<span class="pill danger">مش موجود</span>');
    const cl = it.id ? state.clients[it.id] : null;
    const to = m.mode==='add' && cur!==null ? cur+it.val : it.val;
    return `<tr style="${it.include?'':'opacity:.55'}">
      <td><input type="checkbox" data-dbk="${escapeHtml(it.key)}" ${it.include?'checked':''} ${it.canApply?'':'disabled'}></td>
      <td class="name-cell">${escapeHtml(it.name)}${cl && cl.name!==it.name ? `<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">في الداتا بيز: ${escapeHtml(cl.name)}</div>`:''}${it.rows>1?`<div style="font-size:11.5px;color:var(--fg-dim);font-weight:400">${it.rows} صفوف اتجمعوا</div>`:''}</td>
      <td class="tnum"><b>${fmt(m.mode==='add' ? it.val : it.val)}</b></td>
      ${cur!==null ? `<td class="tnum">${fmt(cur)}</td><td class="tnum" style="font-weight:700">${fmt(to)}</td>` : '<td></td><td></td>'}
      <td>${st}</td></tr>`;
  }).join('');
  box.innerHTML = `
    <div id="dbSum" class="preview-box"></div>
    <div class="tablewrap" style="margin-top:10px; max-height:320px; overflow:auto">
      <table style="min-width:560px"><thead><tr><th></th><th>الاسم في الشيت</th><th>${m.mode==='add'?'هيتضاف':'المبلغ'}</th><th>آجل أمس حاليًا</th><th>هيبقى</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>`;
  $$('[data-dbk]').forEach(cb=>cb.onchange = e=>{
    const k = e.target.dataset.dbk;
    if(e.target.checked) m.skip.delete(k); else m.skip.add(k);
    dbtCompute(); dbtRenderSummary();
    e.target.closest('tr').style.opacity = e.target.checked ? '' : '.55';
  });
  dbtRenderSummary();
}
function dbtRenderSummary(){
  const m = dbtState, box = $('#dbSum'), btn = $('#dbApply'); if(!box) return;
  const inc = m.items.filter(it=>it.include);
  const total = upRound(inc.reduce((t,it)=>t+it.val,0));
  const newN = inc.filter(it=>!it.id).length;
  const missing = m.items.filter(it=>!it.id && !it.dup && !m.createNew);
  const dups = m.items.filter(it=>it.dup);
  box.classList.toggle('warn', !!(missing.length||dups.length||m.blank||m.mode==='add'));
  box.innerHTML = `هيتسجّل <b>${inc.length}</b> عميل على يوم <b>${m.date}</b> — إجمالي المبالغ: <b>${fmt(total)}</b>${newN?` (منهم ${newN} عميل جديد)`:''}`
    + (missing.length ? `<br>تنبيه: ${missing.length} اسم مش موجود في العملاء وهيتخطّوا: ${missing.slice(0,12).map(x=>escapeHtml(x.name)+' ('+fmt(x.val)+')').join('، ')}${missing.length>12?'…':''} (فعّل إضافة العملاء الجدد لو عايزهم).` : '')
    + (dups.length ? `<br>تنبيه: ${dups.length} اسم ليه أكتر من عميل في الداتا بيز وهيتخطّى: ${dups.map(x=>escapeHtml(x.name)).join('، ')}` : '')
    + (m.blank ? `<br>تنبيه: ${m.blank} صف فيه مبلغ من غير اسم — اتخطى.` : '')
    + (m.mode==='add' ? `<br>تنبيه: وضع الإضافة — لو الشيت اترفع قبل كده المبلغ هيتضاعف.` : '');
  btn.disabled = m.busy || !inc.length;
  btn.textContent = inc.length ? `رفع المديونية (${inc.length} عميل)` : 'رفع المديونية';
}

async function dbtApply(){
  const m = dbtState; if(m.busy) return;
  dbtCompute();
  const inc = m.items.filter(it=>it.include);
  if(!inc.length || !state.db) return;
  const newN = inc.filter(it=>!it.id).length;
  if(!await askConfirm(`هتسجّل مديونية ${inc.length} عميل${newN?` (منهم ${newN} جديد)`:''} في «آجل أمس» ليوم ${m.date} — ${m.mode==='set'?'استبدال':'إضافة على الموجود'}. (فيه تراجع بعد كده)\nتكمل؟`)) return;
  m.busy = true;
  const btn = $('#dbApply'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    const fresh = (await state.db.ref('days/'+m.date).once('value')).val() || {};
    const updates = {}, items = {}, created = []; let order = maxOrder(), total = 0;
    inc.forEach(it=>{
      let id = it.id;
      if(!id){ id = uid(); order++; updates['clients/'+id] = {name:it.name, active:true, order}; created.push(id); }
      const prev = upRound(Number((fresh[id]||{}).debtYesterday)||0);
      const to = upRound(m.mode==='add' ? prev+it.val : it.val);
      total = upRound(total+it.val);
      if(prev===to && !created.includes(id)) return;
      updates[`days/${m.date}/${id}/debtYesterday`] = to;
      items[id] = {prev, to};
    });
    const logId = uid();
    const log = {createdAt:Date.now(), date:m.date, fileName:m.fileName||'', mode:m.mode, count:inc.length, total, created, items};
    updates[DBT_LOG+'/'+logId] = log;
    const ack = await Promise.race([
      state.db.ref().update(updates).then(()=>'ok'),
      new Promise(res=>setTimeout(()=>res('timeout'), 10000)),
    ]);
    if(ack==='timeout'){
      $('#dbPreview').insertAdjacentHTML('afterbegin', `<div class="pill danger" style="font-size:13px; padding:8px 14px; margin:12px 0; white-space:normal">السيرفر مردّش خلال 10 ثواني — راجع النت، المديونية ممكن ميكونش اتحفظت.</div>`);
      toast('مفيش تأكيد من السيرفر'); m.busy = false; dbtRenderSummary(); return;
    }
    if(state.day!==m.date){ state.day = m.date; bindDay(m.date); }
    m.hist = [{id:logId, ...log}, ...(m.hist||[])].slice(0,15);
    $('#dbPreview').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px; margin-top:12px; white-space:normal">تم تسجيل مديونية ${inc.length} عميل على يوم ${m.date} — إجمالي ${fmt(total)} — اتحفظ على السيرفر ✓</div>`;

function dbtLoadHistory(){

function dbtRenderHistory(){
  const box = $('#dbHistory'); if(!box) return;
  const hist = (dbtState.hist||[]).slice(0,6);
  if(!hist.length){ box.innerHTML = ''; return; }
  box.innerHTML = `

      <tbody>${hist.map(h=>`<tr style="${h.undone?'opacity:.5':''}">
        <td class="tnum">${escapeHtml(h.date||'')}<div style="font-size:11px;color:var(--fg-dim)">${h.createdAt?new Date(h.createdAt).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):''}</div></td>

        <td>${h.undone?'<span class="pill neutral">اتلغت</span>':`<button class="btn sm danger" data-dbundo="${h.id}">تراجع</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-dbundo]').forEach(b=>b.onclick = ()=>dbtUndo(b.dataset.dbundo));

async function dbtUndo(logId){
  try{
    const log = (await state.db.ref(DBT_LOG+'/'+logId).once('value')).val();
    if(!log || log.undone) return;
    if(!await askConfirm(`تتراجع عن رفعة المديونية «${log.fileName||''}» (${log.count||0} عميل) على يوم ${log.date}؟${(log.created||[]).length?` وهيتحذف ${log.created.length} عميل اتعمل معاها.`:''} (لو عدّلت الخانة بعد الرفع مش هتتلمس)`)) return;
    const day = (await state.db.ref('days/'+log.date).once('value')).val() || {};
    const clients = (await state.db.ref('clients').once('value')).val() || {};
    const updates = {}, kept = {}; let restored = 0, skipped = 0;
    Object.entries(log.items||{}).forEach(([cid,d])=>{
      const cur = upRound(Number((day[cid]||{}).debtYesterday)||0);
      if(cur===upRound(d.to)){ updates[`days/${log.date}/${cid}/debtYesterday`] = d.prev; restored++; }
      else { skipped++; kept[cid] = true; }
    });
    (log.created||[]).forEach(cid=>{
      if(!clients[cid] || kept[cid]) return;
      delete updates[`days/${log.date}/${cid}/debtYesterday`];
      updates['clients/'+cid] = null;
      updates[`days/${log.date}/${cid}`] = null;
    });
    updates[DBT_LOG+'/'+logId+'/undone'] = true;
    await state.db.ref().update(updates);
    const h = (dbtState.hist||[]).find(x=>x.id===logId); if(h) h.undone = true;
    dbtRenderHistory();
    toast(`تم التراجع — رجعت ${restored} خانة${skipped?` وتخطّيت ${skipped} (اتعدّلت بعد الرفع)`:''}`);
  }catch(err){ toast('خطأ: '+err.message); }
}

const AUTH_SUFFIX = '@taqfila.local';
const ADMIN_EMAIL = 'admin11111' + AUTH_SUFFIX;
function emailOf(v){
  v = String(v||'').trim().toLowerCase(); if(!v) return '';
  if(!v.includes('@')) return v + AUTH_SUFFIX;
  if(v.endsWith('@payment')) return v.slice(0,-8) + AUTH_SUFFIX;

function authErr(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'اسم المستخدم أو كلمة السر غلط';
  if(/too-many-requests/.test(c)) return 'محاولات كتير غلط — استنى شوية وجرّب تاني';
  if(/network/.test(c)) return 'مفيش نت — اتأكد من الاتصال';
  if(/operation-not-allowed/.test(c)) return 'مقدرتش أنشئ الحساب دلوقتي، جرّب تاني بعد شوية';
  if(/email-already-in-use/.test(c)) return 'الحساب ده موجود بالفعل';
  if(/weak-password/.test(c)) return 'كلمة السر ضعيفة — 6 حروف/أرقام على الأقل';
  if(/requires-recent-login/.test(c)) return 'سجّل خروج وادخل تاني وبعدين غيّر كلمة السر';
  return (e && e.message) || 'حصل خطأ';
}

/* عرض فقط للمندوب: أي كتابة خارج repNotes بتترفض */
function installGuard(){
  try{
    const P = firebase.database.Reference.prototype;
    ['set','update','remove','push','transaction'].forEach(m=>{
      const orig = P[m];
      P[m] = function(...a){
        const u = state.user;
        if(u && u.role==='rep'){
          const root = state.db.ref().toString().replace(/\/$/,'');
          const base = decodeURIComponent(this.toString().slice(root.length)).replace(/^\//,'');
          const keys = (m==='update' && a[0] && typeof a[0]==='object') ? Object.keys(a[0]).map(k=>base?base+'/'+k:k) : [base];
          if(!keys.every(k=>k==='repNotes' || k.startsWith('repNotes/'))){ toast('عرض فقط — مش مسموح لك بالتعديل'); return Promise.reject(new Error('read-only')); }
        }
        return orig.apply(this, a);
      };
    });
  }catch(e){}
}
function applyRoleUI(main){
  const u = state.user; if(!u || u.role!=='rep') return;
  $$('input.cell-amt', main).forEach(i=>{
    const sp = document.createElement('span'); sp.className = 'tnum';
    sp.textContent = i.value==='' ? '·' : fmt(Number(i.value)); i.replaceWith(sp);
  });
  $$('.stat', main).forEach(st=>{ const k = COLMAP[(st.querySelector('.label')||{textContent:''}).textContent.trim()]; if(k && u.perms.cols[k]===false) st.style.display='none'; });
  $$('table', main).forEach(t=>{
    const hide = [];
    [...t.querySelectorAll('thead th')].forEach((th,i)=>{ const k = COLMAP[th.textContent.trim()]; if(k && u.perms.cols[k]===false) hide.push(i); });
    if(!hide.length) return;
    t.querySelectorAll('tr').forEach(tr=>{ let idx=0; [...tr.children].forEach(c=>{ const sp=c.colSpan||1; if(sp===1 && hide.includes(idx)) c.style.display='none'; idx+=sp; }); });
  });
  if(!u.repId && u.perms.own) main.insertAdjacentHTML('afterbegin','<div class="preview-box warn" style="margin-bottom:10px">حسابك لسه مش مربوط بمندوب — كلّم الأدمن.</div>');
}

/* ================= استكمال البيانات (تذكير شخصي للأدمن — مش مربوط باليومية ولا التحصيل) ================= */
const CMP_PATH = 'dataCompletion';
let CMP_TYPES = [['aman','أمان'],['fawry','فوري'],['basata','بساطة']];
const cmpOf = cid => (state.dataComp && state.dataComp[cid]) || {};
const cmpLatin = s => String(s||'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function cmpSave(cid, patch, quiet){
  if(!state.db) return toast('مش متصل بقاعدة البيانات بعد');
  patch.updatedAt = Date.now();
  if(quiet) renderComplete._skip = true;
  try{ state.db.ref(CMP_PATH+'/'+cid).update(patch).catch(e=>toast('خطأ: '+e.message)); }
  finally{ renderComplete._skip = false; }
}
function cmpClients(){
  const f = renderComplete._f, nums = clientNumbers();
  return sortedClients()
    .filter(([id,c])=>c.active!==false && (f.rep==='__none__' ? !(c.rep && state.reps[c.rep]) : c.rep===f.rep))
    .map(([id,c])=>({id, c, num:nums[id], d:cmpOf(id)}));
}
function cmpRemain(d){
  const o = Number(d.owed)||0, p = Number(d.paid)||0;
  return (d.owed==null && d.paid==null) ? '' : 'المتبقي: '+fmt(o-p);
}
function cmpUpdRem(cid){
  const el = document.querySelector(`[data-rem="${cid}"]`); if(!el) return;
  const t = cmpRemain(cmpOf(cid)); el.textContent = t; el.style.display = t ? '' : 'none';
}
function cmpRefreshStats(){
  const box = $('#cmpStats'); if(!box) return;

  if(!f.rep){ box.innerHTML=''; $('#cmpChips').innerHTML=''; return; }
  const list = cmpClients();
  const n = list.length, vis = list.filter(x=>x.d.visited).length, rem = n-vis;
  const owed = list.reduce((a,x)=>a+(Number(x.d.owed)||0),0), paid = list.reduce((a,x)=>a+(Number(x.d.paid)||0),0);
  const pct = n ? Math.round(vis/n*100) : 0;
  box.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div class="stat"><div class="label">العملاء</div><div class="val tnum">${n}</div></div>
    <div class="stat"><div class="label">اتزار</div><div class="val tnum" style="color:var(--good)">${vis}</div></div>
    <div class="stat"><div class="label">باقي</div><div class="val tnum" style="color:var(--warn)">${rem}</div></div>
    <div class="stat"><div class="label">عليهم (استكمال)</div><div class="val tnum">${fmt(owed)}</div></div>
    <div class="stat"><div class="label">اتحصل (استكمال)</div><div class="val tnum">${fmt(paid)}</div></div>
  </div><div class="cmp-bar" style="margin-top:10px" title="${pct}%"><i style="width:${pct}%"></i></div>`;
  const chip = (k,l,c)=>`<button class="btn sm ${f.show===k?'primary':''}" data-show="${k}">${l} <span class="tnum">(${c})</span></button>`;
  $('#cmpChips').innerHTML = chip('all','الكل',n)+chip('todo','باقي',rem)+chip('done','اتزار',vis)
    + `<button class="btn sm ghost" id="cmpReset" style="margin-inline-start:auto">تصفير الزيارات</button>`;
  $$('#cmpChips [data-show]').forEach(b=>b.onclick=()=>{ f.show=b.dataset.show; cmpRefreshStats(); cmpDrawList(); });
  const rb = $('#cmpReset'); if(rb) rb.onclick = async ()=>{
    const ids = list.filter(x=>x.d.visited).map(x=>x.id);
    if(!ids.length) return toast('مفيش زيارات متعلّمة');
    if(!await askConfirm('تصفير علامات الزيارة لـ '+ids.length+' عميل؟ (البيانات المكتوبة هتفضل زي ما هي)')) return;
    const up = {}; ids.forEach(id=>{ up[id+'/visited']=null; up[id+'/visitedAt']=null; });
    state.db.ref(CMP_PATH).update(up).catch(e=>toast('خطأ: '+e.message));
  };
}
function cmpCard({id,c,num,d}){
  const rem = cmpRemain(d);
  const vt = d.visited && d.visitedAt ? new Date(d.visitedAt).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}) : '';

      <div class="field"><label>نوع المكنة</label><select data-cf="mType" data-cid="${id}"><option value="">—</option>${CMP_TYPES.map(([k,l])=>`<option value="${k}" ${d.mType===k?'selected':''}>${l}</option>`).join('')}</select></div>
      ${inp('mNo','رقم المكنة','inputmode="numeric" placeholder="اختياري"')}
      ${inp('phone','رقم الموبايل','type="tel" inputmode="tel"')}

      ${inp('paid','اتحصل كام','inputmode="decimal"')}

function cmpDrawList(){
  const box = $('#cmpList'); if(!box) return;
  const f = renderComplete._f;
  if(!f.rep){ box.innerHTML = '<div class="card"><div class="empty"><div class="ico">📋</div>اختار المندوب عشان يظهرلك عملاءه.</div></div>'; return; }
  const q = norm(f.q||'');
  const list = cmpClients()
    .filter(x=> f.show==='all' || (f.show==='done' ? x.d.visited : !x.d.visited))
    .filter(x=> !q || norm([x.c.name, x.num, x.d.mNo, x.d.phone, x.d.address, machineText(x.c)].join(' ')).includes(q));
  box.innerHTML = list.length ? `<div class="cmp-list">${list.map(cmpCard).join('')}</div>`
    : '<div class="card"><div class="empty"><div class="ico">✅</div>مفيش عملاء في الفلتر ده.</div></div>';
}
function renderComplete(main){
  const f = renderComplete._f = renderComplete._f || {rep:'', q:'', show:'all'};
  if(f.rep && f.rep!=='__none__' && !state.reps[f.rep]) f.rep='';
  if(renderComplete._skip){ cmpRefreshStats(); return; }   /* كتابة مني: متعملش إعادة رسم عشان الكيبورد ميتقفلش */
  const ae = document.activeElement; let keep = null;
  if(ae && main.contains(ae) && (ae.dataset.cf || ae.id==='cmpQ'))
    keep = {cf:ae.dataset.cf, cid:ae.dataset.cid, id:ae.id, s:ae.selectionStart, e:ae.selectionEnd};
  const reps = Object.entries(state.reps).filter(([id,r])=>r).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar'));
  main.innerHTML = `<div class="topbar"><div><h1 class="display">استكمال البيانات</h1>
      <div class="sub">تذكير ليك انت بس — مش مربوط باليومية ولا بالتحصيل بتاعها</div></div></div>
    <div class="toolbar">
      <select class="sel-sm" id="cmpRep"><option value="">اختار المندوب…</option>
        ${reps.map(([id,r])=>`<option value="${id}" ${f.rep===id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}
        <option value="__none__" ${f.rep==='__none__'?'selected':''}>بدون مندوب</option></select>
      <div class="search-input"><input id="cmpQ" placeholder="ابحث باسم العميل أو المكنة أو الموبايل أو العنوان..." value="${escapeHtml(f.q)}"></div>
    </div>
    <div id="cmpStats" style="margin-bottom:12px"></div>
    <div id="cmpChips" class="toolbar"></div>
    <div id="cmpList"></div>`;
  $('#cmpRep').onchange = e=>{ f.rep=e.target.value; f.show='all'; render(); };
  $('#cmpQ').oninput = e=>{ f.q=e.target.value; cmpDrawList(); };
  const list = $('#cmpList');
  list.onchange = e=>{
    const t = e.target, cid = t.dataset.cid, k = t.dataset.cf; if(!cid || !k) return;
    if(k==='visited'){ cmpSave(cid, {visited: t.checked ? true : null, visitedAt: t.checked ? Date.now() : null}); return; }
    let v = t.value.trim();
    if(k==='owed' || k==='paid'){ const n = parseFloat(cmpLatin(v).replace(/,/g,'')); v = isNaN(n) ? '' : n; }
    else if(k==='phone' || k==='mNo') v = cmpLatin(v);
    cmpSave(cid, {[k]: v==='' ? null : v}, true);
    cmpUpdRem(cid);
  };
  cmpRefreshStats(); cmpDrawList();
  if(keep){
    const el = keep.id ? document.getElementById(keep.id) : main.querySelector(`[data-cf="${keep.cf}"][data-cid="${keep.cid}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(keep.s, keep.e); }catch(_){} }
  }
}

      .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

      ${list.map(n=>`<tr><td class="tnum" style="text-align:start"><a href="#" data-goday="${n.date}">${n.date}</a></td><td class="name-cell">${escapeHtml(n.cName)}</td><td>${escapeHtml(n.userName||'')}</td>

        <td><button class="btn sm danger" data-delnote="${n.k}">حذف</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="card"><div class="empty"><div class="ico">📝</div>مفيش ملحوظات.</div></div>';
    $$('[data-delnote]').forEach(b=>b.onclick=async ()=>{ if(await askConfirm('حذف الملحوظة؟')) state.db.ref('repNotes/'+b.dataset.delnote).remove(); });

  $('#nDate').onchange = e=>{ f.date=e.target.value; upd(); };
  $('#nAll').onclick = ()=>{ f.date=''; $('#nDate').value=''; upd(); };
  $('#nQ').oninput = e=>{ f.q=e.target.value; upd(); };
  upd();
}

state.pend = state.pend || {};

function recalcLedgerDom(){
  const main = $('#main'); if(!main) return;
  const trs = main.querySelectorAll('.ledger-table tbody tr[data-id]'); if(!trs.length) return;
  const FK = finKeys(), K = [...FK,'collection','debtYesterday'], ndIdx = 5+FK.length;
  const tot = Object.assign(finZero(), {drawn:0,collection:0,debtYesterday:0,newDebt:0});
  trs.forEach(tr=>{
    let inps = _rcCache.get(tr);   // خانات الصف بتتجمع مرة واحدة بس (مش selector لكل خانة مع كل ضغطة)
    if(!inps){ inps = K.map(k=>tr.querySelector(`input[data-field="${k}"]`)); _rcCache.set(tr, inps); }
    const row = {};
    for(let i=0;i<K.length;i++){ const inp = inps[i]; row[K[i]] = inp ? (Number(inp.value)||0) : 0; }
    const drawn = sumDrawn(row), nd = computeNewDebt(row);

    const ndc = tr.children[ndIdx]; const t = fmt(r2(nd)), cls = 'tnum '+(nd>0?'neg':(nd<0?'pos':''));
    if(ndc.textContent!==t) ndc.textContent = t; if(ndc.className!==cls) ndc.className = cls;

const BK_NODES = ['clients','reps','suppliers','cashOps','repNotes','dataCompletion','alerts','users'];
const BK_KEEP = 20;
function downloadJSON(name, obj){
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);

async function readNode(p){ return (await state.db.ref(p).once('value')).val(); }
/* نسخة تلقائية صغيرة جوه الداتا بيز: كل البيانات الأساسية + الأيام المعنية بالعملية (آخر 20 نسخة) */
async function makeSnapshot(reason, dates){
  try{
    const data = {};
    for(const n of BK_NODES) data[n] = await readNode(n);
    data.days = {}; for(const d of (dates||[])) data.days[d] = await readNode('days/'+d);
    const key = String(Date.now());
    await state.db.ref('backups/'+key).set({createdAt:Date.now(), reason, dates:dates||[], data});
    await state.db.ref('meta/backupIdx/'+key).set({createdAt:Date.now(), reason, dates:(dates||[]).join(' ← '), clients:Object.keys(data.clients||{}).length});
    const idx = (await readNode('meta/backupIdx'))||{}, keys = Object.keys(idx).sort();
    if(keys.length>BK_KEEP){ const up = {}; keys.slice(0, keys.length-BK_KEEP).forEach(k=>{ up['backups/'+k] = null; up['meta/backupIdx/'+k] = null; }); await state.db.ref().update(up); }
    return {ok:true, key};
  }catch(e){ return {ok:false, err:e.message}; }
}
/* ===== تشفير النسخ المنزّلة =====
   النسخة بتتنزل مشفّرة AES-256-GCM (امتداد .tqbk). المفتاح متخزن في meta/backupKey على Firebase (قراءته للأدمن بس حسب القواعد)
   ومبيتحطش في الملف نفسه ولا في النسخ التلقائية (meta مش في BK_NODES). يعني الملف لوحده برا السيستم ده مالوش لازمة.
   فك التشفير بيتم من صفحة منفصلة (taqfila-decrypt.html) بتدخل فيها كأدمن. مهم: متمسحش meta/backupKey وإلا النسخ المشفّرة القديمة متتفتحش. */
const b64 = {
  enc: u8 => { let t = ''; for(let i=0;i<u8.length;i+=0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(t); },
  dec: str => Uint8Array.from(atob(str), c=>c.charCodeAt(0))
};
async function getBackupKey(){
  if(!(window.crypto && crypto.subtle)) throw new Error('المتصفح ده مبيدعمش التشفير — افتح الموقع من https أو من متصفح حديث');
  let v = await readNode('meta/backupKey');
  if(!v || !v.k){
    const cand = {k: b64.enc(crypto.getRandomValues(new Uint8Array(32))), id: Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
    v = (await state.db.ref('meta/backupKey').transaction(cur=>(cur && cur.k) ? cur : cand)).snapshot.val();
  }
  return {key: await crypto.subtle.importKey('raw', b64.dec(v.k), 'AES-GCM', false, ['encrypt','decrypt']), id: v.id};
}
async function encryptBackup(obj){
  const {key, id} = await getBackupKey(), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {app:'taqfila-enc', v:1, kid:id, iv:b64.enc(iv), data:b64.enc(ct)};
}
async function downloadEncrypted(name, obj){ downloadJSON(name, await encryptBackup(obj)); }

/* Enter / السهم لتحت = نفس الخانة في العميل اللي بعده · Shift+Enter / السهم لفوق = اللي قبله */
document.addEventListener('keydown', e=>{
  const inp = e.target;
  if(!(inp instanceof HTMLInputElement) || !inp.matches('.ledger-table input.cell-amt[data-field]') || e.isComposing) return;
  let dir = 0;
  if(e.key==='Enter') dir = e.shiftKey ? -1 : 1; else if(e.key==='ArrowDown') dir = 1; else if(e.key==='ArrowUp') dir = -1; else return;
  e.preventDefault();
  const f = inp.dataset.field; let tr = inp.closest('tr');
  while(tr && (tr = dir>0 ? tr.nextElementSibling : tr.previousElementSibling)){
    if(tr.classList.contains('win-h')) ledgerWinShow(tr);   // الصف مخفي عشان بعيد عن الشاشة: نظهره الأول
    const n = tr.querySelector(`input[data-field="${f}"]`);
    if(n && !n.disabled && getComputedStyle(tr).display!=='none'){ n.focus(); n.scrollIntoView({block:'nearest'}); return; }
  }
  if(dir>0) inp.blur();   // آخر صف: اخرج من الخانة عشان التعديل يتسجّل
});
/* أول ما تدخل خانة رقم بيتحدد اللي فيها، فتكتب مباشرة فوق القديم */

/* ================= قفل الأيام + سجل التعديلات =================
   - قفل اليوم: node اسمه locks/<التاريخ>. أي كتابة على days/<التاريخ> بتتمنع من الواجهة، وكمان من قواعد Firebase (لازم تنسخ القواعد الجديدة من الإعدادات).
   - سجل التعديلات: node اسمه audit (إضافة فقط). كل كتابة على الأيام/العملاء/الموردين/الكاش بتتسجل بعد ما السيرفر يأكد الحفظ.
   - مفيش حاجة هنا بتغيّر طريقة الكتابة الأصلية: بنلفّ set/update/remove بس، والكتابة نفسها بتتم زي ما هي. */
const AUDIT_FAMS = {days:'days', clients:'client', suppliers:'supplier', cashOps:'cash'};
const AUDIT_MAXCH = 40;
state.locks = state.locks || {};
const isLocked = d => !!(d && state.locks && state.locks[d]);

function bindLocks(){
  const ref = state.db.ref('locks');
  const cb = snap => { state.locks = snap.val() || {}; scheduleRender(); };
  ref.on('value', cb, ()=>{ state.locksUnavailable = true; });   // لو القواعد لسه متحدّثتش مبنزعجش المستخدم
  state.listeners.push(()=>ref.off('value', cb));
}

function auditRelPath(ref){
  const root = state.db.ref().toString().replace(/\/$/,'');
  return decodeURIComponent(ref.toString().slice(root.length)).replace(/^\//,'');
}
/* كل المسارات اللي الكتابة دي هتلمسها: [{p, v}] */
function auditOps(base, m, a){
  if(m==='remove') return [{p:base, v:null}];
  if(m==='set') return [{p:base, v:a[0]}];
  if(m==='update' && a[0] && typeof a[0]==='object') return Object.keys(a[0]).map(k=>({p: base ? base+'/'+k : k, v:a[0][k]}));
  return [];
}
function auditLeaves(p, v, out){
  if(out.length > 6000) return out;
  if(v && typeof v==='object' && !('.sv' in v)){
    const ks = Object.keys(v);
    if(!ks.length){ out.push({p, v:null}); return out; }
    ks.forEach(k=>auditLeaves(p+'/'+k, v[k], out));
    return out;
  }
  out.push({p, v: (v && typeof v==='object') ? null : v}); return out;
}
function auditDig(node, parts){
  for(const k of parts){ if(node==null || typeof node!=='object') return undefined; node = node[k]; }
  return node;
}
function auditDayNode(date){
  if(date===state.day) return {known:true, node: state.dayData || {}};
  if(typeof ss!=='undefined' && ss && ss.allDays && ss.allDays[date]) return {known:true, node: ss.allDays[date]};
  return {known:false};
}
function auditClientName(id){ const c = state.clients && state.clients[id]; return (c && c.name) || ''; }
const auditShort = v => (typeof v==='string' && v.length>120) ? v.slice(0,120)+'…' : v;

/* هل الكتابة دي هتمس يوم مقفول؟ بترجّع تاريخ اليوم المقفول (أو '') */
function lockedHit(base, m, a){
  if(!state.locks) return '';
  const paths = auditOps(base, m, a).map(o=>o.p);
  if(!paths.length) paths.push(base);
  for(const p of paths){
    const parts = p.split('/');
    if(parts[0]!=='days') continue;
    if(parts.length===1){ const k = Object.keys(state.locks)[0]; if(k) return k; continue; }
    if(isLocked(parts[1])) return parts[1];
  }
  return '';
}

function auditBuild(base, m, a, u){
  const ops = auditOps(base, m, a);
  const entries = [];
  const head = ()=>{ const h = {uid:u.uid, by:u.name||'', clientAt:Date.now()}; if(state._auditCtx) h.ctx = state._auditCtx; return h; };
  const cells = [], dayDel = new Set(), rowDel = [];
  const others = {};   // fam -> {ch:[], del:[]}
  ops.forEach(op=>{
    const first = op.p.split('/')[0];
    if(first==='locks'){
      const parts = op.p.split('/'); if(parts.length!==2) return;
      const date = parts[1], v = op.v;
      if(v===null){
        const prev = state.locks && state.locks[date];
        const e = Object.assign(head(), {k:'unlock', date, reason: state._unlockReason||''});
        if(prev){ e.prevBy = prev.byName||''; if(prev.tot) e.tot = prev.tot; }
        entries.push(e);
      } else {
        const e = Object.assign(head(), {k:'lock', date}); if(v && v.tot) e.tot = v.tot; entries.push(e);
      }
      return;
    }
    if(!AUDIT_FAMS[first]) return;
    auditLeaves(op.p, op.v, []).forEach(l=>{
      const parts = l.p.split('/');
      if(first==='days'){
        if(parts.length===2 && l.v===null){ dayDel.add(parts[1]); return; }
        if(parts.length===3 && l.v===null){ rowDel.push({d:parts[1], c:parts[2]}); return; }
        if(parts.length<4) return;
        const d = parts[1], c = parts[2], f = parts.slice(3).join('/');
        const od = auditDayNode(d);
        const o = od.known ? auditDig(od.node, [c].concat(parts.slice(3))) : undefined;
        if(od.known && Math.abs((Number(o)||0)-(Number(l.v)||0))<1e-9) return;   // مفيش تغيير فعلي
        const ch = {d, c, cn:auditClientName(c), f, v:auditShort(l.v)};
        if(od.known) ch.o = auditShort(o===undefined ? 0 : o);
        cells.push(ch);
      } else {
        const id = parts[1], f = parts.slice(2).join('/');
        const bucket = others[first] = others[first] || {ch:[], del:[]};
        const src = state[first] || {};
        if(parts.length===2 && l.v===null){ const old = src[id]; bucket.del.push({id, n:(old&&old.name)||auditClientName(id)}); return; }
        if(f==='order' || f==='createdAt' || f==='updatedAt' || f.indexOf('days/')===0) return;   // ضوضاء: ترتيب العملاء وبصمات الوقت
        const o = auditDig(src[id], parts.slice(2));
        if(o===l.v || (o==null && l.v==null) || (typeof o==='number' && typeof l.v==='number' && Math.abs(o-l.v)<1e-9)) return;
        const nm = (src[id] && src[id].name) || '';
        const ch = {id, n:nm, f, v:auditShort(l.v)}; if(o!==undefined) ch.o = auditShort(o);
        bucket.ch.push(ch);
      }
    });
  });
  /* خلايا اليوميات */
  if(cells.length){
    const dates = [...new Set(cells.map(x=>x.d))];
    const e = Object.assign(head(), {k: cells.length>AUDIT_MAXCH ? 'bulk' : 'edit', n:cells.length, dates});
    if(dates.length===1) e.date = dates[0];
    e.ch = cells.slice(0, cells.length>AUDIT_MAXCH ? 15 : AUDIT_MAXCH);
    entries.push(e);
  }
  dayDel.forEach(date=>{
    const od = auditDayNode(date), e = Object.assign(head(), {k:'day-delete', date});
    if(od.known){
      let drawn=0, coll=0, debt=0, rows=0;
      Object.keys(od.node).forEach(id=>{ const r=od.node[id]||{}; rows++;
        drawn += finKeys().reduce((s,k)=>s+(Number(r[k])||0),0);
        coll += Number(r.collection)||0; debt += Number(r.debtYesterday)||0; });
      e.rows = rows; e.tot = {drawn:Math.round(drawn*100)/100, collection:Math.round(coll*100)/100, debtYesterday:Math.round(debt*100)/100};
    }
    entries.push(e);
  });
  if(rowDel.length){
    const dates = [...new Set(rowDel.map(x=>x.d))];
    entries.push(Object.assign(head(), {k:'row-delete', n:rowDel.length, dates, ch: rowDel.slice(0,AUDIT_MAXCH).map(x=>({d:x.d, c:x.c, cn:auditClientName(x.c)}))}));
  }
  Object.keys(others).forEach(fam=>{
    const b = others[fam];
    if(b.ch.length) entries.push(Object.assign(head(), {k:AUDIT_FAMS[fam], n:b.ch.length, ch:b.ch.slice(0,AUDIT_MAXCH)}));
    if(b.del.length) entries.push(Object.assign(head(), {k:AUDIT_FAMS[fam]+'-delete', n:b.del.length, ch:b.del.slice(0,AUDIT_MAXCH)}));
  });
  return entries.map(e=>JSON.parse(JSON.stringify(e)));   // يشيل أي undefined
}

function auditSend(e){
  try{
    const ref = state.db.ref('audit').push();
    ref.set(Object.assign({at: firebase.database.ServerValue.TIMESTAMP}, e)).catch(()=>{
      if(!auditSend._warned){ auditSend._warned = true; toast('⚠ سجل التعديلات مش بيتحفظ دلوقتي'); }
    });
  }catch(err){}
}

function installAudit(){
  try{
    const P = firebase.database.Reference.prototype;
    ['set','update','remove'].forEach(m=>{
      const orig = P[m];
      P[m] = function(...a){
        const u = state.user;
        if(!u || u.role==='rep' || !state.db) return orig.apply(this, a);
        let entries = [];
        try{
          const base = auditRelPath(this);
          const hit = lockedHit(base, m, a);
          if(hit){
            const msg = 'يوم '+hit+' مقفول — افتحه الأول (زرار «فتح اليوم» في اليومية)';
            toast(msg);
            return Promise.reject(Object.assign(new Error(msg), {code:'day-locked'}));
          }
          entries = auditBuild(base, m, a, u);
        }catch(err){ entries = []; }
        const r = orig.apply(this, a);
        if(entries.length && r && typeof r.then==='function') r.then(()=>entries.forEach(auditSend), ()=>{});
        return r;
      };
    });
    /* اسم العملية اللي بتتكتب في السجل (best effort) */
    const CTX = {saveAllPending:'تعديل يدوي', mvApply:'نقل يوم', mvUndo:'تراجع عن نقل يوم', applyCarryPlan:'ترحيل المديونية', carryDebtForward:'ترحيل المديونية', cascadeCarry:'ترحيل متسلسل',
      undoCarry:'تراجع عن ترحيل', runImport:'استيراد إكسيل', mchApply:'رفع مكن', mchUndo:'تراجع عن رفع مكن', csApply:'رفع كاش', csUndo:'تراجع عن رفع كاش',
      amApply:'رفع مكن امان', dwApply:'سحب مكن', upApply:'رفع تحصيل', upUndo:'تراجع عن رفع تحصيل', zApply:'تصفير', zUndo:'تراجع عن تصفير',
      fdApply:'رفع يومية كاملة', fdUndo:'تراجع عن رفع يومية', dbtApply:'رفع مديونية', dbtUndo:'تراجع عن رفع مديونية', deleteDay:'حذف يوم'};
    Object.keys(CTX).forEach(name=>{
      const f = window[name]; if(typeof f!=='function') return;
      window[name] = function(...a){
        const prev = state._auditCtx; state._auditCtx = CTX[name];
        let r; try{ r = f.apply(this, a); }catch(e){ state._auditCtx = prev; throw e; }
        if(r && typeof r.then==='function') return r.finally(()=>{ state._auditCtx = prev; });
        state._auditCtx = prev; return r;
      };
    });
  }catch(e){}
}

function dayTotals(){
  const d = state.dayData || {}; let drawn=0, coll=0, nd=0, n=0;
  Object.keys(d).forEach(id=>{ const r = d[id]||{}; n++;
    drawn += finKeys().reduce((s,k)=>s+(Number(r[k])||0),0);
    coll += Number(r.collection)||0; nd += computeNewDebt(r); });
  const q = x=>Math.round(x*100)/100;
  return {drawn:q(drawn), collection:q(coll), newDebt:q(nd), n};
}

async function toggleDayLock(){
  const u = state.user;
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  if(!u || u.role!=='admin') return toast('قفل وفتح الأيام للأدمن بس');
  const date = state.day;
  const denied = e=>toast('خطأ: '+e.message+(/permission/i.test((e.code||'')+' '+e.message)?' — معندكش صلاحية لتنفيذ العملية دي':''));
  if(isLocked(date)){
    const reason = await askPrompt('سبب فتح يوم '+date+'؟ (بيتسجّل في سجل التعديلات)');

    if(!await askConfirm(msg)) return;
    state.db.ref('locks/'+date).set({at: firebase.database.ServerValue.TIMESTAMP, by:u.uid, byName:u.name||'', tot:{drawn:t.drawn, collection:t.collection, newDebt:t.newDebt, n:t.n}})
      .then(()=>toast('اتقفل يوم '+date+' 🔒')).catch(denied);
  });
}

/* ================= راس المال (يومي) =================
   راس المال: مبلغ واحد بتكتبه. العمولة: مبلغ واحد بتكتبه برضو. التجميع: مبلغ لكل ماستر.
   متخزن لكل يوم في meta/capital/<التاريخ>/{capital, <الماستر>:{collect}} */
const CAP_ROWS = [['fawry','فوري'],['aman','امان'],['mumkin','ممكن'],['masary','مصاري'],['cash','النقدي'],['wallets','المحافظ'],['market','اجل السوق']];
const capData = date => ((state.capital||{})[date]) || {};
const capQ = x => Math.round(x*100)/100;
const capCls = v => 'tnum ' + (v<0 ? 'neg' : (v>0 ? 'pos' : ''));
/* الفلوس اللي علينا: الموردين بيتجابوا لوحدهم من تبويب الموردين (الاسم + الرصيد الحالي لايف) + خانة تحصيل بتكتبها انت، والصافي = الرصيد − التحصيل.
   التحصيل متخزن لكل يوم في meta/capital/<التاريخ>/owe/<id المورد> = {col, name}، وبنفس الكتابة (atomic) بيتضاف الفرق على خانة "مسدد" عند المورد في تبويب الموردين،
   فالرصيد الحقيقي بينقص وبيتسمع في اليوم اللي بعده. عشان كده "الفلوس بتاعته" = الرصيد الحالي + تحصيل اليوم المتسجل (الرصيد قبل تحصيل اليوم). */
const capSupBal = sp => capQ((Number(sp.prevBalance)||0)+(Number(sp.withdrawals)||0)-(Number(sp.commission)||0)-(Number(sp.paid)||0));
const capOweRows = d => {
  const owe = (d && d.owe) || {};
  return Object.entries(state.suppliers||{}).filter(([k,x])=>x&&x.name)
    .map(([k,x])=>{ const col = Number((owe[k]||{}).col)||0; return {id:k, name:x.name, bal:capQ(capSupBal(x)+col), col}; })
    .filter(r=>r.bal || r.col)
    .sort((a,b)=>a.name.localeCompare(b.name,'ar'));
};
function capOweDom(root){
  return [...root.querySelectorAll('tr[data-owe]')].map(tr=>{
    const bal = Number(tr.dataset.bal)||0, col = oldParse(tr.querySelector('input').value);
    return {name: tr.dataset.name||'', bal, col, amt: capQ(bal-col), tr};
  });
}
function capCalc(root){

  CAP_ROWS.forEach(([k])=>{ tc += oldParse(root.querySelector(`input[data-ck="${k}"]`).value); });

  root.querySelector('#capStatCap').textContent = fmt(capQ(cap));

  a.textContent = b.textContent = fmt(com);
  a.className = capCls(com); b.className = 'val ' + capCls(com);
  const owRows = capOweDom(root);
  owRows.forEach(x=>{ x.tr.querySelector('.owe-bal').textContent = fmt(x.bal); const n = x.tr.querySelector('.owe-net'); n.textContent = fmt(x.amt); n.className = 'owe-net ' + capCls(x.amt); });
  const ow = capQ(owRows.reduce((t,x)=>t+x.amt,0)), net = capQ(tc - ow);
  const q = id => root.querySelector(id);
  if(q('#capOweBal')) q('#capOweBal').textContent = fmt(capQ(owRows.reduce((t,x)=>t+x.bal,0)));
  if(q('#capOweCol')) q('#capOweCol').textContent = fmt(capQ(owRows.reduce((t,x)=>t+x.col,0)));
  root.querySelector('#capStatOwe').textContent = fmt(ow);
  root.querySelector('#capStatNet').textContent = fmt(net);
  root.querySelector('#capOweTot').textContent = fmt(ow);
  root.querySelector('#capOweSum').textContent = fmt(ow);
  root.querySelector('#capNet').textContent = fmt(net);
}

function addTabPdfBtn(main){
  if(!state.user || main.querySelector('#tabPdfBtn') || main.querySelector('#capPdf') || main.querySelector('.login-card,#loginInput')) return;
  const b = document.createElement('button'); b.className = 'btn primary'; b.id = 'tabPdfBtn'; b.type = 'button'; b.textContent = 'تنزيل PDF';
  b.style.marginInlineStart = '8px'; b.onclick = ()=>tabPdf(main);
  const host = main.querySelector('.topbar');
  if(host) host.appendChild(b);
  else { const w = document.createElement('div'); w.style.cssText = 'text-align:end;margin-bottom:8px'; w.appendChild(b); main.prepend(w); }
}

/* ================= تثبيت التطبيق (PWA) ================= */
const pwa = { deferred:null, installed:false };
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  pwa.deferred = e;
  if(state.tab==='settings') renderSettings($('#main') || document.querySelector('main'));
});
window.addEventListener('appinstalled', ()=>{
  pwa.deferred = null; pwa.installed = true;
  if(state.tab==='settings') renderSettings($('#main') || document.querySelector('main'));
});
function pwaStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
async function pwaInstallClick(){
  if(!pwa.deferred){ toast('التثبيت مش متاح دلوقتي من المتصفح ده — جرّب كروم على الموبايل أو الكمبيوتر'); return; }
  pwa.deferred.prompt();
  const r = await pwa.deferred.userChoice.catch(()=>null);
  pwa.deferred = null;
  if(r && r.outcome==='accepted') toast('جارٍ تثبيت التطبيق...');
  if(state.tab==='settings') renderSettings($('#main') || document.querySelector('main'));
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

function boot(){
  rebuildTypeConsts(); window._typesReady = true;
  installGuard(); installAudit(); ensureSaveBar();
  const cfg = loadConfig() || DEFAULT_FIREBASE_CONFIG;
  render();
  connectFirebase(cfg);
  /* تحميل مكتبة الإكسيل في الخلفية بعد ما الشاشة تفتح، أو أول ما تدوس على أداة */
  const warm = ()=>{ loadXLSX().catch(()=>{}); };
  setTimeout(()=>{ if(window.requestIdleCallback) requestIdleCallback(warm, {timeout:4000}); else warm(); }, 3500);
  document.addEventListener('pointerdown', function f(e){ if(e.target.closest && e.target.closest('.tile,.tab-btn')){ document.removeEventListener('pointerdown', f); warm(); } }, {passive:true});
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>
