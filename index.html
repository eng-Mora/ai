<style>
/* ===== تصميم: دفتر يومية ورقي رقمي — لون أساسي أخضر دفتر (زمردي غامق) + كهرماني للتنبيهات
   التخطيط: شريط تبويبات ثابت يمين الشاشة على الديسكتوب، وشريط سفلي على الموبايل ===== */
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-2:#eef0ec;
  --fg:#1c2622;
  --fg-dim:#5b6b63;
  --border:#dcdcd2;
  --accent:#0f6b5c;
  --accent-fg:#ffffff;
  --accent-soft:#e3efe9;
  --warn:#b3742a;
  --warn-soft:#f6ead9;
  --danger:#ad3f30;
  --danger-soft:#f6e1dc;
  --good:#2f8f5b;
  --good-soft:#e2f1e7;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px -8px rgba(20,30,25,.15);
  color-scheme: light;
}

:root[data-theme="dark"]{
  --bg:#121917;
  --surface:#1a2320;
  --surface-2:#202a26;
  --fg:#eef1ee;
  --fg-dim:#9fb0a7;
  --border:#2b3732;
  --accent:#35ad8e;
  --accent-fg:#06211b;
  --accent-soft:#1d332c;
  --warn:#dba35c;
  --warn-soft:#3a2d1c;
  --danger:#e07b67;
  --danger-soft:#3a2420;
  --good:#5ac98c;
  --good-soft:#1d332a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
h1,h2,h3,.display{font-family:"Cairo","Tajawal",sans-serif; text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--accent); color:var(--accent-fg)}
a{color:var(--accent)}
button{font:inherit}
input,select{font:inherit; color:inherit}

/* ---- App shell ---- */
.app{display:flex; min-height:100%; min-height:100dvh}
.rail{
  width:84px; flex:0 0 auto; background:var(--surface); border-inline-start:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) 14px;
}
.rail .brand{
  width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;font-family:"Cairo";font-weight:800;font-size:17px;margin-bottom:10px;
}
.tab-btn{
  width:68px; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 4px; border:none; background:transparent; color:var(--fg-dim); border-radius:12px; cursor:pointer;
}
.tab-btn svg{width:20px;height:20px}
.tab-btn span{font-size:11px; font-weight:500}
.tab-btn.active{background:var(--accent-soft); color:var(--accent)}
.tab-btn:hover:not(.active){background:var(--surface-2)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--danger); margin-top:auto; margin-bottom:6px}
.conn-dot.ok{background:var(--good)}

main{flex:1 1 auto; min-width:0; padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 24px); max-width:1180px; margin-inline:auto; width:100%}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.topbar h1{font-size:21px; margin:0; font-weight:800}
.topbar .sub{color:var(--fg-dim); font-size:13px; margin-top:2px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.pad{padding:16px}

.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--fg); padding:9px 14px; cursor:pointer; font-weight:600; font-size:13.5px;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.sm{padding:6px 10px; font-size:12.5px; border-radius:8px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.danger{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft)}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; color:var(--fg-dim); font-weight:600}
.field input, .field select, .field textarea{
  padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--fg); width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px}

.grid{display:grid; gap:12px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px;
  display:flex; flex-direction:column; gap:4px; min-width:0;
}
.stat .label{font-size:12px; color:var(--fg-dim); font-weight:600}
.stat .val{font-family:"Cairo"; font-weight:800; font-size:22px}
.stat .val small{font-size:13px; font-weight:600; color:var(--fg-dim)}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.danger{background:var(--danger-soft); color:var(--danger)}
.pill.neutral{background:var(--surface-2); color:var(--fg-dim)}

.tablewrap{overflow-x:auto; border-radius:14px; border:1px solid var(--border)}
table{border-collapse:collapse; width:100%; min-width:720px; background:var(--surface)}
thead th{
  position:sticky; top:0; background:var(--surface-2); z-index:1; text-align:center; font-size:12.5px;
  color:var(--fg-dim); font-weight:700; padding:10px 8px; border-bottom:1px solid var(--border); white-space:nowrap;
}
thead th:first-child, tbody td:first-child{text-align:start}
tbody td{padding:7px 8px; border-bottom:1px solid var(--border); text-align:center; font-size:13.5px}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
tfoot td{padding:10px 8px; font-weight:800; background:var(--surface-2); border-top:2px solid var(--border); text-align:center}
td.name-cell{text-align:start; font-weight:700; min-width:140px}
td input.cell-amt{
  width:84px; text-align:center; border:1px solid transparent; background:transparent; border-radius:7px; padding:5px 4px;
}
td input.cell-amt:hover{border-color:var(--border)}
td.lock-off{opacity:.4; background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(128,128,128,.10) 6px 12px)}
td.lock-off input{cursor:not-allowed}
td.lock-on{background:var(--accent-soft)}
#editLock.on{border-color:var(--accent); background:var(--accent-soft); font-weight:700}
td input.cell-amt:focus{border-color:var(--accent); background:var(--bg); outline:none}
td.readonly{color:var(--fg-dim)}
td.neg{color:var(--danger); font-weight:700}
td.pos{color:var(--good); font-weight:700}

.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.daynav{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:5px}
.daynav input[type=date]{border:none; background:transparent; padding:6px 4px; font-weight:700}
.daynav button{border:none; background:transparent; width:30px; height:30px; border-radius:8px; cursor:pointer; color:var(--fg)}
.daynav button:hover{background:var(--surface-2)}

.search-input{position:relative; flex:1; min-width:180px}
.search-input input{width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface)}

.empty{padding:40px 20px; text-align:center; color:var(--fg-dim)}
.empty .ico{font-size:30px; margin-bottom:8px; opacity:.6}

.modal-bg{position:fixed; inset:0; background:rgba(10,14,12,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.modal{background:var(--surface); border-radius:16px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow); border:1px solid var(--border)}
.modal .hd{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border)}
.modal .hd h3{margin:0; font-size:16.5px}
.modal .bd{padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.modal .ft{padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px}

.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}

.toast{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); inset-inline:0; display:flex; justify-content:center; z-index:60; pointer-events:none}
.toast .box{background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:all .25s}
.toast .box.show{opacity:1; transform:translateY(0)}

.steps{display:flex; gap:6px; margin-bottom:14px}
.steps .s{flex:1; height:4px; border-radius:3px; background:var(--border)}
.steps .s.on{background:var(--accent)}

.tag-rep{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--fg-dim)}
.tag-rep .dot{width:7px;height:7px;border-radius:50%}

@media (max-width:760px){
  .rail{position:fixed; bottom:0; inset-inline:0; width:auto; flex-direction:row; justify-content:space-around;
    padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px); border-inline-start:none; border-top:1px solid var(--border); z-index:40}
  .rail .brand{display:none}
  .conn-dot{display:none}
  .tab-btn{width:auto; flex:1}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.hidden-print{}
/* ---- اليومية: الجدول ياخد عرض الشاشة كله من غير سكرول أفقي ---- */
main.wide{max-width:none; padding-inline:12px}
.ledger-table{min-width:0; table-layout:auto}
.ledger-table thead th{padding:9px 3px; font-size:12px; white-space:normal; line-height:1.3}
.ledger-table tbody td{padding:6px 3px; font-size:13px}
.ledger-table tfoot td{padding:9px 3px; font-size:13px}
.ledger-table td.name-cell{min-width:0; width:18%; word-break:break-word}
.ledger-table td.num-cell{width:34px}
.ledger-table td input.cell-amt{width:100%; min-width:46px; max-width:92px; padding:5px 2px}
.ledger-table td input.note-in{min-width:0; width:100%; padding:5px 6px}
.ledger-table td .btn.sm{padding:5px 8px}
.ledger-table tbody tr{cursor:pointer}
.ledger-table tbody tr.sel td{background:var(--warn-soft)!important; color:var(--fg); font-weight:800; border-bottom-color:var(--warn)}
.ledger-table tbody tr.sel td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
.ledger-table tbody tr.sel td input.cell-amt{font-weight:800; color:var(--fg)}
.ledger-table tbody tr.sel td.neg{color:var(--danger)}
.ledger-table tbody tr.sel td.pos{color:var(--good)}.tot-strip{position:sticky; bottom:0; z-index:5; margin-top:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:8px 12px; display:flex; align-items:center; gap:12px; overflow-x:auto}
.tot-title{font-weight:800; font-size:12.5px; white-space:nowrap; color:var(--fg-dim); line-height:1.35}
.tot-items{display:flex; gap:6px; flex:1}
.tot-item{display:flex; flex-direction:column; align-items:center; min-width:76px; flex:1; padding:3px 6px; border-radius:9px}
.tot-item span{font-size:11px; color:var(--fg-dim); font-weight:600; white-space:nowrap}
.tot-item b{font-family:"Cairo",sans-serif; font-size:14px; white-space:nowrap}
.tot-item.hi{background:var(--accent-soft); color:var(--accent)}
.tot-item.hi span{color:var(--accent)}
@media (max-width:760px){ .tot-strip{bottom:calc(64px + env(safe-area-inset-bottom,0px))} }
.sel-sm{padding:7px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-weight:600; font-size:13px}
td.num-cell{width:44px; color:var(--fg-dim); font-weight:700}
.preview-box{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600}
.preview-box.warn{background:var(--warn-soft); color:var(--warn)}
@media (max-width:760px){ .tab-btn span{font-size:10px} .tab-btn svg{width:19px;height:19px} }
.hl{background:var(--warn-soft); color:var(--warn); font-weight:800}
.sec-title{font-size:15px; margin:0 0 8px; font-family:"Cairo",sans-serif}
@media (max-width:760px){ .tab-btn{min-width:0; padding:8px 2px} .tab-btn span{white-space:nowrap} }
.badge-count{background:var(--accent); color:var(--accent-fg); border-radius:999px; font-size:10.5px; padding:1px 6px; margin-right:4px}
.logged-out .rail{display:none}
.logged-out .app{display:block}
.login-wrap{min-height:80vh;display:grid;place-items:center}
.login-card{width:min(360px,92vw);display:grid;gap:14px;text-align:center}
td input.note-in{width:100%;min-width:150px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
body.ro #fullDayBtn,body.ro #debtUpBtn,body.ro #addClientLedger,body.ro #carryBtn,body.ro #cascadeBtn,body.ro #upCollBtnL,body.ro #amanUpBtn,body.ro #drawUpBtn,body.ro #cashUpBtn,body.ro #zeroBtnL,body.ro #delDayBtn,body.ro #moveDayBtn,body.ro #lockDayBtn,body.ro #expBtnL,body.ro #repFilter,body.ro #sRep,body.ro [data-editc]{display:none!important}
/* ---- استكمال البيانات ---- */
.cmp-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px}
.cmp-card{padding:14px; display:flex; flex-direction:column; gap:10px; transition:background .2s,border-color .2s}
.cmp-card.visited{background:var(--good-soft); border-color:var(--good)}
.cmp-hd{display:flex; align-items:center; gap:10px}
.cmp-name{font-family:"Cairo",sans-serif; font-weight:800; font-size:15px; flex:1; min-width:0}
.cmp-num{color:var(--fg-dim); font-weight:700; margin-inline-end:6px}
.cmp-visit{display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:999px; background:var(--surface-2); color:var(--fg-dim); white-space:nowrap}
.cmp-visit input{width:18px; height:18px; accent-color:var(--good); margin:0}
.cmp-card.visited .cmp-visit{background:var(--good); color:var(--bg)}
.cmp-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cmp-grid .full{grid-column:1/-1}
.cmp-ex{font-size:12px}
.cmp-bar{height:6px; border-radius:4px; background:var(--border); overflow:hidden}
.cmp-bar i{display:block; height:100%; background:var(--good); transition:width .25s}

/* ===== تبويب راس المال ===== */
.cap-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.cap-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px; min-width:0}
.cap-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.cap-head h3{margin:0; font-size:15px; font-weight:800; font-family:"Cairo",sans-serif}
.cap-head .sub{margin:0; font-size:12px}
.cap-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.cap-in{width:100%; padding:11px 10px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--fg); font-weight:800; font-size:18px; text-align:center; font-family:inherit}
.cap-in:focus{outline:2px solid var(--accent); outline-offset:1px}
.cap-sep{height:1px; background:var(--border); margin:18px 0}
.cap-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.cap-tile{display:flex; flex-direction:column; gap:8px; justify-content:space-between; text-align:center; padding:12px; border:1.5px solid var(--border); border-radius:14px; background:var(--surface); color:var(--fg); cursor:pointer; font-family:inherit; margin:0}
.cap-tile .t{font-size:13px; font-weight:700; color:var(--fg-dim)}
.cap-tile .big{font-size:20px; font-weight:800; padding:11px 0}
.cap-tile .cap-in{padding:9px 6px; font-size:17px}
.cap-tile.short.on{border-color:var(--danger); background:var(--danger-soft)}
.cap-tile.over.on{border-color:var(--accent); background:var(--accent-soft)}
.cap-tile.ok.on{border-color:var(--good); background:var(--good-soft)}
.cap-tile.on .t{color:var(--fg)}
.cap-tile.ok:hover{background:var(--surface-2)} .cap-tile.ok.on:hover{background:var(--good-soft)}
.cap-cols{display:grid; grid-template-columns:1fr; gap:16px; align-items:start}
.cap-cols .cap-card{margin-bottom:0}
.cap-tw{overflow-x:auto; border:1px solid var(--border); border-radius:12px}
.cap-tw table{width:100%; min-width:0}
.cap-tw .cell-amt{max-width:150px; border-color:var(--border); background:var(--bg)}
.cap-tw select{max-width:100%}
@media(min-width:960px){ .cap-cols{grid-template-columns:1fr 1fr} }
@media(max-width:520px){ .cap-tiles{grid-template-columns:1fr} }
</style>
<style id="polish">
/* ===== Polish layer: ورق دفتر حسابات — هدوء، تباين أعلى، وأهداف لمس أوضح ===== */
:root{
  --bg:#f2f1ea; --surface:#fffefa; --surface-2:#eceee7; --fg:#17231f; --fg-dim:#56655e; --border:#d8d9cf;
  --accent:#0a5c4d; --accent-soft:#dcece5; --warn:#a8641a; --warn-soft:#f7e9d3;
  --danger:#a63a2b; --danger-soft:#f6e0da; --good:#237a4c; --good-soft:#dfefe5;
  --shadow:0 1px 0 rgba(23,35,31,.04),0 10px 26px -16px rgba(23,35,31,.30);
  --r-lg:14px; --r-md:10px; --r-sm:8px; --ring:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);
}

:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#172120; --surface-2:#1f2b28; --border:#2a3935; --fg:#edf1ee; --fg-dim:#9db0a7;
  --accent:#3fb596; --accent-soft:#1a3029; --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);}
body{-webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}
*{scrollbar-width:thin; scrollbar-color:var(--border) transparent}

/* --- الشريط الجانبي / السفلي --- */
.rail{width:88px; gap:2px; border-inline-start:1px solid var(--border)}
.rail .brand{width:44px; height:44px; border-radius:13px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); margin-bottom:14px}
.tab-btn{position:relative; min-height:58px; justify-content:center; transition:background .15s,color .15s}
.tab-btn span{font-size:11.5px; font-weight:700}
.tab-btn.active::before{content:""; position:absolute; inset-block:14px; inset-inline-start:-10px; width:4px; background:var(--accent);
  border-start-end-radius:4px; border-end-end-radius:4px}
.tab-btn:active{transform:scale(.96)}
.conn-dot{width:10px; height:10px; box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.conn-dot.ok{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 18%,transparent)}

/* --- العناوين والكروت --- */

const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);

   أي نوع جديد بياخد مفتاح خاص (t...) وبيظهر كخانة في اليومية والإجماليات والتصدير والرفع وكل التبويبات.

function userFirst(){

const BASE_TYPES = [

const _reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

  const cfg = state.typeCfg || {}, lb = cfg.labels || {}, ex = cfg.extra || {};

  if(!_colmap0) _colmap0 = Object.assign({}, COLMAP);

      for(const x of act){
        if(seen.has(x.label) || TYPE_RESERVED.includes(x.label)) return toast('الاسم «'+x.label+'» متكرر أو محجوز');

      }
      const removed = list.filter(x=>x.del && !x.isNew);

      const labels = {}, extra = {}; let order = 0;
      act.forEach(x=>{
        if(baseSet.has(x.key)){ const def = BASE_TYPES.find(b=>b.k===x.key).l; if(x.label!==def) labels[x.key] = x.label; }
        else { const key = x.isNew ? 't'+Date.now().toString(36)+(++order) : x.key; if(!x.isNew) order++; extra[key] = {label:x.label, order:order}; }
      });
      try{
        await state.db.ref(state.typePath || 'config/machineTypes').set({labels, extra});
        toast('تم حفظ أنواع المكن ✓'); closeModal();
      }catch(err){ toast('فشل الحفظ: '+err.message); }
    };

/* ---------- ترتيب وترقيم العملاء (نفس الترتيب في كل التبويبات) ---------- */
let _scSrc = null, _scVal = null, _cnVal = null;
function sortedClients(){
  if(_scSrc === state.clients && _scVal) return _scVal;   // نفس البيانات = نفس النتيجة (من غير ترتيب تاني)
  _scSrc = state.clients; _cnVal = null;
  _scVal = Object.entries(state.clients)
    .filter(([id,c])=>c && c.name)
    .sort((a,b)=>(a[1].order||0)-(b[1].order||0) || AR_COLLATOR.compare(a[1].name, b[1].name));
  return _scVal;
}
function clientNumbers(){
  const cl = sortedClients();
  if(_cnVal) return _cnVal;
  const m = {}; cl.forEach(([id],i)=>{ m[id]=i+1; }); return (_cnVal = m);
}
function maxOrder(){
  return Object.values(state.clients).reduce((mx,c)=>Math.max(mx, (c&&c.order)||0), 0);
}
function matchesRep(c, f){
  const u = state.user; if(u && u.role==='rep' && u.perms.own!==false && c.rep!==u.repId) return false;
  if(!f) return true;
  const has = c.rep && state.reps[c.rep];
  if(String(f).includes(',')) return String(f).split(',').some(x=> x==='__none__' ? !has : c.rep===x);
  return f==='__none__' ? !has : c.rep===f;
}
/* اختيار أكتر من مندوب: القيمة نص "id1,id2" */
function repSelIds(f){ return String(f||'').split(',').filter(x=>x && (x==='__none__' || state.reps[x])); }
function repSelValid(f){ return repSelIds(f).join(','); }
function repSelLabel(f){ return repSelIds(f).map(x=>x==='__none__' ? 'بدون مندوب' : state.reps[x].name).join(' + '); }
function openRepMultiPicker(cur, onApply){

  const rows = [...Object.entries(state.reps).filter(([id,r])=>r).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar')), ['__none__',{name:'بدون مندوب'}]];

function repFilterOptions(cur, multi){
  return `<option value="">كل المناديب</option>`
    + Object.entries(state.reps).filter(([id,r])=>r).sort((a,b)=>a[1].name.localeCompare(b[1].name,'ar'))
        .map(([id,r])=>`<option value="${id}" ${cur===id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')
    + `<option value="__none__" ${cur==='__none__'?'selected':''}>بدون مندوب</option>`
    + (String(cur||'').includes(',') ? `<option value="${escapeHtml(cur)}" selected>${escapeHtml(repSelLabel(cur))}</option>` : '')
    + (multi ? `<option value="__multi__">اختيار أكتر من مندوب…</option>` : '');
}
function compressRanges(nums){
  nums = nums.slice().sort((a,b)=>a-b);
  const out=[]; let st=null, pv=null;
  nums.forEach(n=>{
    if(st===null){ st=pv=n; }
    else if(n===pv+1){ pv=n; }
    else { out.push(st===pv?`${st}`:`${st}–${pv}`); st=pv=n; }
  });
  if(st!==null) out.push(st===pv?`${st}`:`${st}–${pv}`);
  return out.join('، ');
}

function computeNewDebt(row){
  const drawn = sumDrawn(row);
  const debtY = Number(row.debtYesterday)||0;
  const coll = Number(row.collection)||0;
  return debtY + drawn - coll;
}

let LEDGER_COLS = [['fawry','فوري'],['aman','امان'],['masary','مصاري'],['mumkin','ممكن'],['basata','بساطة'],['cash','كاش'],
  ['drawn','المسحوبات'],['collection','التحصيل'],['debtYesterday','آجل أمس'],['newDebt','المديونية']];
function totalsStrip(tot, count){
  const u = state.user;
  const items = LEDGER_COLS.filter(([k])=>k!=='drawn' && !(u && u.role==='rep' && u.perms.cols[k]===false));
  return `<div class="tot-strip"><div class="tot-title">الإجمالي<br><span class="tnum">${count} عميل</span></div>
    <div class="tot-items">${items.map(([k,l])=>`<div class="tot-item ${k==='collection'?'hi':''}"><span>${l}</span><b class="tnum">${fmt(tot[k])}</b></div>`).join('')}</div></div>`;

function renderLedger(main){
  const nums = clientNumbers(), FK = finKeys(), pbr = pendByRow(state.day);
  const repF = state.repFilter||'';
  const clientsArr = sortedClients()
    .filter(([id,c])=>c.active!==false)
    .filter(([id,c])=>matchesRep(c, repF))
    .filter(([id,c])=>{
      if(!state.onlyDrawn) return true;
      const r = state.dayData[id] || {};
      return (sumDrawn(r)) !== 0;
    });

  let totalDrawn=0, totalColl=0, totalDebtY=0, totalNewDebt=0;
  const tot = Object.assign(finZero(), {drawn:0, collection:0, debtYesterday:0, newDebt:0});
  const rows = clientsArr.map(([id,c])=>{
    const r = Object.assign({}, state.dayData[id] || {}, pbr[id] || null);
    const row = {collection:r.collection||0, debtYesterday:r.debtYesterday||0}; FK.forEach(k=>{ row[k] = r[k]||0; });
    const drawn = sumDrawn(row);
    const newDebt = computeNewDebt(row);
    totalDrawn+=drawn; totalColl+=row.collection; totalDebtY+=row.debtYesterday; totalNewDebt+=newDebt;

    return {id, num:nums[id], name:c.name, rep:c.rep, ...row, drawn, newDebt};

/* ================= أداء: تحجيم صفوف اليومية (Windowing) =================
   كل الصفوف بتفضل موجودة في الصفحة (عشان الإجماليات والتنقل بـ Enter والنسخ يشتغلوا زي ما هم)،
   لكن بس الصفوف القريبة من الشاشة هي اللي بيتحسب لها شكل وحجم. الباقي مخفي + فاصلين بيحافظوا على طول السكرول.
   ده اللي بيخلي فتح/قفل الأدوات والسكرول وكل تحديث لحظي سريعين حتى مع مئات العملاء. (الديسكتوب بس، ولو العملاء أكتر من ٧٠) */
const LW = { min:70, buf:12, h:56, inst:null };
function ledgerWinSetup(main){
  if(LW.inst){ LW.inst.destroy(); LW.inst = null; }
  const wrap = main.querySelector('.ledger-body .tablewrap');
  const table = wrap && wrap.querySelector('.ledger-table');
  const tb = table && table.tBodies[0];
  if(!tb) return;
  const mq = matchMedia('(min-width:761px)');
  const rows = Array.from(tb.querySelectorAll(':scope > tr[data-id]'));
  if(rows.length < LW.min || !mq.matches) return;
  const cols = tb.rows[0].cells.length;
  const mk = ()=>{ const tr = document.createElement('tr'); tr.className = 'win-sp'; const td = document.createElement('td'); td.colSpan = cols; td.style.cssText = 'padding:0;border:0;height:0;position:static;background:transparent'; tr.appendChild(td); return tr; };
  const spT = mk(), spB = mk();
  tb.insertBefore(spT, tb.firstChild); tb.appendChild(spB);
  rows.forEach((r,i)=>{ r._wi = i; });
  table.classList.add('win-on');
  table.style.minWidth = (34 + 64 + 150 + 100 + 52*Math.max(1, cols-4)) + 'px';
  let H = LW.h, s0 = 0, e0 = 0, raf = 0, dead = false;
  const apply = (first, last)=>{
    const lo = Math.min(s0, first), hi = Math.max(e0, last, first);
    for(let i=lo; i<Math.min(hi, rows.length); i++){
      const hide = !(i>=first && i<last);
      if(hide !== rows[i].classList.contains('win-h')) rows[i].classList.toggle('win-h', hide);
    }
    s0 = first; e0 = last;
    spT.firstChild.style.height = (first*H) + 'px';
    spB.firstChild.style.height = ((rows.length-last)*H) + 'px';
  };
  // أول رسمة: بنخمّن من ارتفاع الشاشة من غير ما نقرا layout (القراءة هتحسب الجدول كله)
  rows.forEach(r=>r.classList.add('win-h'));
  apply(0, Math.min(rows.length, Math.ceil(innerHeight/H) + LW.buf));
  const update = force=>{
    raf = 0; if(dead) return;
    if(!wrap.isConnected){ inst.destroy(); return; }
    const st = wrap.scrollTop, vh = wrap.clientHeight || innerHeight;
    let again = false;
    if(e0-s0>=3){   // نظبط تقدير ارتفاع الصف من المسافة الفعلية بين الصفوف الظاهرة
      const a = rows[s0], z = rows[e0-1];
      if(a && z && !a.classList.contains('win-h') && !z.classList.contains('win-h')){
        const hh = (z.offsetTop - a.offsetTop) / (e0-s0-1);
        if(hh>20 && hh<400 && Math.abs(hh-H)>0.3){ H = LW.h = hh; force = true; again = true; }   // التقدير بيفضل محفوظ للرسمات الجاية
      }
    }
    const off = table.tHead ? table.tHead.offsetHeight : 0;
    const need0 = Math.max(0, Math.floor((st - off)/H)), need1 = Math.min(rows.length, Math.ceil((st - off + vh)/H));
    if(force || need0 < s0 + 1 && s0>0 || need1 > e0 - 1 && e0<rows.length){
      apply(Math.max(0, need0 - LW.buf), Math.min(rows.length, need1 + LW.buf));
    }
    if(again && !dead && !raf) raf = requestAnimationFrame(()=>update());   // تأكيد القياس بعد ما التخطيط يستقر
  };
  const onScroll = ()=>{ if(!raf) raf = requestAnimationFrame(()=>update()); };
  const onResize = ()=>{ if(!raf) raf = requestAnimationFrame(()=>update(true)); };
  const onMq = ()=>{ if(!mq.matches){ inst.destroy(); } else scheduleRender(); };
  wrap.addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onResize);
  mq.addEventListener('change', onMq);
  raf = requestAnimationFrame(()=>update(true));
  const inst = LW.inst = {
    sync(a){
      if(raf){ cancelAnimationFrame(raf); raf = 0; }
      if(a){   // بعد إعادة الرسم: نرجّع نفس الصف في نفس مكانه على الشاشة (مش نفس رقم السكرول)
        const tr = rows.find(r=>r.dataset.id===a.id);
        if(tr){
          const i = tr._wi;
          apply(Math.max(0, i-LW.buf), Math.min(rows.length, i + Math.ceil(innerHeight/H) + LW.buf));
          const t = table.tHead.rows[0].cells[0].getBoundingClientRect().bottom;
          wrap.scrollTop += tr.getBoundingClientRect().top - t - a.off;
        }
      }
      update(true);
    },
    show(tr){ const i = tr._wi; if(i==null) return; if(i<s0 || i>=e0) apply(Math.min(s0,i), Math.max(e0,i+1)); },
    destroy(){
      if(dead) return; dead = true; if(raf) cancelAnimationFrame(raf);
      wrap.removeEventListener('scroll', onScroll); removeEventListener('resize', onResize); mq.removeEventListener('change', onMq);
      rows.forEach(r=>r.classList.remove('win-h')); spT.remove(); spB.remove();
      table.classList.remove('win-on'); table.style.minWidth = '';
      if(LW.inst===inst) LW.inst = null;
    }
  };
}
window.ledgerWinSync = a=>{ if(LW.inst) LW.inst.sync(a); };
window.ledgerWinCapture = ()=>{   // أول صف ظاهر + مكانه، قبل إعادة الرسم
  try{
    const w = document.querySelector('.ledger-body .tablewrap'); if(!LW.inst || !w || !w.scrollTop) return null;
    const t = w.querySelector('thead th').getBoundingClientRect().bottom;
    for(const r of w.querySelectorAll('tbody tr[data-id]')){
      if(r.classList.contains('win-h')) continue;
      const rc = r.getBoundingClientRect();
      if(rc.bottom > t+2) return {id:r.dataset.id, off:rc.top - t};
    }
  }catch(e){}
  return null;
};
window.ledgerWinShow = tr=>{ if(LW.inst) LW.inst.show(tr); };

/* ---------- التعديلات: شغّل على خانة واحدة وباقي الخانات تتقفل ---------- */
let EDIT_FIELDS = [['fawry','فوري'],['aman','امان'],['masary','مصاري'],['mumkin','ممكن'],['basata','بساطة'],['cash','كاش'],['collection','تحصيل'],['debtYesterday','آجل أمس']];
const editFieldLabel = k => (EDIT_FIELDS.find(x=>x[0]===k)||[0,k||''])[1];
function applyEditLock(){
  const f = state.editField || '';
  $$('input.cell-amt[data-field], input[data-sfield]').forEach(inp=>{

function shiftDate(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d+delta)).toISOString().slice(0,10);
}


/* ---------- حذف يوم كامل (لو اتفتح بالغلط، مثلًا بعد ترحيل المديونية) ---------- */
async function deleteDay(){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  const date = state.day, d = state.dayData || {};
  const ids = Object.keys(d);
  if(!ids.length) return toast('يوم '+date+' مفيهوش بيانات — مفيش حاجة تتحذف');
  let drawn=0, coll=0, debt=0, filled=0;
  ids.forEach(id=>{
    const r=d[id]||{};
    const dr=sumDrawn(r);
    drawn+=dr; coll+=Number(r.collection)||0; debt+=Number(r.debtYesterday)||0;
    if(dr||Number(r.collection)) filled++;
  });
  const msg = `هتحذف يوم ${date} بالكامل (${ids.length} عميل).\n\n`
    + `المسحوبات: ${fmt(drawn)}\nالتحصيل: ${fmt(coll)}\nآجل أمس: ${fmt(debt)}\n`
    + (filled ? `\n⚠ فيه ${filled} عميل ليهم حركة مسجلة في اليوم ده — هتتمسح نهائيًا ومينفعش ترجعها.\n` : '\n(اليوم مفيهوش حركة، بس آجل أمس المرحّل.)\n')
    + `\nتكمل الحذف؟`;
  if(!await askConfirm(msg)) return;
  if(filled && await askPrompt(`للتأكيد اكتب تاريخ اليوم (${date}):`) !== date) return toast('التاريخ مش مطابق — اتلغى الحذف');
  state.db.ref('days/'+date).remove().then(()=>{
    toast('تم حذف يوم '+date);
    state.day = shiftDate(date,-1); bindDay(state.day); render();
  }).catch(err=>toast('خطأ: '+err.message));
}

   - بيتنقل كل شيء في اليوم (كل العملاء بكل الخانات) لتاريخ تختاره انت
   - لو اليوم الجديد فيه بيانات: استبدال أو دمج (جمع الأرقام)
   - اليوم القديم بيتصفّر (كل الأرقام أصفار) أو يتحذف
   - فيه سجل وتراجع */
const MOVE_LOG = 'meta/dayMoves';
const mvState = {};
function mvIsObj(v){ return v && typeof v==='object'; }
function mvMerge(a, b){            // دمج صف عميل: الأرقام تتجمع
  const out = Object.assign({}, a||{});
  Object.entries(b||{}).forEach(([k,v])=>{
    if(typeof v==='number' || (typeof out[k]==='number' && typeof v==='number')) out[k] = upRound((Number(out[k])||0)+v);
    else if(out[k]==null) out[k] = v;
  });
  return out;
}
function mvZero(day){              // نفس العملاء بس كل الأرقام صفر
  const out = {};
  Object.entries(day||{}).forEach(([id,r])=>{
    if(!mvIsObj(r)) return;
    const z = {};
    Object.entries(r).forEach(([k,v])=>{ if(typeof v==='number') z[k]=0; });
    out[id] = z;
  });
  return out;
}
function mvStats(day){
  let n=0, drawn=0, coll=0, debt=0;
  Object.values(day||{}).forEach(r=>{
    if(!mvIsObj(r)) return; n++;
    drawn += finKeys().reduce((t,k)=>t+(Number(r[k])||0),0);
    coll += Number(r.collection)||0; debt += Number(r.debtYesterday)||0;
  });
  return {n, drawn:upRound(drawn), coll:upRound(coll), debt:upRound(debt)};
}

/* ================= ترحيل المديونية لليوم التالي (محسوب ومتأكَّد منه) =================
   - بيقرا اليومين والعملاء من السيرفر وقت الترحيل (مش من الشاشة)
   - بيرحّل كل العملاء: النشطين + أي عميل غير نشط أو محذوف عليه رصيد (محدش بيتنسي)
   - بعد الكتابة بيرجع يقرا يوم الترحيل من السيرفر ويطابق كل عميل، وبيصلّح لو فيه خلل
   - سجل للتراجع + نسخة احتياطية تلقائية + تقرير */
const rnd2 = x=>Math.round((Number(x)||0)*100)/100;
function planCarry(clients, fromData, toData){
  clients = clients||{}; fromData = fromData||{}; toData = toData||{};
  const ids = new Set();
  Object.entries(clients).forEach(([id,c])=>{ if(c && typeof c==='object') ids.add(id); });
  Object.entries(fromData).forEach(([id,r])=>{ if(r && typeof r==='object') ids.add(id); });
  const updates = {}, expected = {}, st = {total:0, fresh:0, diff:0, same:0, zero:0, inactiveDebt:0, orphanDebt:0};
  ids.forEach(id=>{
    const c = clients[id], row = fromData[id]||{};
    const nd = rnd2(computeNewDebt(row));
    if(!c){ if(nd===0) return; st.orphanDebt++; }
    else if(c.active===false){ if(nd===0) return; st.inactiveDebt++; }
    expected[id] = nd; st.total = rnd2(st.total+nd); if(nd===0) st.zero++;
    const ex = toData[id];
    if(!ex || typeof ex!=='object'){
      updates[id] = Object.assign({debtYesterday:nd, carriedIn:nd, collection:0}, finZero()); st.fresh++;
    } else if(ex.debtYesterday==null){
      updates[id+'/debtYesterday'] = nd; updates[id+'/carriedIn'] = nd; st.fresh++;
    } else {
      const prev = ex.carriedIn!=null ? Number(ex.carriedIn)||0 : Number(ex.debtYesterday)||0;
      const diff = rnd2(nd-prev);
      if(Math.abs(diff)>=0.005){ updates[id+'/debtYesterday'] = rnd2((Number(ex.debtYesterday)||0)+diff); updates[id+'/carriedIn'] = nd; st.diff++; }
      else { st.same++; if(ex.carriedIn==null) updates[id+'/carriedIn'] = nd; }
    }
  });
  return {updates, expected, st};
}
function verifyCarry(toData, expected){
  toData = toData||{}; const bad = []; let sum = 0;
  Object.entries(expected).forEach(([id,nd])=>{
    const r = toData[id];
    if(!r || typeof r!=='object'){ bad.push({id, why:'مش موجود في اليوم الجديد'}); return; }
    const ci = Number(r.carriedIn);
    if(r.carriedIn==null || Math.abs(ci-nd)>0.005){ bad.push({id, why:'الرقم المرحّل مش مطابق'}); return; }
    if(r.debtYesterday==null){ bad.push({id, why:'آجل أمس فاضي'}); return; }
    sum += nd;
  });
  return {bad, sum:rnd2(sum)};
}
async function applyCarryPlan(to, plan){
  const up = {}; Object.entries(plan.updates).forEach(([k,v])=>{ up['days/'+to+'/'+k] = v; });
  if(!Object.keys(up).length) return 'ok';
  return Promise.race([state.db.ref().update(up).then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
}
async function carryDebtForward(){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  if(!state.connected) return toast('الاتصال لسه مخلصش — استنى لحظة وجرّب تاني');
  if(pendCount()) return toast('احفظ التعديلات الأول');
  if(carryDebtForward._busy) return; carryDebtForward._busy = true;
  const btn = $('#carryBtn'); if(btn) btn.disabled = true;
  const from = state.day, to = shiftDate(from,1), cn = c=>(c&&c.name)||'';
  try{
    const [a,b,c] = await Promise.all([state.db.ref('days/'+from).once('value'), state.db.ref('days/'+to).once('value'), state.db.ref('clients').once('value')]);
    const fromData = a.val()||{}, toData = b.val()||{}, clients = c.val()||{};
    const plan = planCarry(clients, fromData, toData), n = Object.keys(plan.expected).length;
    if(!n){ toast('مفيش عملاء يترحّلوا'); return; }
    const extra = (plan.st.inactiveDebt?`\n• ${plan.st.inactiveDebt} عميل غير نشط عليه رصيد (هيترحّل برضو)`:'')+(plan.st.orphanDebt?`\n• ${plan.st.orphanDebt} عميل محذوف عليه رصيد (هيترحّل برضو)`:'');
    if(!await askConfirm(`ترحيل المديونية من ${from} إلى ${to}\n\n• ${n} عميل\n• إجمالي المديونية: ${fmt(plan.st.total)}${extra}\n\n${Object.keys(toData).length?'يوم '+to+' فيه بيانات — هيترحّل الفرق بس ومش هيتمسح حاجة.\n\n':''}تكمل؟`)) return;
    const logId = String(Date.now());
    const up = {}; Object.entries(plan.updates).forEach(([k,v])=>{ up['days/'+to+'/'+k] = v; });
    up['meta/carryLogs/'+logId] = {createdAt:Date.now(), from, to, count:n, total:plan.st.total, prevNext:Object.keys(toData).length?toData:null};
    let ack = await Promise.race([state.db.ref().update(up).then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'),10000))]);
    if(ack==='timeout'){ toast('السيرفر مردّش — الترحيل ممكن ميكونش اتحفظ. راجع النت وجرّب تاني'); return; }
    // فحص: نقرا يوم الترحيل من السيرفر ونطابق كل عميل
    let fresh = (await state.db.ref('days/'+to).once('value')).val()||{}, ver = verifyCarry(fresh, plan.expected), fixed = 0;
    for(let t=0; t<2 && ver.bad.length; t++){
      const plan2 = planCarry(clients, fromData, fresh); fixed += ver.bad.length;
      await applyCarryPlan(to, plan2);
      fresh = (await state.db.ref('days/'+to).once('value')).val()||{}; ver = verifyCarry(fresh, plan.expected);
    }
    state.day = to; bindDay(to); render();
    const snap = await makeSnapshot('ترحيل '+from+' ← '+to, [from,to]);
    showRolloverReport({
      title: 'تم ترحيل المديونية إلى '+to, ok: !ver.bad.length, logId,
      lines: [`${n} عميل — إجمالي المديونية المرحّلة <b class="tnum">${fmt(plan.st.total)}</b>`,
        `جديد: ${plan.st.fresh} · اتحدّث بالفرق: ${plan.st.diff} · من غير تغيير: ${plan.st.same}`
        +(plan.st.inactiveDebt?` · غير نشطين عليهم رصيد: ${plan.st.inactiveDebt}`:'')+(plan.st.orphanDebt?` · محذوفين عليهم رصيد: ${plan.st.orphanDebt}`:'')],
      check: ver.bad.length ? `❌ ${ver.bad.length} عميل فيهم مشكلة بعد الفحص: ${ver.bad.slice(0,8).map(x=>escapeHtml(cn(clients[x.id])||x.id)+' ('+x.why+')').join('، ')}`
        : `✅ الفحص تمام: كل الـ ${n} عميل موجودين في ${to} وأرصدتهم مطابقة (الإجمالي ${fmt(ver.sum)})${fixed?` — اتصلّح ${fixed} تلقائيًا`:''}`,
      snap });
  }catch(err){
    toast('فشل الترحيل: '+err.message);
  }finally{ carryDebtForward._busy = false; const bt = $('#carryBtn'); if(bt) bt.disabled = false; }
}
/* ================= تحديث الأيام اللي بعد اليوم الحالي (ترحيل متسلسل) =================
   لما تصلّح يوم قديم (تحصيل/مسحوبات/آجل) والأيام اللي بعده كانت مترحّلة قبل التصليح:
   - بيمشي يوم ورا يوم من اليوم الحالي لحد أول يوم مش موجود (أو مقفول)
   - بيستخدم نفس حسبة planCarry (بيضيف الفرق بس، وتعديلاتك اليدوية في الأيام اللي بعده متتمسحش)
   - بيعرض الفروق باسم العميل قبل ما يكتب، وبياخد نسخة احتياطية قبل الكتابة */
async function cascadeCarry(opts){
  const auto = !!(opts && opts.auto===true);   // تلقائي بعد الحفظ: ساكت لو مفيش فروق
  if(!state.db) return auto ? undefined : toast('مش متصل بقاعدة البيانات');
  if(!state.connected) return auto ? undefined : toast('الاتصال لسه مخلصش — استنى لحظة وجرّب تاني');
  if(pendCount()) return auto ? undefined : toast('احفظ التعديلات الأول');
  if(cascadeCarry._busy) return; cascadeCarry._busy = true;
  const btn = $('#cascadeBtn'); if(btn) btn.disabled = true;
  const applyUp = (data, ups)=>{ const o = JSON.parse(JSON.stringify(data||{}));
    Object.entries(ups).forEach(([k,v])=>{ const q = k.split('/'); if(q.length===1) o[k] = v; else (o[q[0]] = o[q[0]]||{})[q[1]] = v; }); return o; };
  try{
    const start = (opts && typeof opts.from==='string') ? opts.from : state.day;
    if(auto && !(await state.db.ref('days/'+shiftDate(start,1)).once('value')).val()) return;   // مفيش يوم بعده اترحّل
    const clients = (await state.db.ref('clients').once('value')).val()||{};
    const cn = id=>(clients[id]&&clients[id].name)||id;
    let cur = start, curData = (await state.db.ref('days/'+start).once('value')).val()||{};
    const up = {}, dates = [], lines = []; let changed = 0, stopMsg = '';
    for(let i=0;i<60;i++){
      const nxt = shiftDate(cur,1);
      const nxtData = (await state.db.ref('days/'+nxt).once('value')).val();
      if(!nxtData) break;
      if(isLocked(nxt)){ stopMsg = 'وقفت عند يوم '+nxt+' لأنه مقفول'; break; }
      const plan = planCarry(clients, curData, nxtData);
      const keys = Object.keys(plan.updates);
      if(keys.length){
        dates.push(nxt);
        keys.forEach(k=>{ up['days/'+nxt+'/'+k] = plan.updates[k]; });
        keys.forEach(k=>{
          const q = k.split('/'), id = q[0];
          if(q.length===2 && q[1]==='debtYesterday'){ const o = Number((nxtData[id]||{}).debtYesterday)||0, n = Number(plan.updates[k])||0; if(Math.abs(n-o)>=0.005){ changed++; lines.push(nxt+' · '+cn(id)+': '+fmt(o)+' ← '+fmt(n)); } }
          else if(q.length===1){ const n = Number(plan.updates[k].debtYesterday)||0; if(n){ changed++; lines.push(nxt+' · '+cn(id)+': 0 ← '+fmt(n)); } }
        });
      }
      curData = applyUp(nxtData, plan.updates); cur = nxt;
    }
    if(auto && !changed) return;
    if(!changed && !Object.keys(up).length) return toast(stopMsg || 'الأيام اللي بعد '+start+' مظبوطة — مفيش حاجة تتحدّث');
    const shown = lines.slice(0,10).join('\n') + (lines.length>10 ? '\n… و'+(lines.length-10)+' تغيير تاني' : '');
    if(!await askConfirm((auto?'⚠ التعديل اللي لسه حافظه غيّر قفلة يوم '+start+' واليوم اللي بعده كان مترحّل قبل كده.\n\n':'')+'تحديث الأيام اللي بعد '+start+' (لحد '+cur+')\n\n• '+changed+' تغيير في آجل أمس\n\n'+shown+(stopMsg?'\n\n⚠ '+stopMsg:'')+'\n\nهتتاخد نسخة احتياطية قبل الكتابة. تكمل؟')) return;
    await makeSnapshot('ترحيل متسلسل بعد '+start, dates);
    const ack = await Promise.race([state.db.ref().update(up).then(()=>'ok'), new Promise(r=>setTimeout(()=>r('timeout'),15000))]);
    if(ack==='timeout') return toast('السيرفر مردّش — التحديث ممكن ميكونش اتحفظ. راجع النت وجرّب تاني');
    toast('تم تحديث '+changed+' رصيد في '+dates.length+' يوم'+(stopMsg?' — '+stopMsg:''));
  }catch(err){
    toast('فشل التحديث: '+err.message);
  }finally{ cascadeCarry._busy = false; const bt = $('#cascadeBtn'); if(bt) bt.disabled = false; }
}
/* بعد أي حفظ: لو اليوم اللي اتعدّل بعده يوم مترحّل → يعرض الفروق ويحدّثها (بعد 5 ثواني من آخر حفظ علشان متتقطعش وانت بتكتب) */

async function undoCarry(logId){
  try{
    const log = (await state.db.ref('meta/carryLogs/'+logId).once('value')).val();
    if(!log || log.undone) return toast('الترحيل ده اتلغى قبل كده');
    if(!await askConfirm(`تتراجع عن ترحيل ${log.from} إلى ${log.to}؟ يوم ${log.to} هيرجع زي ما كان قبل الترحيل (أي تعديل عليه بعد الترحيل هيضيع).`)) return;
    const up = {}; up['days/'+log.to] = log.prevNext||null; up['meta/carryLogs/'+logId+'/undone'] = true;
    await state.db.ref().update(up); toast('تم التراجع عن الترحيل'); closeModal();

/* فحص النقل: اليوم الجديد لازم يطابق اللي اتنقل */
function verifyDay(freshTo, expected){
  freshTo = freshTo||{}; const bad = [];
  Object.entries(expected||{}).forEach(([id,row])=>{
    if(!row || typeof row!=='object') return; const r = freshTo[id];
    if(!r){ bad.push({id, why:'مش موجود'}); return; }
    for(const k in row){ if(typeof row[k]==='number' && Math.abs((Number(r[k])||0)-row[k])>0.005){ bad.push({id, why:'الرقم مختلف في «'+k+'»'}); return; } }
  });
  return bad;
}
async function postMoveChecks(m, srcData, newTgt, st){
  try{
    const fresh = (await state.db.ref('days/'+m.to).once('value')).val()||{};
    const bad = verifyDay(fresh, newTgt), cl = (await state.db.ref('clients').once('value')).val()||{};
    const snap = await makeSnapshot('نقل '+m.src+' ← '+m.to, [m.src,m.to]);
    showRolloverReport({ title:'تم نقل يوم '+m.src+' إلى '+m.to, ok:!bad.length,
      lines:[`${st.n} عميل — مسحوبات ${fmt(st.drawn)} · تحصيل ${fmt(st.coll)} · آجل أمس ${fmt(st.debt)}`],
      check: bad.length ? `❌ ${bad.length} عميل فيهم مشكلة: ${bad.slice(0,8).map(x=>escapeHtml((cl[x.id]&&cl[x.id].name)||x.id)+' ('+x.why+')').join('، ')}` : `✅ الفحص تمام: كل العملاء اتنقلوا وأرقامهم مطابقة في ${m.to}`,
      snap });
  }catch(e){ toast('النقل تم لكن الفحص/النسخة فشلوا: '+e.message); }
}

const ss = { q:'', rep:'', field:'any', op:'eq', v1:'', v2:'', scope:'day', allDays:null, loading:false, loadedAt:0 };

function norm(str){
  return String(str==null?'':str).toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\s+/g,' ').trim();
}

function searchCompute(){
  const nums = clientNumbers();
  const tokens = norm(ss.q).split(' ').filter(Boolean);
  const textOn = tokens.length>0, repOn = !!ss.rep;
  const a = Number(ss.v1), b = Number(ss.v2);
  const moneyOn = ss.v1!=='' && isFinite(a) && (ss.op!=='between' || (ss.v2!=='' && isFinite(b)));
  const res = {active: textOn||repOn||moneyOn, textOn, repOn, moneyOn, clients:[], rows:[], cash:[], suppliers:[]};
  if(!res.active) return res;

  const eps = 0.005;
  const okMoney = x=>{
    if(ss.op==='eq') return Math.abs(x-a)<eps;
    if(ss.op==='gte') return x>=a-eps;
    if(ss.op==='lte') return x<=a+eps;
    return x>=Math.min(a,b)-eps && x<=Math.max(a,b)+eps;
  };
  const hayOf = {};
  sortedClients().forEach(([id,c])=>{
    const rn = c.rep && state.reps[c.rep] ? state.reps[c.rep].name : '';
    hayOf[id] = norm([c.name, c.note, rn, nums[id], machineText(c)].join(' '));
  });
  const textOk = h => !textOn || tokens.every(t=>h.includes(t));
  const clientOk = (id,c)=> textOk(hayOf[id]||'') && matchesRep(c, ss.rep);

  /* سجلات اليومية */
  const days = ss.scope==='all' ? Object.assign({}, ss.allDays||{}, {[state.day]: state.dayData}) : {[state.day]: state.dayData};
  Object.keys(days).forEach(date=>{
    const day = days[date];
    if(!day || typeof day!=='object') return;
    Object.keys(day).forEach(id=>{
      const c = state.clients[id];
      if(!c || !clientOk(id,c)) return;
      const r = day[id]||{};
      const v = {collection:+r.collection||0, debtYesterday:+r.debtYesterday||0}; finKeys().forEach(k=>{ v[k] = +r[k]||0; });
      v.drawn = sumDrawn(v);
      v.newDebt = v.debtYesterday + v.drawn - v.collection;
      const matched = new Set();
      if(moneyOn){
        if(ss.field==='any') MONEY_KEYS.forEach(k=>{ if(v[k]!==0 && okMoney(v[k])) matched.add(k); });
        else if(okMoney(v[ss.field])) matched.add(ss.field);
        if(!matched.size) return;
      } else if(MONEY_KEYS.every(k=>v[k]===0)) return;
      res.rows.push({date, id, num:nums[id], name:c.name, rep:c.rep, v, matched});
    });
  });
  res.rows.sort((x,y)=> y.date.localeCompare(x.date) || x.num-y.num);

  /* العملاء */
  const idsWithRows = new Set(res.rows.map(r=>r.id));
  sortedClients().forEach(([id,c])=>{
    if(!clientOk(id,c)) return;
    if(moneyOn && !idsWithRows.has(id)) return;
    res.clients.push({id, c, num:nums[id]});
  });

  /* الكاش */
  if(!moneyOn || ss.field==='any' || ss.field==='cash'){
    Object.entries(state.cashOps).forEach(([id,o])=>{
      if(!o) return;
      if(ss.scope==='day' && o.date!==state.day) return;
      const c = state.clients[o.clientId], sp = state.suppliers[o.supplierId];
      if(repOn && !(c && matchesRep(c, ss.rep))) return;
      if(!textOk(norm([c&&c.name, sp&&sp.name, o.note, o.date].join(' ')))) return;
      const amt = Number(o.amount)||0;
      if(moneyOn && !okMoney(amt)) return;
      res.cash.push({id, o, amt, cName:c?c.name:'—', sName:sp?sp.name:'—'});
    });
    res.cash.sort((x,y)=>(y.o.createdAt||0)-(x.o.createdAt||0));
  }

  /* الموردين */
  if(!repOn && (textOn||moneyOn) && (!moneyOn || ss.field==='any')){
    Object.entries(state.suppliers).forEach(([id,sp])=>{
      if(!sp) return;
      if(!textOk(norm([sp.name, sp.note].join(' ')))) return;
      const bal = (Number(sp.prevBalance)||0)+(Number(sp.withdrawals)||0)-(Number(sp.commission)||0)-(Number(sp.paid)||0);
      const vals = [sp.prevBalance, sp.withdrawals, sp.commission, sp.paid, bal].map(x=>Number(x)||0);
      if(moneyOn && !vals.some(x=>x!==0 && okMoney(x))) return;
      res.suppliers.push({id, s:sp, bal});
    });
  }
  if(state.user && state.user.role==='rep'){ res.cash=[]; res.suppliers=[]; }
  return res;
}

  const total = res.clients.length + res.rows.length + res.cash.length + res.suppliers.length;
  if(!total) return h + `<div class="card"><div class="empty"><div class="ico">🤷</div>مفيش نتايج مطابقة.</div></div>`;

  const sum = k => res.rows.reduce((t,r)=>t+r.v[k],0);

    ${res.rows.length ? `
    <div class="stat"><div class="label">إجمالي المسحوبات</div><div class="val tnum">${fmt(sum('drawn'))} <small>ج.م</small></div></div>
    <div class="stat"><div class="label">إجمالي التحصيل</div><div class="val tnum">${fmt(sum('collection'))} <small>ج.م</small></div></div>` : ''}
  </div>`;

  const idsWithAcc = new Set(res.rows.map(r=>r.id));
  const canAddAcc = !(state.user && state.user.role==='rep');
  if(res.clients.length){
    const shown = res.clients.slice(0,200);
    h += `<h3 class="sec-title">العملاء (${res.clients.length})</h3>
    <div class="tablewrap" style="margin-bottom:20px"><table style="min-width:520px">
      <thead><tr><th>#</th><th>الاسم</th><th>المندوب</th><th>الحالة</th><th>ملاحظة</th><th></th></tr></thead><tbody>
      ${shown.map(({id,c,num})=>`<tr>
        <td class="num-cell tnum">${num}</td>
        <td class="name-cell">${escapeHtml(c.name)}</td>
        <td>${c.rep && state.reps[c.rep] ? escapeHtml(state.reps[c.rep].name) : '<span class="pill neutral">بدون</span>'}</td>
        <td>${c.active===false ? '<span class="pill warn">موقوف</span>' : '<span class="pill good">نشط</span>'}</td>
        <td style="max-width:200px;text-align:start;color:var(--fg-dim);font-size:12.5px">${escapeHtml(c.note||'')}</td>
        <td style="white-space:nowrap"><button class="btn sm" data-editc="${id}">تعديل</button>${(!idsWithAcc.has(id) && canAddAcc) ? ` <button class="btn sm primary" data-addacc="${id}">+ إضافة حساب</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      ${res.clients.length>200?`<div style="color:var(--fg-dim);font-size:12.5px;margin:-12px 0 16px">معروض أول 200 عميل — ضيّق البحث لنتايج أدق.</div>`:''}`;
  }

  if(res.rows.length){
    const shown = res.rows.slice(0,400);
    const EDIT_KEYS = [...finKeys(),'collection','debtYesterday'];
    const cell = (r,k)=> EDIT_KEYS.includes(k)
      ? `<td class="${r.matched.has(k)?'hl':''}"><input class="cell-amt tnum" type="number" step="any" data-sdate="${r.date}" data-sid="${r.id}" data-sfield="${k}" value="${r.v[k]||''}" placeholder="0"></td>`
      : `<td class="tnum ${r.matched.has(k)?'hl':''}">${r.v[k]!==0 ? fmt(r.v[k]) : '·'}</td>`;
    const dayScope = ss.scope==='day';
    h += `<h3 class="sec-title">سجلات اليومية (${res.rows.length}) <span style="font-weight:500;font-size:12.5px;color:var(--fg-dim)">— ${dayScope?'يوم '+state.day:'كل الأيام'}</span></h3>

    <div class="tablewrap" style="margin-bottom:20px"><table style="min-width:560px">
      <thead><tr><th>التاريخ</th><th>العميل</th><th>المورد</th><th>المبلغ</th><th>ملاحظة</th></tr></thead><tbody>
      ${res.cash.slice(0,200).map(x=>`<tr>
        <td class="tnum" style="text-align:start">${escapeHtml(x.o.date||'')}</td>
        <td class="name-cell">${escapeHtml(x.cName)}</td><td>${escapeHtml(x.sName)}</td>
        <td class="tnum ${ss.v1!==''?'hl':''}">${fmt(x.amt)}</td>
        <td style="max-width:200px;text-align:start;color:var(--fg-dim);font-size:12.5px">${escapeHtml(x.o.note||'')}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="3">الإجمالي</td><td class="tnum">${fmt(res.cash.reduce((t,x)=>t+x.amt,0))}</td><td></td></tr></tfoot></table></div>`;
  }

  if(res.suppliers.length){
    h += `<h3 class="sec-title">الموردين (${res.suppliers.length})</h3>
    <div class="tablewrap" style="margin-bottom:20px"><table style="min-width:560px">
      <thead><tr><th>المورد</th><th>رصيد سابق</th><th>مسحوبات</th><th>عمولة</th><th>مسدد</th><th>الرصيد الحالي</th></tr></thead><tbody>
      ${res.suppliers.map(({s:sp,bal})=>`<tr>
        <td class="name-cell">${escapeHtml(sp.name)}</td><td class="tnum">${fmt(sp.prevBalance)}</td><td class="tnum">${fmt(sp.withdrawals)}</td>
        <td class="tnum">${fmt(sp.commission)}</td><td class="tnum">${fmt(sp.paid)}</td>
        <td class="tnum" style="font-weight:800;color:${bal>0?'var(--danger)':'var(--good)'}">${fmt(bal)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return h;
}

function updateSearchResults(){
  const el = $('#searchResults');
  if(!el) return;
  const res = searchCompute();
  el.innerHTML = searchResultsHtml(res);
  $$('[data-copysr]', el).forEach(b=>b.onclick = ()=>{
    const r = res.rows[Number(b.dataset.copysr)];
    if(r) copyText(rowCopyText(r.date, r.name, r.rep, r.v));
  });
  $$('[data-goday]', el).forEach(a=>a.onclick = e=>{
    e.preventDefault();
    state.day = a.dataset.goday; bindDay(state.day); state.tab='ledger'; render();
  });
  $$('[data-editc]', el).forEach(b=>b.onclick = ()=>openClientModal(b.dataset.editc));
  $$('[data-addacc]', el).forEach(b=>b.onclick = ()=>openAddAccountModal(b.dataset.addacc));
  $$('input[data-sfield]', el).forEach(inp=>{
    inp.addEventListener('change', ()=>{
      if(!state.db) return toast('مش متصل بقاعدة البيانات بعد');
      const {sdate:date, sid:id, sfield:k} = inp.dataset;
      if(state.editField && state.editField!==k) return toast('الخانة دي مقفولة — التعديلات مفعّلة على «'+editFieldLabel(state.editField)+'» بس');
      const val = inp.value==='' ? 0 : Number(inp.value);
      if(!isFinite(val)) return toast('رقم غير صحيح');
      state.db.ref(`days/${date}/${id}`).update({[k]: val}).then(()=>{
        if(ss.allDays && ss.allDays[date]) { (ss.allDays[date][id] = ss.allDays[date][id]||{})[k] = val; }
        if(date===state.day) { (state.dayData[id] = state.dayData[id]||{})[k] = val; }
        toast('تم الحفظ');
        updateSearchResults();
      }).catch(err=>toast('خطأ: '+err.message));
    });
  });
  applyEditLock();
}

/* ================= إضافة حساب (سجل يومية) لعميل من البحث ================= */
function openAddAccountModal(clientId){
  const c = state.clients[clientId];
  if(!c) return;
  if(!state.db) return toast('مش متصل بقاعدة البيانات بعد');
  const lock = state.editField || '';
  const fld = (k,l)=>`<div class="field"><label>${escapeHtml(l)}</label><input id="acc_${k}" type="number" step="any" placeholder="0" ${lock && lock!==k ? 'disabled' : ''}></div>`;
  openModal(`
    <div class="hd"><h3>إضافة حساب — ${escapeHtml(c.name)}</h3><button class="btn ghost sm" id="mClose">✕</button></div>
    <div class="bd">
      <div class="field"><label>التاريخ</label><input id="acc_date" type="date" value="${state.day}"></div>
      ${(()=>{ const f = finCols(); let h=''; for(let i=0;i<f.length;i+=2) h += `<div class="row2">${fld(f[i][0],f[i][1])}${f[i+1]?fld(f[i+1][0],f[i+1][1]):''}</div>`; return h; })()}
      <div class="row2">${fld('collection','التحصيل')}${fld('debtYesterday','آجل أمس')}</div>
      <div style="font-size:12.5px;color:var(--fg-dim)">لو العميل عنده سجل في التاريخ ده بالفعل، الخانات اللي هتكتبها بس هي اللي هتتعدّل والباقي زي ما هو.</div>
    </div>
    <div class="ft"><button class="btn" id="mCancel">إلغاء</button><button class="btn primary" id="accSave">حفظ الحساب</button></div>
  `, ()=>{
    $('#mClose').onclick = $('#mCancel').onclick = closeModal;
    $('#accSave').onclick = ()=>{
      const date = $('#acc_date').value;
      if(!date) return toast('اختار التاريخ');
      const patch = {};
      for(const k of [...finKeys(),'collection','debtYesterday']){
        const el = $('#acc_'+k);
        if(!el || el.disabled || el.value==='') continue;
        const n = Number(el.value);
        if(!isFinite(n)) return toast('رقم غير صحيح في خانة '+editFieldLabel(k));
        patch[k] = n;
      }
      if(!Object.keys(patch).length) return toast('اكتب مبلغ في خانة واحدة على الأقل');
      $('#accSave').disabled = true;
      state.db.ref(`days/${date}/${clientId}`).update(patch).then(()=>{
        if(ss.allDays){ ss.allDays[date] = ss.allDays[date]||{}; ss.allDays[date][clientId] = Object.assign(ss.allDays[date][clientId]||{}, patch); }
        if(date===state.day){ state.dayData[clientId] = Object.assign(state.dayData[clientId]||{}, patch); }
        toast(`تم إضافة الحساب لـ «${c.name}»`);
        closeModal();
        if(date!==state.day && ss.scope==='day'){ state.day = date; bindDay(date); }
        updateSearchResults();
      }).catch(err=>{ $('#accSave').disabled=false; toast('خطأ: '+err.message); });
    };
  });
}

function ensureAllDays(force){
  if(!state.db || ss.loading) return;
  if(ss.allDays && !force) return;
  ss.loading = true; updateSearchResults();
  state.db.ref('days').once('value').then(snap=>{
    ss.allDays = snap.val()||{}; ss.loading=false; ss.loadedAt=Date.now(); updateSearchResults();
  }).catch(err=>{ ss.loading=false; toast('تعذر تحميل الأيام: '+err.message); updateSearchResults(); });
}

// ينقل العميل للرقم الجديد ويزحزح الباقي ويعيد الترقيم 1..N بدون فراغات
function placeClient(id, newNum){
  if(!state.db) return toast('مش متصل بقاعدة البيانات');
  const ids = sortedClients().map(([cid])=>cid).filter(cid=>cid!==id);
  const pos = Math.max(1, Math.min(Number(newNum)||1, ids.length+1));
  ids.splice(pos-1, 0, id);
  const updates = {};
  ids.forEach((cid,i)=>{
    const cur = state.clients[cid];
    if(!cur || cur.order!==i+1) updates['clients/'+cid+'/order'] = i+1;
  });
  if(!Object.keys(updates).length) return;
  state.db.ref().update(updates).then(()=>toast(`تم نقل العميل للرقم ${pos}`))
    .catch(err=>toast('خطأ: '+err.message));
}
async function sortClientsAlpha(){

}

/* ================= الموردين (بالأيام: آجل أمس + تحصيل + ترحيل لليوم التالي) =================
   - اليوم "الحالي" (meta/supHead) هو اللي بيتعدّل: أرقامه هي نفس خانات المورد (رصيد سابق = آجل أمس، مسدد = تحصيل)،
     فراس المال والتقفيلة والبحث بيفضلوا شغالين زي ما هما من غير أي تغيير.
   - «ترحيل لليوم التالي» بيحفظ لقطة اليوم (suppliers/<id>/days/<التاريخ>) وبيخلّي الرصيد النهائي = آجل أمس لليوم اللي بعده
     وبيصفّر المسحوبات والعمولة والتحصيل — كله في كتابة واحدة atomic. الأيام اللي فاتت بتتعرض للقراءة بس. */
const supHeadDay = () => state.supHead || todayStr();
function supInitHead(){
  if(state.supHead || state._supHeadInit || !state.db || !state.user || state.user.role!=='admin') return;
  state._supHeadInit = true;
  try{ state.db.ref('meta/supHead').transaction(v=>v||todayStr()).catch(()=>{ state._supHeadInit = false; }); }catch(e){ state._supHeadInit = false; }
}
/* حسبة الترحيل (بدون كتابة): بترجّع المسارات اللي هتتكتب + لقطة الأرصدة القديمة للتراجع */
function supCarryPlan(sups, from, to){
  const up = {}, prevFlat = {}; let total = 0, n = 0;
  Object.keys(sups||{}).forEach(id=>{
    const s = sups[id]; if(!s || typeof s!=='object' || !s.name) return;
    const prev = rnd2(s.prevBalance), w = rnd2(s.withdrawals), c = rnd2(s.commission), p = rnd2(s.paid), bal = rnd2(prev + w - c - p);
    up['suppliers/'+id+'/days/'+from] = {prev, withdrawals:w, commission:c, collection:p, bal};
    up['suppliers/'+id+'/prevBalance'] = bal; up['suppliers/'+id+'/withdrawals'] = 0;
    up['suppliers/'+id+'/commission'] = 0; up['suppliers/'+id+'/paid'] = 0;
    prevFlat[id] = {prevBalance:Number(s.prevBalance)||0, withdrawals:Number(s.withdrawals)||0, commission:Number(s.commission)||0, paid:Number(s.paid)||0};
    total = rnd2(total + bal); n++;
  });
  up['meta/supHead'] = to;
  return {up, prevFlat, total, n};
}
async function carrySuppliers(){
  if(carrySuppliers._busy) return; carrySuppliers._busy = true;
  const btn = $('#supCarryBtn'); if(btn) btn.disabled = true;

    if(!state.db) return toast('مش متصل بقاعدة البيانات');
    const [ss, hs] = await Promise.all([state.db.ref('suppliers').once('value'), state.db.ref('meta/supHead').once('value')]);
    const from = hs.val() || todayStr(), to = shiftDate(from, 1), plan = supCarryPlan(ss.val()||{}, from, to);
    if(!plan.n) return toast('مفيش موردين يترحّلوا');

  }catch(err){ toast('فشل الترحيل: '+err.message); }
  finally{ carrySuppliers._busy = false; const b = $('#supCarryBtn'); if(b) b.disabled = false; }

async function undoSupCarry(){
  if(undoSupCarry._busy) return; undoSupCarry._busy = true;
  try{
    if(!state.db) return toast('مش متصل بقاعدة البيانات');
    const [ls, hs, ss] = await Promise.all([state.db.ref('meta/supCarryLogs').once('value'), state.db.ref('meta/supHead').once('value'), state.db.ref('suppliers').once('value')]);
    const logs = ls.val()||{}, head = hs.val() || todayStr(), sups = ss.val()||{};
    const last = Object.entries(logs).filter(([k,l])=>l && !l.undone).sort((x,y)=>(y[1].createdAt||0)-(x[1].createdAt||0))[0];
    if(!last || last[1].to!==head) return toast('مفيش ترحيل أخير تتراجع عنه');
    const [logId, log] = last;
    if(!await askConfirm(`تتراجع عن ترحيل ${log.from} إلى ${log.to}؟\nأرصدة الموردين هترجع زي ما كانت يوم ${log.from}، وأي تعديل عملته على يوم ${log.to} بعد الترحيل هيضيع.`)) return;
    const up = {}; let n = 0;
    Object.entries(log.prev||{}).forEach(([id,v])=>{
      if(!sups[id]) return;   // مورد اتمسح بعد الترحيل: منرجّعوش
      up['suppliers/'+id+'/prevBalance'] = Number(v.prevBalance)||0; up['suppliers/'+id+'/withdrawals'] = Number(v.withdrawals)||0;
      up['suppliers/'+id+'/commission'] = Number(v.commission)||0; up['suppliers/'+id+'/paid'] = Number(v.paid)||0;
      up['suppliers/'+id+'/days/'+log.from] = null; n++;
    });
    up['meta/supHead'] = log.from; up['meta/supCarryLogs/'+logId+'/undone'] = true;
    await state.db.ref().update(up);
    state.supDay = log.from; toast(`تم التراجع عن الترحيل (${n} مورد)`); render();
  }catch(err){ toast('فشل التراجع: '+err.message); }
  finally{ undoSupCarry._busy = false; }
}

/* تعديل يوم فات + ترحيل تلقائي: بيحفظ لقطة اليوم وبيرحّل الرصيد لكل الأيام اللي بعده لحد اليوم الحالي (كتابة واحدة atomic) */
function supRollForward(s, id, day, vals, head){
  const up = {}, days = s.days || {};
  let prev = vals.prev, w = vals.w, c = vals.c, p = vals.p, d = day, n = 0;
  for(;;){
    const bal = rnd2(prev + w - c - p);
    up['suppliers/'+id+'/days/'+d] = {prev:rnd2(prev), withdrawals:rnd2(w), commission:rnd2(c), collection:rnd2(p), bal};
    d = shiftDate(d, 1);
    if(d >= head || ++n > 3700){ up['suppliers/'+id+'/prevBalance'] = bal; break; }
    const sn = days[d] || {};
    prev = bal; w = Number(sn.withdrawals)||0; c = Number(sn.commission)||0; p = Number(sn.paid!=null?sn.paid:sn.collection)||0;
  }
  return up;
}

        toast('تم الحفظ والترحيل'); closeModal(); render();

function renderImport(main){
  main.innerHTML = `
    <div class="topbar"><div><h1 class="display">استيراد من إكسيل</h1><div class="sub">ارفع شيت اليومية وهيتربط تلقائيًا بنفس المعادلة: آجل أمس + المسحوبات − التحصيل = المديونية</div></div></div>

function sheetToRows(){

}

function renderImportStep2(){
  const body = $('#importBody');
  const rows = sheetToRows();
  importState._allRows = rows;
  const sheetOpts = importState.wb.SheetNames.map(n=>`<option ${n===importState.sheetName?'selected':''}>${n}</option>`).join('');
  // guess header row: first row containing a cell matching common headers
  let guess = 1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r = rows[i]||[];
    if(r.some(c=>typeof c==='string' && /اسم|عميل|فوري|امان|التحصيل/.test(c))){ guess=i+1; break; }
  }
  importState.headerRow = importState.headerRow || guess;

  body.innerHTML = `
    <div class="row2">
      <div class="field"><label>الورقة (Sheet)</label><select id="impSheet">${sheetOpts}</select></div>
      <div class="field"><label>رقم صف العناوين</label><input id="impHeaderRow" type="number" min="1" value="${importState.headerRow}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>تاريخ هذه اليومية</label><input id="impDate" type="date" value="${importState.dateForImport}"></div>
    <div id="mappingArea" style="margin-top:14px"></div>
    <div class="ft" style="padding:0; margin-top:16px; justify-content:flex-start">
      <button class="btn primary" id="doImport">استيراد الآن</button>
    </div>
    <div id="importResult" style="margin-top:12px"></div>
  `;
  $('#impSheet').onchange = e=>{ importState.sheetName=e.target.value; importState.headerRow=null; renderImportStep2(); };
  $('#impHeaderRow').onchange = e=>{ importState.headerRow=Number(e.target.value); renderMapping(); };
  $('#impDate').onchange = e=> importState.dateForImport = e.target.value;
  renderMapping();
  $('#doImport').onclick = runImport;
}

  {key:'name', label:'اسم العميل', required:true, guess:/اسم.*عميل|عميل|محل/},
  {key:'fawry', label:'فوري', guess:/^فوري/},

  {key:'collection', label:'التحصيل', guess:/تحصيل/},
  {key:'debtYesterday', label:'آجل أمس (الرصيد السابق)', guess:/الاجل|آجل|اجل/},
];

function renderMapping(){
  const rows = importState._allRows;
  const hIdx = importState.headerRow-1;
  const header = rows[hIdx] || [];
  const colOpts = (selectedGuessRe)=>{
    let opts = `<option value="">— تجاهل —</option>`;
    header.forEach((h,i)=>{
      const label = h==null? `عمود ${i+1}` : String(h);
      const sel = selectedGuessRe && typeof h==='string' && selectedGuessRe.test(h) ? 'selected' : '';
      opts += `<option value="${i}" ${sel}>${escapeHtml(label)} (عمود ${colToLetter(i)})</option>`;
    });
    return opts;
  };
  const area = $('#mappingArea');
  area.innerHTML = `
    <div style="font-size:12.5px; color:var(--fg-dim); margin-bottom:8px; font-weight:700">اربط كل عمود بالحقل المناسب</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      ${FIELD_DEFS.map(f=>`
        <div class="field">
          <label>${f.label}${f.required?' *':''}</label>
          <select data-map="${f.key}">${colOpts(f.guess)}</select>
        </div>
      `).join('')}
    </div>
    <div class="tablewrap" style="margin-top:14px; max-height:260px; overflow-y:auto">
      <table style="min-width:600px">
        <thead><tr>${header.map((h,i)=>`<th>${h==null?'':escapeHtml(String(h))}<div style="font-weight:400">(${colToLetter(i)})</div></th>`).join('')}</tr></thead>
        <tbody>
          ${rows.slice(hIdx+1, hIdx+6).map(r=>`<tr>${header.map((h,i)=>`<td class="tnum">${r[i]==null?'':escapeHtml(String(r[i]))}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function colToLetter(i){
  let s=''; i++;
  while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); }
  return s;
}

function runImport(){
  const rows = importState._allRows;
  const hIdx = importState.headerRow-1;
  const mapping = {};
  $$('[data-map]').forEach(sel=>{ mapping[sel.dataset.map] = sel.value===''?null:Number(sel.value); });
  if(mapping.name==null){ toast('لازم تحدد عمود اسم العميل'); return; }
  if(!state.db){ toast('مش متصل بقاعدة البيانات بعد — افتح تبويب الإعدادات الأول'); return; }

  const date = importState.dateForImport;
  const dataRows = rows.slice(hIdx+1).filter(r=>{
    const name = mapping.name!=null ? r[mapping.name] : null;
    return name!=null && String(name).trim()!=='' && String(name).trim()!=='0';
  });

  // ابحث عن العملاء الحاليين بالاسم لتفادي التكرار
  const existingByName = {};
  Object.entries(state.clients).forEach(([id,c])=>{ if(c && c.name) existingByName[c.name.trim()] = id; });

  const clientUpdates = {};
  const dayUpdates = {};
  let order = Object.keys(state.clients).length;
  let imported = 0;

  dataRows.forEach(r=>{
    const name = String(r[mapping.name]).trim();
    if(!name) return;
    let id = existingByName[name];
    if(!id){
      id = uid();
      existingByName[name] = id;
      clientUpdates[id] = {name, active:true, order:order++};
    }
    const num = (idx)=> idx==null ? 0 : (Number(r[idx])||0);
    dayUpdates[id] = {collection: num(mapping.collection), debtYesterday: num(mapping.debtYesterday)};
    finKeys().forEach(k=>{ dayUpdates[id][k] = num(mapping[k]); });
    imported++;
  });

  const updates = {};
  Object.entries(clientUpdates).forEach(([id,v])=> updates['clients/'+id]=v );
  Object.entries(dayUpdates).forEach(([id,v])=> updates['days/'+date+'/'+id]=v );
  updates['meta/lastImport'] = {date, fileName: 'excel', rowCount: imported, importedAt: Date.now()};

  state.db.ref().update(updates).then(()=>{
    $('#importResult').innerHTML = `<div class="pill good" style="font-size:13px; padding:8px 14px">تم استيراد ${imported} عميل ليوم ${date} بنجاح ✓</div>`;
    toast('تم الاستيراد بنجاح');
    state.day = date; bindDay(date);
  }).catch(err=>{
    $('#importResult').innerHTML = `<div class="pill danger" style="font-size:13px; padding:8px 14px">خطأ أثناء الاستيراد: ${escapeHtml(err.message)}</div>`;
  });
}


/* ================= رفع المكن من إكسيل (اسم + رقم المكنة) =================
   - الاسم المتكرر في الشيت بيتجمّع في عميل واحد وتتضاف له كل المكن
   - لو العميل موجود (مطابقة بالاسم) بتتضاف المكن الجديدة على اللي عنده من غير ما تتمسح القديمة
   - لو مش موجود بيتعمل عميل جديد */
const mchState = {};
function mchKey(v){ return norm(v).replace(/[^0-9a-z؀-ۿ]/g,''); }
function mchNo(v){
  if(v==null) return '';
  if(typeof v==='number') return isFinite(v) ? String(Math.round(v)) : '';
  return norm(v).replace(/[,،\s]/g,'');
}
function mchTypeOf(v, def){
  const t = norm(v); if(!t) return def;
  const hit = MACHINE_TYPES.find(([k,l])=>t.includes(norm(l)) || t===k);
  return hit ? hit[0] : def;
}

      <div class="field"><label>ملف إكسيل (.xlsx)</label><input type="file" id="mchFile" accept=".xlsx,.xls,.csv"></div>

function mchUseSheet(name){
  const m = mchState;
  m.sheet = name;
  m.rows = XLSX.utils.sheet_to_json(m.wb.Sheets[name],{header:1,defval:null,raw:true});
  // اكتشاف صف العناوين والأعمدة
  m.header = 1; m.nameCol = m.noCol = m.typeCol = null;
  for(let i=0;i<Math.min(m.rows.length,15);i++){
    const r = m.rows[i]||[];
    const n = r.findIndex(c=>typeof c==='string' && /اسم|عميل|محل/.test(norm(c)));
    if(n>=0){
      m.header=i+1; m.nameCol=n;
      m.noCol = r.findIndex(c=>typeof c==='string' && /مكن|ماكين|رقم|serial|terminal/i.test(norm(c)) && !/اسم/.test(norm(c)));
      if(m.noCol<0) m.noCol = null;
      const t = r.findIndex(c=>typeof c==='string' && /نوع|شركه|شركة/.test(norm(c)));
      m.typeCol = t>=0 ? t : null;
      break;
    }
  }
  mchRenderOptions();
}
function mchRenderOptions(){
  const m = mchState, header = m.rows[m.header-1]||[];
  const colOpts = (cur, withNone)=> (withNone?`<option value="">— مفيش —</option>`:'<option value="">— اختر —</option>')

      ${m.mode==='retype'?`<div class="field"><label>من نوع</label><select id="mchFrom"><option value="">أي نوع</option>${MACHINE_TYPES.map(([k,l])=>`<option value="${k}" ${m.fromType===k?'selected':''}>${l}</option>`).join('')}</select></div>`:''}
      <div class="field"><label>${m.mode==='retype'?'حوّل إلى':'النوع الافتراضي'}</label><select id="mchDef">${MACHINE_TYPES.map(([k,l])=>`<option value="${k}" ${m.defType===k?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>

  const num = v => v===''?null:Number(v);
  $('#mchSheet').onchange = e=>mchUseSheet(e.target.value);
  $('#mchHeader').onchange = e=>{ m.header=Math.max(1,Number(e.target.value)||1); mchRenderOptions(); };

  if($('#mchFrom')) $('#mchFrom').onchange = e=>{ m.fromType=e.target.value; mchPreview(); };
  mchPreview();
}
function mchPreview(){
  const m = mchState, box = $('#mchPreview'), btn = $('#mchApply');
  m.plan = null; btn.disabled = true;
  if(m.mode==='retype') return mchPreviewRetype();
  if(m.nameCol==null || m.noCol==null){ box.innerHTML = '<div class="preview-box warn">اختار عمود الاسم وعمود رقم المكنة.</div>'; return; }
  // 1) تجميع الشيت بالاسم
  const groups = new Map();
  let blank = 0;
  m.rows.slice(m.header).forEach(r=>{
    const name = r[m.nameCol]==null ? '' : String(r[m.nameCol]).trim();
    const no = mchNo(r[m.noCol]);
    if(!name || !no){ if(name||no) blank++; return; }
    const k = mchKey(name);
    if(!groups.has(k)) groups.set(k, {name, machines:[]});
    const g = groups.get(k);
    const type = mchTypeOf(m.typeCol==null?null:r[m.typeCol], m.defType);
    if(!g.machines.some(x=>x.no===no && x.type===type)) g.machines.push({type, no});
  });
  // 2) مطابقة مع العملاء الحاليين
  const idx = upBuildIndex();
  const plan = [];
  let ordNext = maxOrder();
  groups.forEach(g=>{
    const hit = upMatch(g.name, idx);
    if(hit.dup){ plan.push({...g, status:'dup', added:[], skipped:[]}); return; }
    const cur = hit.id ? machinesOf(state.clients[hit.id]).map(x=>({type:x.type||'aman', no:String(x.no).trim()})) : [];
    const added = [], skipped = [];
    g.machines.forEach(x=>{
      (cur.some(c=>c.no===x.no) ? skipped : added).push(x);
    });
    plan.push({...g, id:hit.id||null, status: hit.id?'update':'new', cur, added, skipped});
  });
  // 3) رقم مكنة على أكتر من عميل
  const owners = {};
  plan.forEach(p=>(p.added||[]).forEach(x=>{ (owners[x.no]=owners[x.no]||new Set()).add(p.name); }));
  Object.entries(state.clients).forEach(([cid,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const o = owners[String(x.no).trim()]; if(o && !plan.some(p=>p.id===cid)) o.add(c.name);
  }); });
  const dupNos = Object.entries(owners).filter(([n,s])=>s.size>1);
  m.plan = plan;
  const nNew = plan.filter(p=>p.status==='new').length, nUpd = plan.filter(p=>p.status==='update' && p.added.length).length;
  const nSame = plan.filter(p=>p.status==='update' && !p.added.length).length, nDup = plan.filter(p=>p.status==='dup').length;
  const nMach = plan.reduce((a,p)=>a+p.added.length,0), nMulti = plan.filter(p=>p.machines.length>1).length;
  const badge = {new:'<span class="pill good">عميل جديد</span>', update:'<span class="pill neutral">موجود</span>', dup:'<span class="pill danger">اسم مكرر في الداتا</span>'};
  box.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-bottom:10px">
      <div class="stat"><div class="label">عملاء جدد</div><div class="val tnum">${nNew}</div></div>
      <div class="stat"><div class="label">عملاء هيتضاف لهم مكن</div><div class="val tnum">${nUpd}</div></div>
      <div class="stat"><div class="label">مكن جديدة</div><div class="val tnum">${nMach}</div></div>
      <div class="stat"><div class="label">عملاء بأكتر من مكنة</div><div class="val tnum">${nMulti}</div></div>
    </div>
    ${nSame?`<div class="preview-box">${nSame} عميل مكنهم متسجلة بالفعل — هيتخطوا.</div>`:''}
    ${nDup?`<div class="preview-box warn" style="margin-top:6px">${nDup} اسم ليه أكتر من عميل بنفس الاسم في الداتا — هيتخطوا (اتأكد منهم يدوي).</div>`:''}
    ${dupNos.length?`<div class="preview-box warn" style="margin-top:6px">رقم المكنة متكرر على أكتر من عميل:<br>${dupNos.map(([n,s])=>`<span class="tnum">${escapeHtml(n)}</span> ← ${[...s].map(escapeHtml).join(' / ')}`).join('<br>')}</div>`:''}
    ${blank?`<div class="preview-box warn" style="margin-top:6px">${blank} صف ناقص اسم أو رقم مكنة — اتخطى.</div>`:''}
    <div class="tablewrap" style="margin-top:10px; max-height:280px; overflow-y:auto">
      <table style="min-width:520px"><thead><tr><th>العميل</th><th>الحالة</th><th>المكن اللي هتتضاف</th></tr></thead><tbody>
      ${plan.map(p=>`<tr><td class="name-cell">${escapeHtml(p.name)}</td><td>${badge[p.status]}</td>
        <td style="text-align:start">${p.added.map(x=>`<span class="pill good" style="margin:1px">${machineLabel(x.type)} · <span class="tnum">${escapeHtml(x.no)}</span></span>`).join(' ')}
        ${(p.skipped||[]).map(x=>`<span class="pill neutral" style="margin:1px;opacity:.6" title="متسجلة بالفعل">${escapeHtml(x.no)}</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !(nNew || nMach);
}
/* تصحيح النوع: بنفس الشيت، أي رقم مكنة موجود عند عميل بنوع مختلف بيتغير للنوع المختار */
function mchPreviewRetype(){
  const m = mchState, box = $('#mchPreview'), btn = $('#mchApply');
  if(m.noCol==null){ box.innerHTML = '<div class="preview-box warn">اختار عمود رقم المكنة.</div>'; return; }
  const byNo = {};
  Object.entries(state.clients).forEach(([id,c])=>{ if(!c) return; machinesOf(c).forEach(x=>{
    const k = mchNo(x.no); (byNo[k]=byNo[k]||[]).push({id, type:x.type||'aman'});
  }); });
  const per = new Map(), seen = new Set(); let same = 0, missing = 0, total = 0, other = 0;
  m.rows.slice(m.header).forEach(r=>{
    const no = mchNo(r[m.noCol]); if(!no || seen.has(no)) return; seen.add(no);
    const to = mchTypeOf(m.typeCol==null?null:r[m.typeCol], m.defType);
    const hits = byNo[no]; if(!hits){ missing++; return; }
    hits.forEach(h=>{
      if(m.fromType && h.type!==m.fromType){ other++; return; }
      if(h.type===to){ same++; return; }
      if(!per.has(h.id)) per.set(h.id, {id:h.id, name:state.clients[h.id].name, items:[]});
      per.get(h.id).items.push({no, from:h.type, to}); total++;
    });
  });
  m.plan = [...per.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  box.innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); margin-bottom:10px">
      <div class="stat"><div class="label">مكن هيتغير نوعها</div><div class="val tnum">${total}</div></div>
      <div class="stat"><div class="label">عملاء</div><div class="val tnum">${m.plan.length}</div></div>
      <div class="stat"><div class="label">نوعها صح بالفعل</div><div class="val tnum">${same}</div></div>
    </div>
    ${other?`<div class="preview-box">${other} مكنة نوعها مش «${machineLabel(m.fromType)}» — هتتخطى.</div>`:''}
    ${missing?`<div class="preview-box warn" style="margin-top:6px">${missing} رقم مكنة مش موجود عند أي عميل — هيتخطى.</div>`:''}
    <div class="tablewrap" style="margin-top:10px; max-height:280px; overflow-y:auto">
      <table style="min-width:520px"><thead><tr><th>العميل</th><th>التغيير</th></tr></thead><tbody>
      ${m.plan.map(p=>`<tr><td class="name-cell">${escapeHtml(p.name)}</td><td style="text-align:start">${p.items.map(x=>`<span class="pill neutral" style="margin:1px"><span class="tnum">${escapeHtml(x.no)}</span> · ${machineLabel(x.from)} ← ${machineLabel(x.to)}</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table></div>`;
  btn.disabled = !total;
}

const MCH_LOG = 'meta/machineUploads';
function mchLoadHistory(){
  return state.db.ref(MCH_LOG).orderByKey().limitToLast(15).once('value').then(s=>{
    const v = s.val() || {};
    mchState.hist = Object.entries(v).map(([id,h])=>({id, ...h})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return mchState.hist;
  }).catch(()=>{ mchState.hist = []; return []; });
}
function mchRenderHistory(){
  const box = $('#mchHistory'); if(!box) return;
  const hist = (mchState.hist||[]).slice(0,6);
  if(!hist.length){ box.innerHTML=''; return; }
  box.innerHTML = `

        <td class="tnum">${h.createdAt? new Date(h.createdAt).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):''}</td>
        <td style="font-size:12.5px">${escapeHtml(h.fileName||'')}</td>

        <td>${h.undone ? '<span class="pill neutral">اتلغت</span>' : `<button class="btn sm danger" data-mchundo="${h.id}">تراجع</button>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  $$('[data-mchundo]').forEach(b=>b.onclick = ()=>mchUndo(b.dataset.mchundo));
